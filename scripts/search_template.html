<title>所得税用語検索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 検索ヘッダーを上部に固定し、広い画面では「結果一覧｜本文」の2ペイン、狭い画面では一覧→本文の切替 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18212d;
  --muted: #586373;
  --line: #d9dfe7;
  --accent: #1f4d8c;
  --accent-soft: #e4ecf7;
  --mark: #ffe7a0;
  --mark-ink: #18212d;
  --c-hikazei: #0b7466;
  --c-kubun: #1f4d8c;
  --c-shotoku: #8d4a08;
  --c-zeigaku: #7b2c6c;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --header-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
    --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
    --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
  --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
  --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.7; margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, .result:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ヘッダー */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 14px 12px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; letter-spacing: .04em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.searchbox { position: relative; }
.searchbox input {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 84px 10px 40px;
}
.searchbox input::placeholder { color: var(--muted); }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.searchbox kbd, .searchbox .clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
}
.searchbox kbd {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
}
.searchbox .clear {
  font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px;
}
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
  display: inline-flex; gap: 6px; align-items: center;
}
.chip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .n { color: var(--surface); opacity: .8; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.status { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* 本体 */
main.wrap { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; padding-block: 18px 40px; }
.list { display: grid; gap: 2px; align-content: start; min-width: 0; }
.group-label {
  font-size: 12px; letter-spacing: .08em; color: var(--muted); padding: 14px 10px 4px;
  display: flex; align-items: center; gap: 8px;
}
.group-label:first-child { padding-top: 0; }
.group-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.result {
  display: grid; gap: 2px; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; width: 100%;
}
.result:hover { background: var(--accent-soft); }
.result[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.result .row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.result .term { font-weight: 700; min-width: 0; }
.result .code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.result .ry { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; overflow-wrap: anywhere; }
.result .snip { font-size: 12.5px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill {
  font-size: 11px; color: var(--c); border: 1px solid currentColor; border-radius: 4px;
  padding: 0 5px; white-space: nowrap; line-height: 1.6;
}
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 8px; cursor: pointer; margin-top: 6px; }
.empty { color: var(--muted); padding: 24px 10px; }
.empty p { margin: 0 0 10px; }

.detail {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 26px 32px 32px; min-width: 0; align-self: start;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 18px);
  max-height: calc(100vh - var(--header-h) - 36px - env(safe-area-inset-top, 0px)); overflow-y: auto;
}
.back { display: none; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0 0 12px; cursor: pointer; }
.detail .eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.detail h2 { font-family: var(--font-display); font-size: 27px; line-height: 1.4; margin: 6px 0 2px; text-wrap: balance; }
.detail .yomi { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); letter-spacing: .06em; overflow-wrap: anywhere; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0 0 18px; padding: 12px 0; border-block: 1px solid var(--line); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.law { font-family: var(--font-mono); font-size: 12px; }
.lead { font-size: 16px; margin: 0 0 18px; }
.body { max-width: 72ch; overflow-wrap: anywhere; }
.body h3 { font-size: 17px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.body h4 { font-size: 15.5px; margin: 20px 0 6px; }
.body h5, .body h6 { font-size: 14.5px; margin: 16px 0 4px; color: var(--muted); }
.body p { margin: 0 0 10px; }
.body ul { margin: 0 0 12px; padding-left: 1.4em; }
.body li { margin: 2px 0; }
.tbl { overflow-x: auto; margin: 6px 0 14px; }
.tbl table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; text-align: left; }
.tbl th { background: var(--bg); font-weight: 700; }
.tbl td { font-variant-numeric: tabular-nums; }
.related { display: grid; gap: 12px; margin: 0 0 16px; padding: 0; list-style: none; }
.related li { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.related a { font-weight: 700; }
.related p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.source { margin-top: 26px; font-size: 12.5px; color: var(--muted); }

footer.wrap { padding-block: 0 32px; color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  main.wrap { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; overflow: visible; padding: 18px 16px 24px; }
  .detail h2 { font-size: 23px; }
  .back { display: inline-block; }
  body.reading .list { display: none; }
  body:not(.reading) .detail { display: none; }
  .searchbox kbd { display: none; }
  .status { width: 100%; margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .result { transition: background-color .12s; }
}
</style>
<!--BODY-->
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>所得税用語検索</h1>
      <p>国税庁タックスアンサーをもとにした 非課税・所得区分・所得控除・税額控除 の辞書</p>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="q" type="search" autocomplete="off" placeholder="用語・読み・金額・条文で検索（例：ふよう、123万円、所法9、NISA）" aria-label="検索">
      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" hidden>クリア</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="カテゴリで絞り込む"></div>
  </div>
</header>
<main class="wrap">
  <nav class="list" id="list" aria-label="検索結果"></nav>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>
<footer class="wrap" id="foot"></footer>

<script id="dict-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("dict-data").textContent);
  var CATS = DATA.categories;
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var ITEMS = DATA.items;
  var BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), listEl = $("list"), detailEl = $("detail"), filtersEl = $("filters");
  var state = { q: "", cat: "all", current: null, limit: 60 };

  // ---- 正規化（全角/半角・カタカナ/ひらがな・大文字小文字を同一視） ----
  function normChar(ch) {
    var n = ch.normalize("NFKC").toLowerCase();
    return n.replace(/[ァ-ヶ]/g, function (k) { return String.fromCharCode(k.charCodeAt(0) - 0x60); });
  }
  function norm(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) out += normChar(s[i]);
    return out;
  }
  // 元文字列の位置を保ったまま正規化する（ハイライト用）
  function normMap(s) {
    var out = "", map = [];
    for (var i = 0; i < s.length; i++) {
      var n = normChar(s[i]);
      for (var j = 0; j < n.length; j++) map.push(i);
      out += n;
    }
    return { text: out, map: map };
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(md) {
    return (md || "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/<br>/g, " ")
      .replace(/^#+\s*/gm, "").replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").replace(/\|/g, " ")
      .replace(/-{3,}/g, " ").replace(/[ \t]+/g, " ");
  }

  // ---- インデックス ----
  ITEMS.forEach(function (it) {
    var rel = (it.related || []).map(function (r) { return r.title + " " + r.summary; }).join(" ");
    it.plainBody = plain(it.md) + " " + rel;
    it.n = {
      term: norm(it.term), alias: norm(it.alias || ""), law: norm(it.basis || ""),
      code: it.code ? "no." + it.code + " " + it.code : "",
      summary: norm(it.summary || ""), group: norm(it.group || ""), body: norm(it.plainBody),
      yomi: it.yomi || ""
    };
  });

  // 読み辞書: ひらがなの入力を、読みがその入力で始まる漢字表記に広げる（例: ふよう → 扶養、扶養親族…）
  var YOMI = DATA.yomi.map(function (p) { return { s: norm(p[0]), r: p[1] }; });
  function isKana(t) { return /^[ぁ-んー]+$/.test(t); }
  function expand(t) {
    var alts = [t];
    if (isKana(t) && t.length >= 2) {
      YOMI.forEach(function (y) {
        if (y.r.indexOf(t) === 0 && alts.indexOf(y.s) < 0) alts.push(y.s);
      });
    }
    return alts;
  }
  // 各語を { t: 入力, alts: [入力, 漢字表記…] } にする
  function tokens(q) {
    return norm(q).split(/\s+/).filter(Boolean).map(function (t) { return { t: t, alts: expand(t) }; });
  }
  function flat(toks) {
    var out = [];
    toks.forEach(function (k) { k.alts.forEach(function (a) { if (out.indexOf(a) < 0) out.push(a); }); });
    return out.sort(function (a, b) { return b.length - a.length; });
  }
  function anyIn(h, alts) {
    for (var i = 0; i < alts.length; i++) if (h.indexOf(alts[i]) >= 0) return true;
    return false;
  }

  function score(it, toks) {
    var s = 0;
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i].t, alts = toks[i].alts, n = it.n, hit = 0;
      if (n.term === t) hit += 40;
      if (n.term.indexOf(t) === 0) hit += 16;
      if (anyIn(n.term, alts)) hit += 20;
      if (n.yomi && n.yomi === t) hit += 36;
      else if (n.yomi.indexOf(t) === 0) hit += 22;
      else if (t.length >= 2 && n.yomi.indexOf(t) >= 0) hit += 16;
      if (anyIn(n.alias, alts)) hit += 14;
      if (n.code.indexOf(t) >= 0) hit += 14;
      if (n.law.indexOf(t) >= 0) hit += 6;
      if (anyIn(n.group, alts)) hit += 4;
      if (anyIn(n.summary, alts)) hit += 4;
      var c = 0;
      alts.forEach(function (a) { c += count(n.body, a); });
      if (c) hit += 1 + Math.min(c, 8) * 0.25;
      if (!hit) return 0;
      s += hit;
    }
    if (it.kind === "overview") s -= 0.5;
    return s;
  }
  function count(h, t) {
    var c = 0, i = h.indexOf(t);
    while (i >= 0 && c < 50) { c++; i = h.indexOf(t, i + t.length); }
    return c;
  }

  // ---- ハイライト ----
  function highlight(text, toks) {
    if (!toks.length) return esc(text);
    var m = normMap(text), ranges = [];
    toks.forEach(function (t) {
      var i = m.text.indexOf(t);
      while (i >= 0) {
        ranges.push([m.map[i], m.map[i + t.length - 1] + 1]);
        i = m.text.indexOf(t, i + t.length);
      }
    });
    if (!ranges.length) return esc(text);
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", pos = 0;
    ranges.forEach(function (r) {
      if (r[0] < pos) return;
      out += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>";
      pos = r[1];
    });
    return out + esc(text.slice(pos));
  }
  function snippet(it, toks) {
    var text = it.summary || it.plainBody.trim() || [it.group, it.basis].filter(Boolean).join("・");
    if (toks.length) {
      var src = it.summary + " " + it.plainBody, m = normMap(src), best = -1;
      for (var i = 0; i < toks.length; i++) {
        var at0 = m.text.indexOf(toks[i]);
        if (at0 >= 0 && (best < 0 || at0 < best)) best = at0;
      }
      if (best >= 0) {
        var at = m.map[best], start = Math.max(0, at - 28);
        text = (start > 0 ? "…" : "") + src.slice(start, start + 110).trim();
      }
    }
    return highlight(text.slice(0, 140), toks);
  }

  // ---- Markdown（本文の表記に限った簡易変換。HTMLはすべてエスケープ） ----
  function inline(s) {
    var h = esc(s).replace(/&lt;br&gt;/g, "<br>");
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (_, t, u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  // 横に結合されていたセルを colspan に戻す（見出しは同じ値の連続、本文は空セル）
  function tableRow(cells, tag) {
    var out = [], prev = null;
    cells.forEach(function (c) {
      var merge = prev && (tag === "th" ? c === prev.text : c === "" && prev.text !== "");
      if (merge) { prev.span++; return; }
      prev = { text: c, span: 1 };
      out.push(prev);
    });
    return "<tr>" + out.map(function (c) {
      return "<" + tag + (c.span > 1 ? ' colspan="' + c.span + '"' : "") + ">" + inline(c.text) + "</" + tag + ">";
    }).join("") + "</tr>";
  }
  function mdToHtml(md) {
    var blocks = (md || "").split(/\n{2,}/), out = [];
    blocks.forEach(function (b) {
      var lines = b.split("\n");
      var h = /^(#{1,6})\s+(.*)$/.exec(lines[0]);
      if (h && lines.length === 1) {
        var lv = Math.min(6, Math.max(3, h[1].length));
        out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">");
        return;
      }
      if (lines.every(function (l) { return /^\|/.test(l); }) && lines.length >= 2) {
        var rows = lines.filter(function (l) { return !/^\|(-+\|)+\s*$/.test(l); }).map(function (l) {
          return l.replace(/^\|\s?|\s?\|\s*$/g, "").split(" | ");
        });
        var t = '<div class="tbl"><table><thead>' + tableRow(rows[0], "th") + "</thead><tbody>";
        rows.slice(1).forEach(function (r) { t += tableRow(r, "td"); });
        out.push(t + "</tbody></table></div>");
        return;
      }
      if (lines.length > 1 && !/^\|/.test(lines[0]) && /^\|/.test(lines[1])) {
        // 表の見出し（キャプション）+ 表
        out.push("<p><strong>" + inline(lines[0].replace(/\*\*/g, "")) + "</strong></p>");
        out.push(mdToHtml(lines.slice(1).join("\n")));
        return;
      }
      if (lines.every(function (l) { return /^\s*- /.test(l); })) {
        var html = "", depth = -1;
        lines.forEach(function (l) {
          var d = Math.floor(/^\s*/.exec(l)[0].length / 2);
          while (depth < d) { html += "<ul>"; depth++; }
          while (depth > d) { html += "</ul>"; depth--; }
          html += "<li>" + inline(l.replace(/^\s*- /, "")) + "</li>";
        });
        while (depth-- >= 0) html += "</ul>";
        out.push(html);
        return;
      }
      out.push("<p>" + lines.map(inline).join("<br>") + "</p>");
    });
    return out.join("");
  }
  function markIn(root, toks) {
    if (!toks.length) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var h = highlight(node.nodeValue, toks);
      if (h.indexOf("<mark>") < 0) return;
      var span = document.createElement("span");
      span.innerHTML = h;
      node.parentNode.replaceChild(span, node);
    });
  }

  // ---- 描画 ----
  function catStyle(id) { return "--c: var(--c-" + CAT[id].color + ")"; }

  function renderFilters(counts) {
    var html = '<button class="chip" type="button" data-cat="all" aria-pressed="' + (state.cat === "all") + '">すべて<span class="n">' + counts.all + "</span></button>";
    CATS.forEach(function (c) {
      html += '<button class="chip" type="button" data-cat="' + c.id + '" style="' + catStyle(c.id) + '" aria-pressed="' + (state.cat === c.id) + '"><span class="dot"></span>' + esc(c.name) + '<span class="n">' + (counts[c.id] || 0) + "</span></button>";
    });
    html += '<span class="status" id="status"></span>';
    filtersEl.innerHTML = html;
  }

  function search() {
    var toks = tokens(state.q), res = [];
    ITEMS.forEach(function (it) {
      var s = toks.length ? score(it, toks) : 1;
      if (s > 0) res.push({ it: it, s: s });
    });
    if (toks.length) res.sort(function (a, b) { return b.s - a.s || a.it.order - b.it.order; });
    return { toks: toks, all: res };
  }

  function render() {
    var r = search(), toks = flat(r.toks), kana = r.toks.filter(function (k) { return isKana(k.t); }).map(function (k) { return k.t; }), counts = { all: r.all.length };
    r.all.forEach(function (x) { counts[x.it.cat] = (counts[x.it.cat] || 0) + 1; });
    renderFilters(counts);
    var shown = r.all.filter(function (x) { return state.cat === "all" || x.it.cat === state.cat; });
    $("status").textContent = toks.length ? ITEMS.length + "語中 " + shown.length + "件" : ITEMS.length + "語を収録";
    $("clear").hidden = !state.q;
    $("kbd").hidden = !!state.q;

    if (!shown.length) {
      listEl.innerHTML = '<div class="empty"><p>「' + esc(state.q) + "」に一致する用語はありません。</p><p>言葉を短くするか、別の言い方（例：「住宅ローン」→「住宅借入金」）で探してください。</p></div>";
      return;
    }
    var html = "", lastCat = null, list = shown.slice(0, state.limit);
    list.forEach(function (x) {
      var it = x.it;
      if (!toks.length && it.cat !== lastCat) {
        html += '<div class="group-label" style="' + catStyle(it.cat) + '"><span class="dot"></span>' + esc(CAT[it.cat].name) + "</div>";
        lastCat = it.cat;
      }
      html += '<button class="result" type="button" data-id="' + it.id + '" style="' + catStyle(it.cat) + '" aria-current="' + (state.current === it.id) + '">' +
        '<span class="row">' + (toks.length ? '<span class="pill">' + esc(CAT[it.cat].name) + "</span>" : "") +
        '<span class="term">' + highlight(it.term, toks) + "</span>" +
        (it.code ? '<span class="code">No.' + it.code + "</span>" : "") + "</span>" +
        (kana.length && anyIn(it.n.yomi, kana) && !anyIn(it.n.term, toks) ? '<span class="ry">' + highlight(it.yomi, kana) + "</span>" : "") +
        '<span class="snip">' + snippet(it, toks) + "</span></button>";
    });
    if (shown.length > list.length) html += '<button class="more" type="button" id="more">さらに ' + (shown.length - list.length) + " 件を表示</button>";
    listEl.innerHTML = html;
    if (!state.current || !shown.some(function (x) { return x.it.id === state.current; })) {
      if (window.innerWidth > 860) select(shown[0].it.id, false);
    } else {
      renderDetail();
    }
  }

  function select(id, focusDetail) {
    if (!BY_ID[id]) return;
    state.current = id;
    Array.prototype.forEach.call(listEl.querySelectorAll(".result"), function (b) {
      b.setAttribute("aria-current", String(b.getAttribute("data-id") === id));
    });
    renderDetail();
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    if (focusDetail) {
      document.body.classList.add("reading");
      if (window.innerWidth <= 860) window.scrollTo(0, 0);
    }
    detailEl.scrollTop = 0;
  }

  function renderDetail() {
    var it = BY_ID[state.current];
    if (!it) { detailEl.innerHTML = ""; return; }
    var c = CAT[it.cat], toks = flat(tokens(state.q)), h = "";
    h += '<button class="back" type="button" id="back">← 一覧へ戻る</button>';
    h += '<div class="eyebrow" style="' + catStyle(it.cat) + '"><span class="pill">' + esc(c.name) + "</span>" +
      (it.kind === "overview" ? "<span>あらまし</span>" : "") + (it.group ? "<span>" + esc(it.group) + "</span>" : "") + "</div>";
    h += "<h2>" + esc(it.term) + "</h2>";
    if (it.yomi) h += '<p class="yomi">' + esc(it.yomi) + "</p>";
    h += '<dl class="meta">';
    if (it.code) h += '<dt>タックスアンサー</dt><dd><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + "</a></dd>";
    else h += '<dt>出典</dt><dd><a href="' + esc(it.url) + '" target="_blank" rel="noopener">No.2011 課税される所得と非課税所得</a></dd>';
    if (it.alias) h += "<dt>通称</dt><dd>" + esc(it.alias) + "</dd>";
    if (it.basis) h += '<dt>根拠法令等</dt><dd class="law">' + esc(it.basis) + "</dd>";
    if (it.asOf) h += "<dt>基準</dt><dd>" + esc(it.asOf) + "</dd>";
    h += "</dl>";
    if (it.kind === "hikazei") {
      h += '<p class="lead">' + esc(c.description) + "</p>";
      if (it.related && it.related.length) {
        h += '<div class="body"><h3>関連するタックスアンサー</h3></div><ul class="related">';
        it.related.forEach(function (r) {
          h += '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a><p>" + esc(r.summary) + "</p></li>";
        });
        h += "</ul>";
      }
      var sib = ITEMS.filter(function (x) { return x.kind === "hikazei" && x.group === it.group && x.id !== it.id; });
      if (sib.length) {
        h += '<div class="body"><h3>同じ区分（' + esc(it.group) + "）の非課税所得</h3><ul>" +
          sib.map(function (x) { return '<li><a href="#' + x.id + '" data-jump="' + x.id + '">' + esc(x.term) + "</a></li>"; }).join("") + "</ul></div>";
      }
    } else {
      h += '<div class="body">' + mdToHtml(it.md) + "</div>";
    }
    h += '<p class="source">この内容は国税庁ホームページのタックスアンサーを転載・整形したものです。最新の内容は<a href="' + esc(it.url) + '" target="_blank" rel="noopener">出典ページ</a>で確認してください。</p>';
    detailEl.innerHTML = h;
    markIn(detailEl.querySelector("h2"), toks);
    if (it.yomi) markIn(detailEl.querySelector(".yomi"), toks);
    Array.prototype.forEach.call(detailEl.querySelectorAll(".body, .related, .lead"), function (el) { markIn(el, toks); });
  }

  // ---- イベント ----
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = qEl.value.trim(); state.limit = 60; state.current = null;
      document.body.classList.remove("reading");
      render();
    }, 80);
  });
  $("clear").addEventListener("click", function () { qEl.value = ""; state.q = ""; state.current = null; render(); qEl.focus(); });
  filtersEl.addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    state.cat = b.getAttribute("data-cat"); state.limit = 60; state.current = null;
    document.body.classList.remove("reading");
    render();
  });
  listEl.addEventListener("click", function (e) {
    if (e.target.id === "more") { state.limit += 200; render(); return; }
    var b = e.target.closest(".result");
    if (b) select(b.getAttribute("data-id"), true);
  });
  listEl.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var btns = Array.prototype.slice.call(listEl.querySelectorAll(".result"));
    var i = btns.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    var next = btns[Math.max(0, Math.min(btns.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
    next.focus();
    if (window.innerWidth > 860) select(next.getAttribute("data-id"), false);
  });
  detailEl.addEventListener("click", function (e) {
    if (e.target.id === "back") { document.body.classList.remove("reading"); return; }
    var j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); select(j.getAttribute("data-jump"), true); }
  });
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { var f = listEl.querySelector(".result"); if (f) { e.preventDefault(); f.focus(); } }
    if (e.key === "Enter") { var g = listEl.querySelector(".result"); if (g) select(g.getAttribute("data-id"), true); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
  });
  function setHeaderH() {
    document.documentElement.style.setProperty("--header-h", document.querySelector("header.top").offsetHeight + "px");
  }
  window.addEventListener("resize", setHeaderH);

  $("foot").innerHTML = "出典: <a href=\"" + esc(DATA.source_url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(DATA.source) + "</a>（" + esc(DATA.as_of) + "）。国税庁の公式サービスではありません。生成日 " + esc(DATA.generated_at) + "。";

  var initial = (location.hash || "").slice(1);
  render();
  setHeaderH();
  if (BY_ID[initial]) select(initial, window.innerWidth <= 860);
})();
</script>
