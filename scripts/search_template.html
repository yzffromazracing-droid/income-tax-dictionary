<title>所得税区分辞書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 検索ヘッダーを上部に固定し、広い画面では「結果一覧｜本文」の2ペイン、狭い画面では一覧→本文の切替 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18212d;
  --muted: #586373;
  --line: #d9dfe7;
  --accent: #1f4d8c;
  --accent-soft: #e4ecf7;
  --mark: #ffe7a0;
  --mark-ink: #18212d;
  --c-hikazei: #0b7466;
  --c-kubun: #1f4d8c;
  --c-shotoku: #8d4a08;
  --c-zeigaku: #7b2c6c;
  --c-tsutatsu: #4d5a2a;
  --c-aoiro: #3f3fb8;
  --c-kiji: #8a5a00;
  --c-nenmatsu: #a8323e;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --header-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
    --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
    --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2; --c-tsutatsu: #b9c98a; --c-aoiro: #a9adf5; --c-kiji: #e8b653; --c-nenmatsu: #f2939b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
  --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
  --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2; --c-tsutatsu: #b9c98a; --c-aoiro: #a9adf5; --c-kiji: #e8b653; --c-nenmatsu: #f2939b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.7; margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, .result:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ヘッダー */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 14px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-body); font-size: 21px; font-weight: 700; margin: 0; letter-spacing: .03em; }
.searchbox { position: relative; }
.searchbox input {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 84px 10px 40px;
}
.searchbox input::placeholder { color: var(--muted); }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.searchbox kbd, .searchbox .clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
}
.searchbox kbd {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
}
.searchbox .clear {
  font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px;
}
/* カテゴリのタブ */
.tabbar { display: flex; align-items: flex-end; gap: 12px; margin-bottom: -12px; min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; color: var(--c); white-space: nowrap;
  background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0;
  padding: 8px 14px 9px; display: inline-flex; gap: 7px; align-items: center;
}
.tab:hover { background: color-mix(in srgb, var(--c) 8%, transparent); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tab .n {
  font-family: var(--font-mono); font-size: 11px; color: var(--c);
  background: color-mix(in srgb, var(--c) 13%, transparent); border-radius: 999px; padding: 0 7px; line-height: 1.6;
}
.tab .n.zero { opacity: .5; }
.tab[aria-selected="true"] { font-weight: 700; background: color-mix(in srgb, var(--c) 14%, transparent); border-bottom-color: var(--c); }
.tab[aria-selected="true"] .n { color: var(--surface); background: var(--c); }
/* 所得区分の下のタブ（所得の種類） */
header.top.has-sub .tabbar { margin-bottom: 0; border-bottom: 1px solid var(--line); }
.subtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding-top: 2px; }
.subtabs::-webkit-scrollbar { display: none; }
@media (min-width: 861px) { .subtabs { flex-wrap: wrap; } }
.subtab {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--c); white-space: nowrap;
  background: color-mix(in srgb, var(--c) 6%, transparent); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); border-radius: 999px;
  padding: 3px 12px; display: inline-flex; gap: 5px; align-items: center;
}
.subtab:hover { background: color-mix(in srgb, var(--c) 14%, transparent); }
.subtab[aria-selected="true"] { color: var(--surface); font-weight: 700; background: var(--c); border-color: var(--c); }
.subtab .n { font-family: var(--font-mono); font-size: 11px; color: inherit; opacity: .8; }
.subtab .n.zero { opacity: .5; }
/* 3段目のタブ（譲渡所得の課税方法など） */
.subtabs.sub2 { align-items: center; padding-top: 0; }
.subtabs.sub2::before { content: "└"; color: var(--muted); margin: 0 4px 0 10px; }
.subtabs.sub2 .subtab { font-size: 12.5px; padding: 2px 10px; }
.subtabs.sub2 .subtab[aria-selected="true"] { color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); border-color: var(--c); }
.status { margin-left: auto; padding-bottom: 12px; color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 本体 */
main.wrap { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; padding-block: 18px 40px; }
.list { display: grid; gap: 2px; align-content: start; min-width: 0; }
.group-label {
  font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--c); padding: 14px 10px 4px;
  display: flex; align-items: center; gap: 8px;
}
.group-label:first-child { padding-top: 0; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; line-height: 1.6; }
.empty .others { display: flex; flex-wrap: wrap; gap: 8px; }
.empty .others button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.result {
  display: grid; gap: 2px; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 0; border-left: 4px solid color-mix(in srgb, var(--c) 30%, transparent); border-radius: 6px; padding: 8px 10px; width: 100%;
}
.result:hover { background: color-mix(in srgb, var(--c) 7%, transparent); }
.result[aria-current="true"] { background: color-mix(in srgb, var(--c) 9%, var(--surface)); border-left-color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, var(--line)); }
.result .row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.result .term { font-weight: 700; min-width: 0; }
.result .code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.result .ry { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; overflow-wrap: anywhere; }
.result .snip { font-size: 12.5px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill {
  font-size: 11.5px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  border-radius: 999px; padding: 1px 9px; white-space: nowrap; line-height: 1.6;
}
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 8px; cursor: pointer; margin-top: 6px; }
.empty { color: var(--muted); padding: 24px 10px; }
.empty p { margin: 0 0 10px; }

.detail {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 26px 32px 32px; min-width: 0; align-self: start;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 18px);
  max-height: calc(100vh - var(--header-h) - 36px - env(safe-area-inset-top, 0px)); overflow-y: auto;
}
.back { display: none; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0 0 12px; cursor: pointer; }
.detail .eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.detail h2 { font-family: var(--font-display); font-size: 27px; line-height: 1.4; margin: 6px 0 2px; text-wrap: balance; }
.detail .yomi { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); letter-spacing: .06em; overflow-wrap: anywhere; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0 0 18px; padding: 12px 0; border-block: 1px solid var(--line); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.law { font-family: var(--font-mono); font-size: 12px; }
.body { max-width: 72ch; overflow-wrap: anywhere; }
.body h3 { font-size: 17px; margin: 28px 0 8px; padding: 0 0 4px 10px; border-bottom: 1px solid color-mix(in srgb, var(--c, var(--line)) 30%, var(--line)); border-left: 4px solid var(--c, var(--line)); }
.body h4 { font-size: 15.5px; margin: 20px 0 6px; }
.body h5, .body h6 { font-size: 14.5px; margin: 16px 0 4px; color: var(--muted); }
.body p { margin: 0 0 10px; }
.body ul { margin: 0 0 12px; padding-left: 1.4em; }
.body li { margin: 2px 0; }
.tbl { overflow-x: auto; margin: 6px 0 14px; }
.tbl table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; text-align: left; }
.tbl th { background: var(--bg); font-weight: 700; }
.tbl td { font-variant-numeric: tabular-nums; }
.examples ul { padding-left: 1.2em; }
.examples li { margin: 4px 0; }
.examples .to { margin-left: 6px; font-weight: 700; color: var(--c); }
.examples .src { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-left: 4px; }
.examples .src:hover { color: var(--accent); }
/* 源泉徴収税額表 */
.zh-lead { margin: 0 0 12px; max-width: 72ch; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; margin: 0 0 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.calc label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.calc input[type=text] { font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; font-variant-numeric: tabular-nums; }
.calc input[type=text]:focus { outline: 2px solid var(--c); outline-offset: 1px; }
.calc .chk { flex-direction: row; align-items: center; gap: 6px; grid-column: 1 / -1; color: var(--ink); }
.zh-res { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 6px; }
.zh-res div { border-left: 3px solid var(--c); padding: 2px 0 2px 10px; }
.zh-res span { display: block; font-size: 12.5px; color: var(--muted); }
.zh-res b { font-size: 22px; font-variant-numeric: tabular-nums; }
.zh-how { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); max-width: 72ch; }
.zh-wrap { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0 16px; }
table.zh { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; width: 100%; }
table.zh th, table.zh td { padding: 4px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.zh thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line); }
table.zh th:first-child, table.zh td:first-child { text-align: left; }
table.zh tr.f td { text-align: left; white-space: normal; color: var(--muted); }
table.zh tr.f td div { max-width: 40em; }
table.zh tr.hit td { background: color-mix(in srgb, var(--c) 20%, transparent); }
.related { margin: 0 0 16px; padding-left: 1.4em; }
.related li { margin: 2px 0; }
.source { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.source p { margin: 0; }
.source .meta { border: 0; padding: 0; margin: 0 0 10px; color: var(--ink); }
.rule { border-top: 1px solid var(--line); margin: 12px 0 18px; }

footer.wrap { padding-block: 0 32px; color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  main.wrap { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; overflow: visible; padding: 18px 16px 24px; }
  .detail h2 { font-size: 23px; }
  .back { display: inline-block; }
  body.reading .list { display: none; }
  body:not(.reading) .detail { display: none; }
  .searchbox kbd { display: none; }
  .status { display: none; }
  .tabs { flex: 1; }
  /* 5つのタブを1行に収めるため、件数はタブ名の下に小さく出し、検索中だけ表示する */
  .tab { flex: 0 0 auto; flex-direction: column; justify-content: center; gap: 0; padding: 8px 9px 7px; font-size: 13px; }
  .tab .dot { display: none; }
  .tab .n { background: none; padding: 0; font-size: 10.5px; line-height: 1.3; }
  body:not(.searching) .tab .n { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .result { transition: background-color .12s; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>所得税区分辞書</h1>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="q" type="search" autocomplete="off" placeholder="用語・読み・金額・条文・通達番号で検索（例：ふよう、123万円、所法9、36-30）" aria-label="検索">
      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" hidden>クリア</button>
    </div>
    <div class="tabbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="カテゴリ"></div>
      <span class="status" id="status"></span>
    </div>
    <div class="subtabs" id="subtabs" role="tablist" aria-label="所得の種類" hidden></div>
    <div class="subtabs sub2" id="subtabs2" role="tablist" aria-label="課税方法" hidden></div>
  </div>
</header>
<main class="wrap">
  <nav class="list" id="list" role="tabpanel" aria-label="用語の一覧"></nav>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>
<footer class="wrap" id="foot"></footer>

<script id="dict-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("dict-data").textContent);
  var CATS = DATA.categories;
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var ITEMS = DATA.items;
  var BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), listEl = $("list"), detailEl = $("detail"), tabsEl = $("tabs");
  var state = { q: "", cat: CATS[0].id, sub: "all", sub2: "all", current: null, limit: 60 };
  var subtabsEl = $("subtabs");
  var SUB = {};
  var SUB2 = {};
  CATS.forEach(function (c) {
    c.subtabs.forEach(function (t) {
      SUB[t.id] = { cat: c.id, name: t.name, children: t.children || [] };
      (t.children || []).forEach(function (k) { SUB2[k.id] = { cat: c.id, sub: t.id, name: k.name }; });
    });
  });
  var subtabs2El = document.getElementById("subtabs2");

  // ---- 正規化（全角/半角・カタカナ/ひらがな・大文字小文字を同一視） ----
  function normChar(ch) {
    var n = ch.normalize("NFKC").toLowerCase();
    return n.replace(/[ァ-ヶ]/g, function (k) { return String.fromCharCode(k.charCodeAt(0) - 0x60); });
  }
  function norm(s) {
    return s.normalize("NFKC").toLowerCase()
      .replace(/[ァ-ヶ]/g, function (k) { return String.fromCharCode(k.charCodeAt(0) - 0x60); });
  }
  // 元文字列の位置を保ったまま正規化する（ハイライト用）
  function normMap(s) {
    var out = "", map = [];
    for (var i = 0; i < s.length; i++) {
      var n = normChar(s[i]);
      for (var j = 0; j < n.length; j++) map.push(i);
      out += n;
    }
    return { text: out, map: map };
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(md) {
    return (md || "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/<br>/g, " ")
      .replace(/^#+\s*/gm, "").replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").replace(/\|/g, " ")
      .replace(/-{3,}/g, " ").replace(/[ \t]+/g, " ");
  }

  // ---- インデックス ----
  ITEMS.forEach(function (it) {
    var rel = (it.examples || []).map(function (x) { return x.text + " " + (x.other || x.tax || ""); })
      .concat((it.related || []).map(function (r) { return r.title; })).join(" ");
    it.plainBody = plain(it.md) + " " + rel;
    it.n = {
      term: norm(it.term), alias: norm(it.alias || ""), law: norm(it.basis || ""),
      code: it.code ? "no." + it.code + " " + it.code : norm(it.label || ""),
      summary: norm(it.summary || ""), group: norm(it.group || ""), body: norm(it.plainBody),
      yomi: it.yomi || ""
    };
  });

  // 読み辞書: ひらがなの入力を、読みがその入力で始まる漢字表記に広げる（例: ふよう → 扶養、扶養親族…）
  var YOMI = DATA.yomi.map(function (p) { return { s: norm(p[0]), r: p[1] }; });
  function isKana(t) { return /^[ぁ-んー]+$/.test(t); }
  function expand(t) {
    var alts = [t];
    if (isKana(t) && t.length >= 2) {
      YOMI.forEach(function (y) {
        if (y.r.indexOf(t) === 0 && alts.indexOf(y.s) < 0) alts.push(y.s);
      });
    }
    return alts;
  }
  // 各語を { t: 入力, alts: [入力, 漢字表記…] } にする
  function tokens(q) {
    return norm(q).split(/\s+/).filter(Boolean).map(function (t) { return { t: t, alts: expand(t) }; });
  }
  function flat(toks) {
    var out = [];
    toks.forEach(function (k) { k.alts.forEach(function (a) { if (out.indexOf(a) < 0) out.push(a); }); });
    return out.sort(function (a, b) { return b.length - a.length; });
  }
  function anyIn(h, alts) {
    for (var i = 0; i < alts.length; i++) if (h.indexOf(alts[i]) >= 0) return true;
    return false;
  }

  function score(it, toks) {
    var s = 0;

          f = t[col].filter(function (x) { return x.over < amt; }).pop();
          v = f.base + pct(amt - f.over, f.rate);
          how = yen(f.base) + "円に、" + yen(f.over) + "円を超える金額の" + f.rate + "％を加算"; r = col + f.over;
        }
      }
    }
    if (col === "ko" && extra) { v = Math.max(0, v - extra); how += "（7人を超える1人ごとに" + yen(t.over7) + "円を控除）"; }
    return { tax: v, how: how, row: r, u: u };
  }
  function bonusRate(t, prev, n, col) {
    var k = Math.min(n, 7);
    for (var i = 0; i < t.rows.length; i++) {
      var p = col === "ko" ? t.rows[i].ko[k] : t.rows[i].otsu;
      if (!p) continue;
      if ((p[0] == null || prev >= p[0] * 1000) && (p[1] == null || prev < p[1] * 1000)) return { rate: t.rows[i].rate, row: "b" + i };
    }
  }
  function bonusTax(t, m, prev, bonus, n, col, m12) {
    var d = m12 ? 12 : 6, a, b0;
    if (prev <= 0) {
      a = wageTax(m, Math.floor(bonus / d), n, col);
      return { tax: a.tax * d, how: "前月の給与がないため月額表で計算：賞与÷" + d + "＝" + yen(Math.floor(bonus / d)) + "円の税額 " + yen(a.tax) + "円 × " + d };
    }
    if (bonus > prev * 10) {
      a = wageTax(m, Math.floor(bonus / d) + prev, n, col); b0 = wageTax(m, prev, n, col);
      return { tax: (a.tax - b0.tax) * d, how: "賞与が前月の給与の10倍を超えるため月額表で計算：（" + yen(Math.floor(bonus / d) + prev) + "円の税額 " + yen(a.tax) + "円 − 前月の給与の税額 " + yen(b0.tax) + "円）× " + d };
    }
    var r = bonusRate(t, prev, n, col);
    return { tax: pct(bonus, r.rate), rate: r.rate, row: r.row, how: "賞与の金額 × " + r.rate + "％" };
  }
  function zhField(id, label, val, ph) {
    return '<label>' + esc(label) + '<input type="text" inputmode="numeric" autocomplete="off" id="' + id + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"></label>';
  }
  function zeigakuhyoHtml(it) {
    var t = it.tbl, h = '<p class="zh-lead">' + esc(it.summary) + "</p>", cols, i;
    h += '<div class="body"><h3>税額を求める</h3></div><form class="calc" style="' + catStyle(it.cat) + '" onsubmit="return false">';
    if (t.kind === "shoyo") {
      h += zhField("zh-prev", "前月の給与等の金額（社会保険料等控除後）", zh.prev, "例：285454") +
        zhField("zh-bonus", "賞与の金額（社会保険料等控除後）", zh.bonus, "例：389558") +
        zhField("zh-n", "扶養親族等の数（人）", zh.n, "0") +
        '<label class="chk"><input type="checkbox" id="zh-12"' + (zh.m12 ? " checked" : "") + '>賞与の計算期間が6か月を超える（月額表で計算するときに使います）</label>';
    } else {
      h += zhField("zh-amt", "その" + t.unit + "の給与等の金額（社会保険料等控除後）", zh.amt, t.unit === "月" ? "例：300000" : "例：12000") +
        zhField("zh-n", "扶養親族等の数（人）", zh.n, "0");
    }
    h += '</form><div id="zh-out" style="' + catStyle(it.cat) + '"></div>';
    h += '<div class="body"><h3>税額表</h3><p>' + esc(it.basis) + "</p></div>";
    h += '<div class="zh-wrap" id="zh-wrap" style="' + catStyle(it.cat) + '"><table class="zh"><thead><tr>';
    if (t.kind === "shoyo") {
      h += "<th>賞与の金額に乗ずべき率</th>";
      for (i = 0; i < 8; i++) h += "<th>甲 " + i + "人" + (i === 7 ? "以上" : "") + "</th>";
      h += "<th>乙</th></tr></thead><tbody>";
      var rng = function (p) { return !p ? "" : p[0] == null ? yen(p[1]) + "千円未満" : p[1] == null ? yen(p[0]) + "千円以上" : yen(p[0]) + "〜" + yen(p[1]) + "千円"; };
      t.rows.forEach(function (r, j) {
        h += '<tr data-row="b' + j + '"><td>' + r.rate + "％</td>" + r.ko.map(function (p) { return "<td>" + rng(p) + "</td>"; }).join("") + "<td>" + rng(r.otsu) + "</td></tr>";
      });
    } else {
      var daily = t.kind === "nichigaku", nc = daily ? 13 : 12;
      h += "<th>以上</th><th>未満</th>";
      for (i = 0; i < 8; i++) h += "<th>甲 " + i + "人</th>";
      h += "<th>乙</th>" + (daily ? "<th>丙</th>" : "") + "</tr></thead><tbody>";
      var b = t.below;
      h += '<tr data-row="below"><td colspan="2">' + yen(b.under) + "円未満</td>" + b.ko.map(function (v) { return "<td>" + yen(v) + "</td>"; }).join("") +
        "<td>金額の" + b.otsu_rate + "％</td>" + (daily ? "<td>" + yen(b.hei) + "</td>" : "") + "</tr>";
      t.rows.forEach(function (r, j) {
        h += '<tr data-row="r' + j + '">' + r.map(function (v) { return "<td>" + yen(v) + "</td>"; }).join("") + "</tr>";
      });
      t.flow.forEach(function (f) {
        if (f.type === "step") {
          h += '<tr data-row="s' + f.at + '"><td colspan="2">' + yen(f.at) + "円</td>" + f.ko.map(function (v) { return "<td>" + yen(v) + "</td>"; }).join("") +
            "<td>" + yen(f.otsu) + "</td>" + (daily ? "<td>" + yen(f.hei) + "</td>" : "") + "</tr>";
        } else {
          var key = (f.type === "ko" ? "k" : f.type) + f.range.replace(/[^0-9,].*$/, "").replace(/,/g, "");
          h += '<tr class="f" data-row="' + key + '"><td colspan="2">' + esc(f.range) + '</td><td colspan="' + (nc - 2) + '"><div>' + esc(f.text) + "</div></td></tr>";
        }
      });
    }
    h += "</tbody></table></div>";
    var notes = it.md.split("\n\n").slice(1).join("\n\n");
    if (notes) h += '<div class="body"><h3>表の注・備考</h3>' + mdToHtml(notes) + "</div>";
    h += '<div class="body"><p><a href="' + esc(it.fileUrl) + '" target="_blank" rel="noopener">国税庁の Excel ファイル</a>（計算式の部分は1円未満を切り捨てて表示しています）</p></div>';
    return h;
  }
  function updateCalc() {
    var it = BY_ID[state.current];
    if (!it || it.kind !== "zeigakuhyo") return;
    var t = it.tbl, out = $("zh-out"), wrap = $("zh-wrap"), n = num(zh.n) || 0, res = [], hit = null, how = "";
    if (t.kind === "shoyo") {
      var prev = num(zh.prev), bonus = num(zh.bonus), m = BY_ID[t.monthly].tbl;
      if (prev == null || bonus == null) { out.innerHTML = '<p class="zh-how">前月の給与等の金額と賞与の金額を入れると、甲欄・乙欄の税額を表示します（前月の給与がないときは 0 と入れてください）。</p>'; }
      else {
        var ko = bonusTax(t, m, prev, bonus, n, "ko", zh.m12), ot = bonusTax(t, m, prev, bonus, n, "otsu", zh.m12);
        res = [["甲欄（扶養親族等 " + n + "人）", ko], ["乙欄", ot]];
        hit = ko.row; how = "甲欄：" + ko.how + "／乙欄：" + ot.how;
      }
    } else {
      var amt = num(zh.amt);
      if (amt == null) { out.innerHTML = '<p class="zh-how">金額を入れると、甲欄・乙欄' + (t.kind === "nichigaku" ? "・丙欄" : "") + "の税額を表示します。</p>"; }
      else {
        var cols = [["甲欄（扶養親族等 " + n + "人）", "ko"], ["乙欄", "otsu"]].concat(t.kind === "nichigaku" ? [["丙欄", "hei"]] : []);
        res = cols.map(function (c) { return [c[0], wageTax(t, amt, n, c[1])]; });
        hit = res[0][1].row; how = res.map(function (x) { return x[0].replace(/（.*/, "") + "：" + x[1].how; }).join("／");
      }
    }
    if (res.length) {
      out.innerHTML = '<div class="zh-res">' + res.map(function (x) {
        return "<div><span>" + esc(x[0]) + (x[1].rate != null ? "　率 " + x[1].rate + "％" : "") + "</span><b>" + yen(x[1].tax) + "</b> 円</div>";
      }).join("") + '</div><p class="zh-how">' + esc(how) + "</p>";
    }
    Array.prototype.forEach.call(wrap.querySelectorAll("tr.hit"), function (r) { r.classList.remove("hit"); });
    var row = hit && wrap.querySelector('tr[data-row="' + hit + '"]');
    if (row) { row.classList.add("hit"); wrap.scrollTop = Math.max(0, row.offsetTop - wrap.clientHeight / 2); }
  }
  function renderDetail() {
    var it = BY_ID[state.current];
    if (!it) { detailEl.innerHTML = ""; return; }
    var c = CAT[it.cat], toks = flat(tokens(state.q)), h = "";
    detailEl.setAttribute("style", catStyle(it.cat));
    h += '<button class="back" type="button" id="back">← 一覧へ戻る</button>';
    h += '<div class="eyebrow" style="' + catStyle(it.cat) + '"><span class="pill">' + esc(c.name) + "</span>" +
      (it.sub && (it.kind === "tsutatsu" || it.kind === "kiji") ? "<span>" + esc(SUB[it.sub].name) + "</span>" : "") +
      (it.kind === "overview" ? "<span>あらまし</span>" : "") + (it.group ? "<span>" + esc(it.group) + "</span>" : "") +
      (it.section ? "<span>" + esc(it.section) + "</span>" : "") + "</div>";
    h += "<h2>" + esc(it.term) + "</h2>";
    if (it.yomi) h += '<p class="yomi">' + esc(it.yomi) + "</p>";
    if (it.alias) h += '<dl class="meta"><dt>通称</dt><dd>' + esc(it.alias) + "</dd></dl>";
    else h += '<div class="rule"></div>';
    if (it.kind === "zeigakuhyo") {
      h += zeigakuhyoHtml(it);
    } else if (it.kind === "hikazei") {
      h += examplesHtml(it);
      if (it.related && it.related.length) {
        h += '<div class="body"><h3>関連するタックスアンサー</h3></div><ul class="related">';
        it.related.forEach(function (r) {
          h += '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + "</a></li>";
        });
        h += "</ul>";
      }
      var sib = ITEMS.filter(function (x) { return x.kind === "hikazei" && x.group === it.group && x.id !== it.id; });
      if (sib.length) {
        h += '<div class="body"><h3>同じ区分（' + esc(it.group) + "）の非課税所得</h3><ul>" +
          sib.map(function (x) { return '<li><a href="#' + x.id + '" data-jump="' + x.id + '">' + esc(x.term) + "</a></li>"; }).join("") + "</ul></div>";
      }
    } else {
      h += examplesHtml(it);
      h += '<div class="body">' + mdToHtml(it.md) + "</div>";
      if (it.relatedTsutatsu && it.relatedTsutatsu.length) {
        h += '<div class="body"><h3>関連する通達（所得税基本通達）</h3><ul>' + it.relatedTsutatsu.map(function (t) {
          return '<li><a href="#' + t.id + '" data-jump="' + t.id + '">' + esc(t.term) + "</a></li>";
        }).join("") + "</ul></div>";
      }
    }
    // 根拠法令等・基準・タックスアンサーは本文の後ろにまとめる
    h += '<div class="source"><dl class="meta">';
    if (it.basis) h += '<dt>根拠法令等</dt><dd class="law">' + esc(it.basis) + "</dd>";
    if (it.asOf) h += "<dt>基準</dt><dd>" + esc(it.asOf) + "</dd>";
    if (it.issued) h += "<dt>番号・日付</dt><dd>" + esc(it.issued) + "</dd>";
    h += "<dt>" + esc(it.srcLabel || "タックスアンサー") + '</dt><dd><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      esc(it.srcTitle || (it.code ? it.title : "No.2011 課税される所得と非課税所得")) + "</a></dd></dl>" +
      "<p>この内容は国税庁ホームページの" + (it.kind === "tsutatsu" ? "法令解釈通達" : it.kind === "kiji" || it.kind === "zeigakuhyo" ? it.srcLabel : "タックスアンサー") +
      "を転載・整形したものです。最新の内容はリンク先で確認してください。</p></div>";
    detailEl.innerHTML = h;
    markIn(detailEl.querySelector("h2"), toks);
    if (it.yomi) markIn(detailEl.querySelector(".yomi"), toks);
    Array.prototype.forEach.call(detailEl.querySelectorAll(".body, .related, .meta"), function (el) { markIn(el, toks); });
    if (it.kind === "zeigakuhyo") updateCalc();
  }

  // ---- イベント ----
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = qEl.value.trim(); state.limit = 60; state.current = null; state.autoTab = true; state.sub = "all"; state.sub2 = "all";
      document.body.classList.remove("reading");
      render();
    }, 80);
  });
  $("clear").addEventListener("click", function () { qEl.value = ""; state.q = ""; state.current = null; render(); qEl.focus(); });
  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) setTab(b.getAttribute("data-cat"));
  });
  subtabsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".subtab");
    if (b) setSub(b.getAttribute("data-sub"));
  });
  subtabs2El.addEventListener("click", function (e) {
    var b = e.target.closest(".subtab");
    if (b) setSub2(b.getAttribute("data-sub2"));
  });
  subtabs2El.addEventListener("keydown", function (e) {
    var ids = ["all"].concat(SUB[state.sub].children.map(function (k) { return k.id; }));
    var i = ids.indexOf(state.sub2), n = ids.length;
    var next = { ArrowRight: (i + 1) % n, ArrowLeft: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    setSub2(ids[next]);
  });
  subtabsEl.addEventListener("keydown", function (e) {
    var ids = ["all"].concat(CAT[state.cat].subtabs.map(function (t) { return t.id; }));
    var i = ids.indexOf(state.sub), n = ids.length;
    var next = { ArrowRight: (i + 1) % n, ArrowLeft: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    setSub(ids[next]);
  });
  tabsEl.addEventListener("keydown", function (e) {
    var i = CATS.map(function (c) { return c.id; }).indexOf(state.cat), n = CATS.length;
    var next = { ArrowRight: (i + 1) % n, ArrowLeft: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    setTab(CATS[next].id);
  });
  listEl.addEventListener("click", function (e) {
    if (e.target.id === "more") { state.limit += 200; render(); return; }
    var t = e.target.closest("[data-cat]");
    if (t) { setTab(t.getAttribute("data-cat")); return; }
    var u = e.target.closest("[data-sub]");
    if (u) { setSub(u.getAttribute("data-sub")); return; }
    var w = e.target.closest("[data-sub2]");
    if (w) { setSub2(w.getAttribute("data-sub2")); return; }
    var b = e.target.closest(".result");
    if (b) select(b.getAttribute("data-id"), true);
  });
  listEl.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var btns = Array.prototype.slice.call(listEl.querySelectorAll(".result"));
    var i = btns.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    var next = btns[Math.max(0, Math.min(btns.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
    next.focus();
    if (window.innerWidth > 860) select(next.getAttribute("data-id"), false);
  });
  detailEl.addEventListener("input", function (e) {
    var id = e.target.id;
    if (!/^zh-/.test(id)) return;
    if (id === "zh-12") zh.m12 = e.target.checked; else zh[id.slice(3)] = e.target.value;
    updateCalc();
  });
  detailEl.addEventListener("click", function (e) {
    if (e.target.id === "back") { document.body.classList.remove("reading"); return; }
    var j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); jumpTo(j.getAttribute("data-jump")); }
  });
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { var f = listEl.querySelector(".result"); if (f) { e.preventDefault(); f.focus(); } }
    if (e.key === "Enter") { var g = listEl.querySelector(".result"); if (g) select(g.getAttribute("data-id"), true); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); qEl.select(); }
  });
  function setHeaderH() {
    document.documentElement.style.setProperty("--header-h", document.querySelector("header.top").offsetHeight + "px");
  }
  window.addEventListener("resize", setHeaderH);

  $("foot").innerHTML = "出典: <a href=\"" + esc(DATA.source_url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(DATA.source) + "</a>（" + esc(DATA.as_of) + "）。国税庁の公式サービスではありません。生成日 " + esc(DATA.generated_at) + "。";

  var initial = (location.hash || "").slice(1);
  if (BY_ID[initial]) { state.cat = BY_ID[initial].cat; state.sub = BY_ID[initial].sub || "all"; state.sub2 = (BY_ID[initial].sub2 || []).length === 1 ? BY_ID[initial].sub2[0] : "all"; }
  else if (CAT[initial]) state.cat = initial;
  else if (SUB[initial]) { state.cat = SUB[initial].cat; state.sub = initial; }
  else if (SUB2[initial]) { state.cat = SUB2[initial].cat; state.sub = SUB2[initial].sub; state.sub2 = initial; }
  render();
  setHeaderH();
  if (BY_ID[initial]) select(initial, window.innerWidth <= 860);
})();
</script>
