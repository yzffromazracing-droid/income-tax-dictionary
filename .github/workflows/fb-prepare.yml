name: 所得税豆知識 翌日の投稿案

# 毎日 17:47（日本時間）に翌日分の投稿案（本文と図）を作り、PR にしてそのまま main にマージする（事前確認なし）。
# main にある投稿案が、翌日 10:57 に Facebook に投稿される（fb-post.yml）。
# 投稿をやめるときは posts/日付.done.json を置き、本文を直すときは main の posts/日付.json を直す。
# PR を作るには Settings → Actions → General の「Allow GitHub Actions to create and approve pull requests」を有効にする。
on:
  schedule:
    - cron: "47 8 * * *"
    # 時刻実行が遅れたり飛ばされたりしたときの予備（20:17）。案がもうあれば何もしない。
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "投稿日 YYYY-MM-DD（空なら明日）"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 図は resvg（PyPI）と Noto Sans JP（npm の @expo-google-fonts/noto-sans-jp）で描く。
      # apt の配布サーバーが止まって投稿案が作れないことがあったので、apt は使わない。
      - name: Cache Japanese fonts
        uses: actions/cache@v4
        with:
          path: ~/fbfonts
          key: noto-sans-jp-0.4.4
      - name: Install SVG renderer and Japanese fonts
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do timeout 120 pip install -q resvg-py==0.5.0 && break; [ $i = 3 ] && exit 1; sleep 15; done
          if [ ! -f ~/fbfonts/NotoSansJP_800ExtraBold.ttf ]; then
            mkdir -p ~/fbfonts && cd "$RUNNER_TEMP"
            for i in 1 2 3; do timeout 180 npm pack -q @expo-google-fonts/noto-sans-jp@0.4.4 && break; [ $i = 3 ] && exit 1; sleep 15; done
            tar xzf expo-google-fonts-noto-sans-jp-0.4.4.tgz -C ~/fbfonts --strip-components=2 \
              package/400Regular/NotoSansJP_400Regular.ttf package/700Bold/NotoSansJP_700Bold.ttf package/800ExtraBold/NotoSansJP_800ExtraBold.ttf
          fi
          ls ~/fbfonts
          echo "FB_FONT_DIR=$HOME/fbfonts" >> "$GITHUB_ENV"
      - name: Make the post
        id: make
        run: |
          DATE="${{ inputs.date }}"
          # 12時間前の日付の翌日にする。実行が夜中過ぎまで遅れても、予定どおりの日の案を作る。
          [ -n "$DATE" ] || DATE=$(TZ=Asia/Tokyo date -d '12 hours ago' +%F | xargs -I{} date -d '{} +1 day' +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -f "posts/$DATE.json" ]; then echo "$DATE の投稿案はもう main にあります"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 案のブランチがもうあれば作り直さず、その PR をマージする。
          if git ls-remote --exit-code --heads origin "fb/$DATE" >/dev/null; then echo "fb/$DATE はもうあります"; echo "existing=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/fb_post.py prepare --date="$DATE"
      - name: Open and merge a pull request
        if: steps.make.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.make.outputs.date }}
        run: |
          BR="fb/$DATE"
          if [ "${{ steps.make.outputs.existing }}" != "1" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add "posts/$DATE.json" "posts/$DATE.png" "posts/$DATE.md"
          git commit -q -m "所得税豆知識：$DATE の投稿案"
          git push -q -f -u origin "$BR"
          {
            echo "$DATE 10:57 に投稿する「所得税豆知識」の案です。事前確認なしで自動でマージします。"
            echo "投稿をやめるときは main に posts/$DATE.done.json を置き、本文を直すときは main の posts/$DATE.json の message を直してください。"
            echo
            echo "![図](https://github.com/${{ github.repository }}/blob/main/posts/$DATE.png?raw=true)"
            echo
            echo '```text'
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['message'])" "posts/$DATE.json"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr view "$BR" >/dev/null 2>&1 || gh pr create --base main --head "$BR" --title "所得税豆知識（$DATE）の投稿案" --body-file "$RUNNER_TEMP/body.md"
          fi
          # 事前確認なしでマージする（PR の作成直後はマージできるか判定中のことがあるので数回やり直す）。
          for i in 1 2 3 4 5 6; do
            gh pr merge "$BR" --merge && break
            [ "$(gh pr view "$BR" --json state -q .state)" = "MERGED" ] && break
            [ "$i" = 6 ] && exit 1
            sleep 10
          done
          git push -q origin --delete "$BR" || true
