name: 所得税豆知識 Facebook 投稿

# 毎日 10:57（日本時間。毎時0分は混雑で遅れやすいのでずらしている）に、
# main にある posts/今日の日付.json（前日に確認してマージした投稿案）を Facebook ページに投稿する。
# GitHub の時刻実行は遅れたり飛ばされたりするので、11:37・12:17 にも予備で動かす。
# 投稿すると posts/日付.done.json を main に残し、2回目以降は投稿しない。時刻実行が遅れても、その日のうちなら投稿する（日付が変わったら投稿しない）。
# 投稿案がない日は投稿しない。消費税豆知識（consumption-tax-dictionary）と同じページ・同じトークンを使う。
on:
  schedule:
    - cron: "57 1 * * *"
    - cron: "37 2 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "投稿日 YYYY-MM-DD（空なら今日）"
        required: false
      dry_run:
        description: "投稿せずに本文を表示するだけ"
        type: boolean
        default: false

permissions:
  contents: write

# 予備の実行が重なっても、前の実行が終わって印を残してから次が動く。
concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post to Facebook page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(TZ=Asia/Tokyo date +%F)
          # 20261123 のような書き方でも YYYY-MM-DD にそろえる（投稿済みの印のファイル名と合わせるため）。
          DATE=$(date -d "$DATE" +%F) || { echo "日付の書き方が正しくありません：$DATE"; exit 1; }
          # 投稿案と投稿済みの印は、いつも main の最新を見る。
          git fetch -q origin main && git checkout -q FETCH_HEAD -- posts
          DEADLINE=""
          [ "${{ github.event_name }}" = "schedule" ] && DEADLINE="--deadline=24"
          python3 scripts/fb_post.py publish --date="$DATE" $DEADLINE ${{ inputs.dry_run && '--dry-run' || '' }}
          # 今回投稿して印ができたとき（main にはまだ印がないとき）だけ、印を main に残す。
          if [ -f "posts/$DATE.done.json" ] && ! git cat-file -e "FETCH_HEAD:posts/$DATE.done.json" 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # main の最新の上に印だけを足して送る（main が先に進んでいたら取り直して載せ直す）。
            git checkout -q -B fb-done FETCH_HEAD
            git add "posts/$DATE.done.json"
            git commit -q -m "所得税豆知識：$DATE を投稿済み"
            ok=""
            for i in 1 2 3; do
              git push -q origin HEAD:main && ok=1 && break
              sleep 5; git fetch -q origin main && git rebase -q FETCH_HEAD || true
            done
            # 印を main に残せないと、遅れて来た実行がもう一度投稿してしまうので、失敗として知らせる。
            [ -n "$ok" ] || { echo "投稿済みの印（posts/$DATE.done.json）を main に残せませんでした"; exit 1; }
            echo "投稿済みの印を main に残しました：posts/$DATE.done.json"
          fi
