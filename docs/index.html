r>合<br>計<br>所<br>得<br>金<br>額 | 105万円超　110万円以下 | 16万円 | 11万円 | 6万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 110万円超　115万円以下 | 11万円 | 8万円 | 4万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 115万円超　120万円以下 | 6万円 | 4万円 | 2万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 120万円超　123万円以下 | 3万円 | 2万円 | 1万円 |\n\n### 対象者または対象物\n\n一定の要件に該当する配偶者がいる方\n\n### 手続き\n\n年末調整において給与所得者が配偶者特別控除の適用を受けようとする場合については、[コード2672「年末調整で配偶者控除または配偶者特別控除の適用を受けるとき」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2672.htm)で説明していますので、ご確認ください。\n\n### 注意事項\n\n平成28年分より、非居住者である配偶者について配偶者特別控除を受ける際には、以下の書類を提出または提示しなければなりません。\n\n・控除を受ける人の配偶者であることが確認できる書類（戸籍の附票の写しその他の国または地方公共団体が発行した書類およびその国外居住配偶者の旅券の写し等）\n\n・控除を受ける人が配偶者の生活費等に充てるための支払を行ったことが確認できる書類（送金依頼書、クレジットカード利用明細書等）","order":54},{"id":"no1199","cat":"shotoku-kojo","sub":"","kind":"entry","term":"基礎控除","yomi":"きそこうじょ","code":"1199","title":"No.1199 基礎控除","summary":"確定申告や年末調整において所得税額の計算をする場合に、総所得金額などから差し引くことができる控除の1つに基礎控除があります。","basis":"所法86、措法41の16の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm","md":"### 概要\n\n確定申告や年末調整において所得税額の計算をする場合に、総所得金額などから差し引くことができる控除の1つに基礎控除があります。\n\n#### 基礎控除の金額\n\n基礎控除は、納税者本人の[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)に応じてそれぞれ次のとおりとなります。\n\n| 納税者本人の合計所得金額 | 控除額 / 令和6年分<br>以前 | 控除額 / 令和7年分 | 控除額 / 令和8年分<br>令和9年分<br>以後 | 控除額 / 令和10年分以後 |\n|---|---|---|---|---|\n| 132万円以下 | 48万円 | 95万円 | 104万円 | 99万円 |\n| 132万円超 336万円以下 | 48万円 | 88万円 | 104万円 | 62万円 |\n| 336万円超 489万円以下 | 48万円 | 68万円 | 104万円 | 62万円 |\n| 489万円超 655万円以下 | 48万円 | 63万円 | 67万円 | 62万円 |\n| 655万円超2,350万円以下 | 48万円 | 58万円 | 62万円 | 62万円 |\n| 2,350万円超2,400万円以下 | 48万円 | 48万円 | 48万円 | 48万円 |\n| 2,400万円超2,450万円以下 | 32万円 | 32万円 | 32万円 | 32万円 |\n| 2,450万円超2,500万円以下 | 16万円 | 16万円 | 16万円 | 16万円 |\n| 2,500万円超 | ０円 | ０円 | ０円 | ０円 |\n\n(注１) 令和8年分の上記規定は、令和8年12月1日に施行されます。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n(注２) 令和8年11月30日以前に、令和8年分の所得税の死亡又は出国に伴う準確定申告書の提出をする方は、令和7年分以前と同様に改正前の基礎控除の金額を適用しますので、令和8年11月30日以前に提出された準確定申告書については、令和8年12月1日以後、更正の請求により改正後の基礎控除の金額を適用することができます。\n\n(注３) 令和7年分以後の基礎控除の金額は、居住者でない場合、令和7年分は58万円、令和8年分以後は62万円が最高額となります。\n\n(注４) 令和元年分以前の基礎控除の金額は、納税者本人の合計所得金額にかかわらず、一律38万円です。","order":55},{"id":"no1200","cat":"zeigaku-kojo","sub":"","kind":"overview","term":"税額控除","yomi":"ぜいがくこうじょ","code":"1200","title":"No.1200 税額控除","summary":"税額控除とは、課税所得金額に税率を乗じて算出した所得税額から、一定の金額を控除するものです。","basis":"所法92、93、95、措法10、10の2、10の2の2、10の3、10の4、10の4の2、10の5、10の5の3、10の5の4、10の5の6、10の６、41、41の3の2、41の18、41の18の2、41の18の3、41の19の2～41の19の4、旧措法10の2、10の5、10の5の2、10の5の5、10の5の6、震災特例法8、10の2～10の5、13、13の2、令2改正法附則58、令３改正法附則26、28","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1200.htm","md":"### 概要\n\n税額控除とは、課税所得金額に税率を乗じて算出した所得税額から、一定の金額を控除するものです。\n\n#### 税額控除の主なもの\n\n税額控除の主なものは、次のとおりです。\n\n##### 配当控除\n\n総合課税の[配当所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1330.htm)がある場合に、原則として、配当所得の金額の10パーセントまたは5パーセントに相当する金額を控除するものです。\n\nなお、申告分離課税を選択した上場株式等に係る配当所得については、配当控除は適用できません。\n\n詳しくは、[コード1250「配当所得があるとき(配当控除)」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1250.htm)を参照してください。\n\n##### 分配時調整外国税相当額控除\n\n集団投資信託の収益の分配等の支払を受ける場合に、その収益の分配に係る所得税の額から控除された外国所得税の額のうち、その支払を受ける収益の分配に対応する部分の金額に相当する金額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n##### 外国税額控除\n\n日本で課税される所得の中に外国で生じた所得があり、その所得に対してその外国の法令により所得税に相当する税金が課税されている場合に、一定額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n詳しくは、[コード1240「居住者に係る外国税額控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1240.htm)を参照してください。\n\n##### 政党等寄附金特別控除\n\n政党または政治資金団体に対して政治活動に関する一定の寄附金を支払った場合に、寄附金控除（所得控除）の適用を受ける場合を除き、一定額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n詳しくは、[コード1260「政党等寄附金特別控除制度」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1260.htm)を参照してください。\n\n##### 認定NPO法人等寄附金特別控除\n\n認定NPO法人等に対して一定の寄附金を支払った場合に、寄附金控除（所得控除）の適用を受ける場合を除き、一定額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n詳しくは、[コード1263「認定NPO法人に寄附をしたとき」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1263.htm)を参照してください。\n\n##### 公益社団法人等寄附金特別控除\n\n公益社団法人等に対して一定の寄附金を支払った場合に、寄附金控除（所得控除）の適用を受ける場合を除き、一定額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n詳しくは、[コード1266「公益社団法人等に寄附をしたとき」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm)を参照してください。\n\n##### (特定増改築等)住宅借入金等特別控除\n\n1　住宅の新築、取得または増改築等をした場合\n\n一定の要件を満たす住宅の新築、取得または増改築等（以下、「取得等」といいます。）をした場合に、その取得等に係る住宅ローン等の年末残高の合計額を基として計算した金額を一定期間控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\nなお、給与所得者は、1年目に確定申告をすると、2年目以降は年末調整でこの控除を受けることができます。\n\n2　特定の増改築等をした場合\n\n一定の要件を満たす次のイからニのいずれかの改修工事を含む増改築等（以下、「特定の増改築等」といいます。）を行い、令和3年12月31日までに居住の用に供した場合に、特定の増改築等に係る住宅ローン等の年末残高の合計額を基として計算した金額を5年間控除するものです。この控除は、上記1との選択適用となります。\n\nイ　バリアフリー改修工事\n\nロ　省エネ改修工事\n\nハ　多世帯同居改修工事\n\nニ 耐久性向上改修工事（上記ロの改修工事に併せて行うものに限ります。）\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n上記1および2の詳しい情報は、[コード1210「マイホームの取得等と所得税の税額控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1210.htm)の「関連コード」の各ページを参照してください。\n\n※災害により住宅が被害を受けた場合で、一定の要件を満たすときは、以下の特例の適用を受けることができますので、それぞれのリンク先を参照してください。\n\n（1）災害により（特定増改築等）住宅借入金等特別控除の適用を受けていた住宅について居住できなくなった場合\n\n[コード8013「災害を受けたときの住宅借入金等特別控除の適用期間の特例等」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/saigai/8013.htm)\n\n（2）東日本大震災によって（特定増改築等）住宅借入金等特別控除の適用を受けていた住宅について居住できなくなった場合\n\n[東日本大震災により被害を受けられた個人の方へ](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/shotoku/index.htm#a04)\n\n（3）東日本大震災の被災者の住宅の再取得等の場合\n\n[東日本大震災に関する税制上の追加措置について（所得税関係）](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/shotoku/tsuika1212.htm)\n\n[東日本大震災に関する税制上の追加措置について(平成24年度及び平成25年度の税制改正による所得税(譲渡所得関係を除く)の追加措置)](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/pdf/shotoku_02_03.pdf)\n\n##### 住宅耐震改修特別控除\n\n自己の居住の用に供する家屋（昭和56年5月31日以前に建築された家屋で一定のものに限ります。※自己の所有であるかどうかは問いません。）について住宅耐震改修をした場合に、一定の金額を控除するものです。\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n##### 住宅特定改修特別税額控除\n\n一定の要件を満たす次のイからニまでのいずれかの改修工事またはこれらの改修工事を併せて行った場合に、一定の金額を控除するものです。この控除は、上記の「（特定増改築等）住宅借入金等特別控除」との選択適用となります。\n\nイ [バリアフリー改修工事](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1220.htm)\n\nロ [省エネ改修工事](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1219.htm)\n\nハ [多世帯同居改修工事](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1224.htm)\n\nニ [耐久性向上改修工事](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1227.htm)（住宅耐震改修や上記ロの改修工事を併せて行うものに限ります。）\n\nホ　子育て対応改修工事（令和6年4月1日から令和10年12月31日までの間に居住の用に供した場合に限ります。）\n\nこの控除を受けるためには、確定申告書の提出の際に一定の書類を添付する必要があります。\n\n##### 認定住宅等新築等特別税額控除\n\n認定長期優良住宅、認定低炭素住宅またはZEH水準省エネ住宅の取得等をした場合に、標準的なかかり増し費用を基として計算した金額を控除するものです。この控除は、上記の「（特定増改築等）住宅借入金等特別控除」との選択適用となります。\n\n詳しくは、[コード1221「認定住宅等の新築等をした場合（認定住宅等新築等特別税額控除）」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1221.htm)を参照してください。\n\n##### 試験研究を行った場合の所得税額の特別控除\n\n青色申告者が、試験研究を行った場合の所得税額の特別控除には、[試験研究費の総額に係る特別税額控除制度](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1270.htm)、特別試験研究費に係る税額控除制度、中小企業技術基盤強化税制における特別税額控除制度および重点産業技術試験研究費の額に係る税額控除制度があり、試験研究費の額などに一定の割合を乗じた金額を控除するものです。\n\n※重点産業技術試験研究費の額に係る税額控除制度は、産業技術力強化法の改正法の施行の日から施行されます。\n\n##### 高度省エネルギー増進設備等を取得した場合の所得税額の特別控除\n\n青色申告者が、新品の高度省エネルギー増進設備等の取得等（個人の令和3年3月31日以前および一定の個人の令和4年3月31日以前における取得等に限ります。）をし、これを一定の事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 中小事業者が機械等を取得した場合の所得税額の特別控除\n\n青色申告者である中小事業者が、新品の特定機械装置等の取得等をし、これを一定の事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 地域経済牽（けん）引事業の促進区域内において特定事業用機械等を取得した場合の所得税額の特別控除\n\n地域経済牽引事業者であることの承認を得た青色事業者が、一定の地域内において承認地域経済牽引事業計画に従った特定地域経済牽引事業施設等の新設または増設をする場合において、その新設または増設に係る特定事業用機械等の取得等（平成29年7月31日以後における取得等に限ります。）し、これを事業の用に供した場合に、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 地方活力向上地域等において特定建物等を取得した場合の所得税額の特別控除\n\n青色申告者が、「地方活力向上地域等特定業務施設整備計画」について認定都道府県知事から認定を受けて、その認定の日から一定の期間内に、計画に沿った一定の規模以上の建物および建物附属設備ならびに構築物を取得して事業の用に供した場合に、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除\n\n青色申告者で、令和8年3月31日までに地方活力向上地域等特定業務施設整備計画の認定を受けた地域再生法に定める認定事業者については、雇用保険法第5条第1項に規定する適用事業を行うなど一定の要件を満たす場合、認定日を含む3年間までは特例措置として税額控除が認められます。\n\n詳しくは、[コード1284「地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1284.htm)を参照してください。\n\n##### 特定中小事業者が経営改善設備を取得した場合の所得税額の特別控除\n\n一定の青色申告者である中小企業者が、経営改善設備の取得等（平成25年4月1日から令和3年3月31日までにおける取得等に限ります。）をし、これを一定の事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 特定中小事業者が特定経営力向上設備等を取得した場合の所得税額の特別控除\n\n青色申告者である一定の中小事業者が、特定経営力向上設備等を取得等し、これを事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 給与等の支給額が増加した場合の所得税額の特別控除\n\n1　青色申告者が、令和5年から令和9年までの各年において国内雇用者に対して給与等を支給する場合において、継続雇用者給与等支給増加割合（その個人の継続雇用者給与等支給額からその継続雇用者比較給与等支給額を控除した金額のその継続雇用者比較給与等支給額に対する割合をいいます。）が3パーセントまたは4パーセント以上であることなど一定の要件を満たす場合に、一定の金額を控除するものです。\n\n2　中小事業者である青色申告者が、国内雇用者に対して給与等を支給する場合において、雇用者給与等支給増加割合（その中小事業者の雇用者給与等支給額からその比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合をいいます。）が1.5パーセント以上であるなど一定の要件を満たす場合に、一定の金額を控除するものです。\n\n##### 認定特定高度情報通信技術活用設備を取得した場合の所得税額の特別控除\n\n特定高度情報通信技術活用システムの開発供給及び導入の促進に関する法律に規定する認定導入事業者である青色事業者が、令和7年3月31日までに認定特定高度情報通信技術活用設備を取得等して事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 事業適応設備を取得した場合等の所得税額の特別控除\n\n産業競争力強化法に規定する認定事業適応事業者である青色申告者が、情報技術事業適応の用に供するために特定ソフトウェアの新設もしくは増設をした場合などにおいて、一定の金額を控除するものです。\n\n##### 革新的情報産業活用設備を取得した場合の所得税額の特別控除\n\n生産性向上特別措置法に規定する認定革新的データ産業活用事業者である青色事業者が、一定規模以上の革新的情報産業活用設備を取得等（平成30年6月6日から令和3年3月31日までにおける取得等に限ります。）して事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 特定生産性向上設備等を取得した場合の所得税額の特別控除\n\n青色申告者が、産業競争力強化法の改正法の施行日から令和11年3月31日までの間に、特定生産性向上設備等に係る確認を受け、その確認を受けた日から同日以後5年を経過する日までに事業の用に供した場合において、特別償却の適用を受けないときに、一定の金額を控除するものです。\n\n##### 所得税額から控除される特別控除の特例\n\nその年において上記の「試験研究を行った場合の所得税額の特別控除」から「革新的情報産業活用設備を取得した場合の所得税額の特別控除」の規定のうち、2以上の規定の適用を受けようとする場合、その適用を受けようとする規定による税額控除可能額の合計額がその年分の調整前事業所得税額の100分の90相当額を超える場合には、その超える部分の金額は、その年分の所得税額から控除せず、一定の事項を記載した明細書の添付を要件に、各特別控除制度の繰越税額控除限度超過額としてその翌年分以後に繰越控除することができるものです。","order":56},{"id":"no1210","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"マイホームの取得等と所得税の税額控除","yomi":"まいほーむのしゅとくとうとしょとくぜいのぜいがくこうじょ","code":"1210","title":"No.1210 マイホームの取得等と所得税の税額控除","summary":"個人が住宅ローン等を利用してマイホームの新築、取得または増改築等（以下「取得等」といいます。）をした場合で、一定の要件を満たすときは、その取得等に係る住宅ローン等の年末残高の合計額等を基として計算した金額を、居住の用に供した年分以後の各年分の所得税額から控除する「住宅借入金等特別控除」または「特定増改築等住宅借入金等特別控除」の適用を受けることができます。","basis":"措法41、41の19の2、41の19の3、41の19の4、旧措法41の3の2、震災特例法13、13の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1210.htm","md":"### 概要\n\n個人が住宅ローン等を利用してマイホームの新築、取得または増改築等（以下「取得等」といいます。）をした場合で、一定の要件を満たすときは、その取得等に係る住宅ローン等の年末残高の合計額等を基として計算した金額を、居住の用に供した年分以後の各年分の所得税額から控除する「住宅借入金等特別控除」または「特定増改築等住宅借入金等特別控除」の適用を受けることができます。\n\n（注1）令和4年以後に住宅ローン等を利用し、特定の増改築等を行い居住の用に供した場合には、特定増改築等住宅借入金等特別控除を受けることができません。\n\n（注2）災害によりマイホームが被害を受けた場合で、一定の要件を満たすときは、以下の特例の適用を受けることができますので、それぞれのリンク先を参照してください。\n\n1　災害により（特定増改築等）住宅借入金等特別控除の適用を受けていた住宅について居住できなくなった場合\n\n・[コード8013「災害により被害を受けたときの住宅借入金等特別控除の適用期間の特例等」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/saigai/8013.htm)\n\n2　東日本大震災によって（特定増改築等）住宅借入金等特別控除の適用を受けていた住宅について居住できなくなった場合\n\n・[東日本大震災により被害を受けられた個人の方へ（住宅借入金等特別控除の特例）](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/shotoku/index.htm#a04)\n\n3　東日本大震災の被災者の住宅の再取得等の場合\n\n・[東日本大震災に関する税制上の追加措置について（所得税関係）](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/shotoku/tsuika1212.htm)\n\n・[東日本大震災に関する税制上の追加措置について(平成24年度及び平成25年度の税制改正による所得税(譲渡所得関係を除く)の追加措置)](https://www.nta.go.jp/taxes/shiraberu/saigai/higashinihon/tokurei/pdf/shotoku_02_03.pdf)\n\nまた、住宅ローン等を利用しない場合であっても、個人が既存住宅について一定の要件を満たす（1）住宅耐震改修をしたとき、（2）バリアフリー改修工事や省エネ改修工事、多世帯同居改修工事、子育て対応改修工事、耐久性向上改修工事（住宅耐震改修や省エネ改修工事を併せて行うものに限ります。）をしたときまたは（3）認定住宅等の新築等をしたときは、それぞれ所定の方法で計算した金額を、その年分の所得税額から控除する「住宅耐震改修特別控除」、「住宅特定改修特別税額控除」または「認定住宅等新築等特別税額控除」の適用を受けることができます。","order":57},{"id":"no1240","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"居住者に係る外国税額控除","yomi":"きょじゅうしゃにかかるがいこくぜいがくこうじょ","code":"1240","title":"No.1240 居住者に係る外国税額控除","summary":"居住者が、その年において外国の法令により所得税に相当する租税（以下「外国所得税」といいます。）を納付することとなる場合には、次の算式で計算した控除限度額を限度として、その外国所得税額をその年分の所得税額から差し引くことができます。","basis":"所法44の3、95、95の2、所令93の2、221～226の2、所規41～43、所基通95-1～95-30、95の2-1、95の2-2、復興財確法13、14、復興所得税令3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1240.htm","md":"### 概要\n\n居住者が、その年において外国の法令により所得税に相当する租税（以下「外国所得税」といいます。）を納付することとなる場合には、次の算式で計算した控除限度額を限度として、その外国所得税額をその年分の所得税額から差し引くことができます。\n\n#### 控除限度額\n\n所得税の控除限度額は、次の算式で計算します。\n\n（1）所得税の控除限度額＝その年分の所得税額×（その年分の調整国外所得金額／その年分の所得総額）\n\nまた、その外国所得税額が所得税の控除限度額を超える場合には、次の算式（2）で計算した金額（以下「復興特別所得税の控除限度額」といいます。）を限度として、その超える金額をその年分の復興特別所得税額から差し引くことができます。\n\n（2）復興特別所得税の控除限度額＝その年分の復興特別所得税額×（その年分の調整国外所得金額/その年分の所得総額）\n\n（注1）「その年分の所得税額」とは、配当控除や（特定増改築等）住宅借入金等特別控除、所得税に係る分配時調整外国税相当額控除などの税額控除（令和６年分特別税額控除は除きます。）、災害減免額を適用した後の所得税額をいいます。\n\n（注2）「その年分の所得総額」とは、純損失または雑損失の繰越控除や上場株式等に係る譲渡損失の繰越控除などの各種繰越控除の適用を受けている場合には、その適用前のその年分の総所得金額、分離長（短）期譲渡所得の金額（特別控除前の金額）、一般株式等に係る譲渡所得等の金額、上場株式等に係る譲渡所得等の金額、申告分離課税の上場株式等に係る配当所得等の金額、先物取引に係る雑所得等の金額、退職所得金額および山林所得金額の合計額をいいます。\n\n（注3）「その年分の調整国外所得金額」とは、純損失または雑損失の繰越控除や上場株式等に係る譲渡損失の繰越控除などの各種繰越控除の適用を受けている場合には、その適用前のその年分の国外所得金額（非永住者については、国外所得金額のうち国内において支払われ、または国外から送金された国外源泉所得に係る部分に限ります。）をいいます。ただし、国外所得金額がその年分の所得総額に相当する金額を超える場合は、その年分の所得総額に相当する金額となります。\n\n（注4）「その年分の復興特別所得税額」とは、基準所得税額（その年分の所得税額（分配時調整外国税相当額控除および外国税額控除を適用せず、令和６年分特別税額控除を適用したもの。））に2.1パーセントの税率を乗じて計算した金額に復興特別所得税に係る分配時調整外国税相当額控除を適用した後の額をいいます。\n\nなお、国外転出をする場合の譲渡所得等の課税の特例の対象となった資産の譲渡等により生じる所得に係る外国所得税（日本以外の国または地域の居住者等として課されるものに限ります。）を納付することとなる場合で、一定の要件を満たすときは、当該外国所得税額を国外転出の日の属する年において納付することとなるものとみなして外国税額控除の計算をすることができる制度があります。\n\n#### 居住者に係る外国税額控除の対象となる外国所得税の範囲\n\n##### 外国所得税に含まれるもの\n\n外国所得税とは、外国の法令に基づき外国またはその地方公共団体により個人の所得を課税標準として課される税をいい、外国またはその地方公共団体により課される次のものを含みます。\n\n1 超過所得税その他個人の所得の特定の部分を課税標準として課される税\n\n2 個人の所得またはその特定の部分を課税標準として課される税の附加税\n\n3 個人の所得を課税標準として課される税と同一の税目に属する税で、個人の特定の所得につき、徴税上の便宜のため、所得に代えて収入金額その他これに準ずるものを課税標準として課されるもの\n\n4 個人の特定の所得につき、所得を課税標準とする税に代え、個人の収入金額その他これに準ずるものを課税標準として課される税\n\n##### 外国所得税に含まれないもの\n\n外国またはその地方公共団体により課される税であっても、次のものは外国所得税に含まれません。\n\n1 税を納付する人が、その税の納付後、任意にその金額の全部または一部の還付を請求することができる税\n\n2 税を納付する人が、税の納付が猶予される期間を任意に定めることができる税\n\n3 複数の税率の中から税を納付することとなる人と外国もしくはその地方公共団体またはこれらの者により税率を合意する権限を付与された者との合意により税率が決定された税のうち一定の部分\n\n4 外国所得税に附帯して課される附帯税に相当する税その他これに類する税\n\n##### 居住者に係る外国税額控除の対象とならない外国所得税額\n\n外国所得税であっても、次の税額は、居住者に係る外国税額控除の対象にはなりません。\n\n1 通常行われる取引と認められない一定の取引に基因して生じた所得に対して課される外国所得税額\n\n2 資本の払戻しなど所得税法第25条第1項各号に掲げる事由により交付を受ける金銭の額および金銭以外の資産の価額に対して課される外国所得税額（その交付の基因となったその法人の株式または出資の取得価額を超える部分の金銭に対して課される部分を除きます。）\n\n3 国外事業所等から事業場等への支払につきその国外事業所等の所在する国または地域においてその支払に係る金額を課税標準として課される外国所得税額\n\n4 居住者が有する株式または出資を発行した外国法人の本店または主たる事務所の所在する国や地域の法令に基づき、その外国法人の課税標準等または税額等につき更正または決定に相当する処分があった場合において、その処分が行われたことにより増額された外国法人の所得金額相当額に対し、所得税法第24条第1項に規定する剰余金の配当等の額に相当する金銭の支払とみなして課される外国所得税額その他の他の者の所得の金額に相当する金額に対し、これを居住者（居住者と他の者との間に一定の関係がある場合における居住者に限ります。）の所得の金額とみなして課される外国所得税の額\n\n5　居住者の国外事業所等の所在する国または地域において課される一定の外国所得税の額\n\n6 租税特別措置法第9条の8に規定する非課税口座内上場株式等の配当等または同法第9条の9第1項に規定する未成年者口座内上場株式等の配当等に対して課される外国所得税額\n\n7 居住者がその年以前の年において非居住者であった期間内に生じた所得に対して課される外国所得税額\n\n8 外国法人から受ける租税特別措置法第40条の5第1項に規定する剰余金の配当等の額（同項または同条第2項の規定の適用を受ける部分の金額に限ります。）に係る一定の外国所得税額\n\n9 外国法人から受ける租税特別措置法第40条の8第1項に規定する剰余金の配当等の額（同項または同条第2項の規定の適用を受ける部分の金額に限ります。）に係る一定の外国所得税額\n\n10 日本が租税条約を締結している相手国等において課される外国所得税額のうち、その租税条約の規定（当該外国所得税の軽減または免除に関する規定に限ります。）によりその相手国等において課することができることとされる額を超える部分に相当する金額または免除することとされる額に相当する金額\n\n11 外国において課される外国所得税額のうち、外国居住者等の所得に対する相互主義による所得税等の非課税等に関する法律の規定により、外国居住者等の対象国内源泉所得に対して所得税を軽減し、または課さないこととされる条件と同等の条件により軽減することとされる部分に相当する金額または免除することとされる額に相当する金額\n\n12 居住者の所得に対して課される外国所得税額で租税条約の規定において外国税額控除をされるべき金額の計算に当たって考慮しないものとされるもの\n\n#### 国外所得金額\n\n国外所得金額は、次に掲げる国外源泉所得に係る所得の金額の合計額（その合計額が0円を下回る場合には、0円）となります。この国外所得金額につき、純損失または雑損失の繰越控除や上場株式等に係る譲渡損失の繰越控除などの各種繰越控除の規定を適用しないで計算した金額が、その年分の調整国外所得金額として所得税の控除限度額の計算の基礎となります。\n\nなお、租税条約の適用を受ける居住者については、その租税条約において次の国外源泉所得に関して異なる定めがある場合には、その異なる定めによることとされています。\n\n##### 国外事業所等帰属所得\n\n居住者が国外事業所等を通じて事業を行う場合において、その国外事業所等がその居住者から独立して事業を行う事業者であるとしたならば、その国外事業所等が果たす機能、その国外事業所等において使用する資産、その国外事業所等とその居住者の事業場等との間の内部取引その他の状況を勘案して、その国外事業所等に帰せられるべき所得をいいます。国外事業所等帰属所得の金額は、原則として、その国外事業所等を通じて行う事業につき居住者の各年分の所得の金額の計算に関する法令の規定に準じて計算した場合にその年分の総所得金額、分離長（短）期譲渡所得の金額（特別控除前の金額）、一般株式等に係る譲渡所得等の金額、上場株式等に係る譲渡所得等の金額、申告分離課税の上場株式等に係る配当所得等の金額、先物取引に係る雑所得等の金額、退職所得金額および山林所得金額となる金額です。\n\n（注）「国外事業所等」とは、租税条約に定める恒久的施設等に相当するものをいいます。\n\n##### その他の国外源泉所得\n\n次の国外源泉所得をいいます。\n\n1 国外にある資産の運用または保有により生ずる所得\n\n2 国外にある資産の譲渡により生ずる一定の所得\n\n3 国外において人的役務の提供を主たる内容とする一定の事業を行う者が受けるその人的役務の提供に係る対価\n\n4 国外にある不動産、国外にある不動産の上に存する権利もしくは国外における採石権の貸付け、国外における租鉱権の設定または非居住者もしくは外国法人に対する船舶もしくは航空機の貸付けによる対価\n\n5 所得税法第23条第1項（利子所得）に規定する利子等およびこれに相当するもののうち次のもの\n\n(1) 外国の国債もしくは地方債または外国法人の発行する債券の利子\n\n(2) 国外にある営業所に預け入れられた預貯金の利子\n\n(3) 国外にある営業所に信託された合同運用信託もしくはこれに相当する信託、公社債投資信託または公募公社債等運用投資信託もしくはこれに相当する信託の収益の分配\n\n6 所得税法第24条第1項（配当所得）に規定する配当等およびこれに相当するもののうち次のもの\n\n(1) 外国法人から受ける剰余金の配当、利益の配当、剰余金の分配、金銭の分配または基金利息に相当するもの\n\n(2) 国外にある営業所に信託された投資信託（公社債投資信託ならびに公募公社債等運用投資信託およびこれに相当する信託を除きます。）または特定受益証券発行信託もしくはこれに相当する信託の収益の分配\n\n7 国外において業務を行う者に対する貸付金等でその業務に係るものの利子（債券現先取引から生ずる一定の差益を含みます。）\n\n8 国外において業務を行う者から受ける次の使用料または対価でその業務に係るもの\n\n(1) 工業所有権その他の技術に関する権利、特別の技術による生産方式もしくはこれらに準ずるものの使用料またはその譲渡による対価\n\n(2) 著作権（出版権および著作隣接権その他これに準ずるものを含みます。）の使用料またはその譲渡による対価\n\n(3) 機械、装置、車両および運搬具、工具ならびに器具および備品の使用料\n\n9 次の給与、報酬または年金\n\n(1) 俸給、給料、賃金、歳費、賞与またはこれらの性質を有する給与その他人的役務の提供に対する報酬のうち、国外において行う勤務その他の人的役務の提供（内国法人の役員として国外において行う勤務および居住者または内国法人が運航する船舶または航空機において行う勤務等を除きます。）に基因するもの\n\n(2) 外国の法令に基づく制度で国民年金法、厚生年金保険法、国家公務員共済組合法、地方公務員等共済組合法、私立学校教職員共済法、独立行政法人農業者年金基金法および石炭鉱業年金基金法の規定による社会保険または共済に関する制度に類するものに基づいて支給される年金等\n\n(3) 所得税法第30条第1項に規定する退職手当等のうちその支払を受ける者が非居住者であった期間に行った勤務その他の人的役務の提供（内国法人の役員として非居住者であった期間に行った勤務その他の一定の人的役務の提供を除きます。）に基因するもの\n\n10 国外において行う事業の広告宣伝のための一定の賞金\n\n11 国外にある営業所等を通じて締結した保険業法第2条第6項に規定する外国保険業者、同条第3項に規定する生命保険会社または同条第4項に規定する損害保険会社の締結する保険契約等に基づいて受ける年金（年金の支払の開始の日以後にその契約等に基づき分配を受ける剰余金または割戻しを受ける割戻金およびその契約等に基づき年金に代えて支給される一時金を含みます。）\n\n12 次の給付補填金、利息、利益または差益\n\n(1) 定期積金契約に基づく給付補填金のうち国外にある営業所が受け入れた定期積金に係るもの\n\n(2) 銀行法第2条第4項の契約に基づく給付補填金に相当するもののうち国外にある営業所が受け入れた掛金に相当するものに係るもの\n\n(3) 国外にある営業所を通じて抵当証券法第1条第1項に規定する抵当証券に基づき締結された一定の契約に相当するものに係る利息\n\n(4) 国外にある営業所を通じて締結された貴金属等の売戻し条件付売買に関する契約に係る利益\n\n(5) 外貨建預貯金で、その元本および利子をあらかじめ約定した率により円またはその外貨以外の外貨に換算して支払うこととされているものの差益のうち国外にある営業所が受け入れた預貯金に係るもの\n\n(6) 国外にある営業所等を通じて締結された一時払養老保険または一時払損害保険契約等に相当するものに係る一定の差益\n\n13 国外において事業を行う者に対する出資につき、匿名組合契約等に基づいて受ける利益の分配\n\n14 国内および国外にわたって船舶または航空機による運送の事業を行うことにより生ずる所得のうち国外において行う業務につき生ずべき一定の所得\n\n15 租税条約の規定によりその租税条約の相手国等において租税を課することができることとされる所得のうち外国所得税が課されるもの\n\n16 上記1から15までに掲げるもののほか、次の国外源泉所得\n\n(1) 国外において行う業務または国外にある資産に関し受ける保険金、補償金または損害賠償金等に係る所得\n\n(2) 国外にある資産の法人からの贈与により取得する所得\n\n(3) 国外において発見された埋蔵物または国外において拾得された遺失物に係る所得\n\n(4) 国外において行う懸賞募集に基づいて懸賞として受ける経済的な利益に係る所得\n\n(5) 国外においてした行為に伴い取得する一時所得\n\n(6) 国外において行う業務または国外にある資産に関し供与を受ける経済的な利益に係る所得\n\nその他の国外源泉所得の金額は、その所得のみについて各年分の所得税を課するものとした場合に課税標準となるべきその年分の総所得金額、分離長（短）期譲渡所得の金額（特別控除前の金額）、一般株式等に係る譲渡所得等の金額、上場株式等に係る譲渡所得等の金額、申告分離課税の上場株式等に係る配当所得等の金額、先物取引に係る雑所得等の金額、退職所得金額および山林所得金額の合計額に相当する金額となります。\n\n#### 居住者に係る外国税額控除の計算方法\n\n居住者に係る外国税額控除は、外国所得税（居住者に係る外国税額控除の対象となるものに限ります。以下同じです。）を納付することとなる日の属する年分の所得税および復興特別所得税の額から、それぞれ次の金額を控除します。ただし、継続してその納付することが確定した外国所得税額を実際に納付した日の属する年分において控除している場合には、その方法も認められます。\n\n##### その年分の外国所得税額が所得税の控除限度額に満たない場合\n\n外国税額控除額は、その年分の外国所得税額となります。\n\n##### その年分の外国所得税額が所得税の控除限度額を超える場合\n\n外国税額控除額は、その年分の所得税の控除限度額と、次の1または2のいずれか少ない方の金額の合計額となります。\n\n1 その年分の外国所得税額から所得税の控除限度額を差し引いた残額\n\n2 その年分の復興特別所得税の控除限度額\n\n#### 居住者に係る外国税額控除の繰越控除\n\n次の場合には、居住者に係る外国税額控除の計算方法で述べた控除額に加え、その年分の前年以前3年内の各年から繰り越された外国所得税額または所得税の控除限度額を基に計算した一定の金額をその年分の所得税額から控除します。\n\n##### 外国所得税額が控除限度額を超える場合\n\nその年において納付することとなる外国所得税額が、その年の所得税の控除限度額および復興特別所得税の控除限度額と地方税の控除限度額（その年の所得税の控除限度額に30パーセントを乗じた金額）との合計額を超える場合において、その年の前年以前3年内の各年の所得税の控除限度額のうち、その年に繰り越される部分の金額（以下「繰越控除限度額」といいます。）があるときは、その繰越控除限度額を限度として、その超える部分の金額をその年分の所得税額から控除します。\n\n（注1）「繰越控除限度額」とは、その年の前年以前3年以内の各年の所得税の控除余裕額または地方税の控除余裕額を、最も古い年のものから順次に、かつ、同一年のものについては所得税の控除余裕額および地方税の控除余裕額の順に、その年の控除限度超過額に充てるものとした場合にその控除限度超過額に充てられることとなるその所得税の控除余裕額の合計額に相当する金額をいいます。\n\n（注2）「所得税の控除余裕額」とは、その年において納付することとなる外国所得税額がその年の所得税の控除限度額に満たない場合におけるその所得税の控除限度額からその外国所得税額を控除した金額に相当する金額をいいます。\n\n（注3）「地方税の控除余裕額」とは、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額を超えない場合には、その年の地方税の控除限度額に相当する金額を、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額を超え、かつ、その超える部分の金額がその年の地方税の控除限度額に満たない場合には、その地方税の控除限度額からその超える部分の金額を控除した金額に相当する金額をいいます。\n\n（注4）「控除限度超過額」とは、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額と地方税の控除限度額との合計額を超える場合におけるその超える部分の金額に相当する金額をいいます。\n\n##### 外国所得税額が控除限度額に満たない場合\n\nその年において納付することとなる外国所得税額がその年の所得税の控除限度額に満たない場合において、その年の前年以前3年内の各年において納付することとなった外国所得税額のうち、その年に繰り越される部分の金額（以下「繰越外国所得税額」といいます。）があるときは、その控除限度額からその年において納付することとなる外国所得税額を控除した残額を限度として、その繰越外国所得税額をその年分の所得税額から控除します。\n\n（注）「繰越外国所得税額」とは、その年の前年以前3年以内の各年の控除限度超過額を最も古い年のものから順次その年の所得税の控除余裕額に充てるものとした場合にその所得税の控除余裕額に充てられることとなるその控除限度超過額の合計額に相当する金額です。\n\n#### 外国所得税額に異動が生じた場合\n\n##### 外国所得税額が減額された場合\n\n居住者に係る外国税額控除の適用を受けた年の翌年以後7年内の各年において、その適用を受けた外国所得税額が減額された場合においてその減額されることとなった日の属する年分における外国税額控除等の計算は、次のとおりです。\n\n1 その減額されることとなった日の属する年（以下「減額に係る年」といいます。）において納付することとなる外国所得税額（以下「納付外国所得税額」といいます。）からその減額された外国所得税額（以下「減額外国所得税額」といいます。）に相当する金額を控除し、その控除後の金額につき外国税額控除を適用します。\n\n2 減額に係る年に納付外国所得税額がない場合または納付外国所得税額が減額外国所得税額に満たない場合には、減額に係る年の前年以前3年内の各年の控除限度超過額から、それぞれ減額外国所得税の全額または減額外国所得税のうち納付外国所得税額を超える部分の金額に相当する金額を控除し、その控除後の金額について外国税額控除を行います。\n\n3 減額外国所得税額のうち上記1および2の外国税額控除の適用額の調整に充てられない部分の金額は、外国所得税額が減額された年分の雑所得の金額の計算上、総収入金額に算入します。\n\n##### 外国所得税額が増額された場合\n\n居住者が外国所得税額につき居住者に係る外国税額控除の適用を受けた場合において、その適用を受けた年分後の年分にその外国所得税額の増額があり、かつ、居住者に係る外国税額控除の適用を受けるときは、増額した外国所得税額は、その増額のあった日の属する年分において新たに生じたものとして居住者に係る外国税額控除の計算を行います。\n\n### 対象者または対象物\n\n外国所得税を納付する居住者の方\n\n### 手続き\n\n#### 申告等の方法\n\n居住者に係る外国税額控除の適用を受けるためには、次の書類を確定申告書、修正申告書または更正請求書（以下「申告書等」といいます。）に添付する必要があります。この場合に外国税額控除として控除されるべき金額等は、一定の場合を除き、次の（1）の明細書に記載された金額が限度となります。\n\n（1）[「外国税額控除に関する明細書（居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a0001)\n\n（2）外国所得税額を課されたことを証する書類\n\n（3）外国の法令により課される税の名称および金額、その税を納付することとなった日およびその納付の日または納付予定日、その税を課する外国またはその地方公共団体の名称ならびにその税が外国税額控除の対象となる外国所得税に該当することについての説明を記載した書類\n\n（4）外国所得税が減額され、上記「外国所得税額に異動が生じた場合」の「外国所得税額が減額された場合」の適用がある場合には、減額に係る年において減額された外国所得税額につきその減額された金額およびその減額されることとなった日ならびにその外国所得税額がその減額に係る年の前年以前の各年において控除されるべき金額の計算の基礎となったことについての説明を記載した書類\n\n（5）上記（3）の税を課されたことを証するその税に係る申告書の写しまたはこれに代わるべきその税に係る書類およびその税が既に納付されている場合にはその納付を証する書類（納税証明書や更正決定に係る通知書、賦課決定通知書、納税告知書、源泉徴収票などを含みます。）\n\n（6）国外源泉所得の金額の計算に関する明細を記載した書類\n\n（注）国外事業所等を通じて行う事業に係る負債の利子がある場合で、所得税法施行令第221条の4第1項の規定の適用があるときは、[「国外事業所等に帰せられるべき純資産に対応する負債の利子の必要経費不算入額の計算及び国外事業所等帰属純資産相当額の計算に関する明細書」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a0002)も添付してください。\n\nまた、上記「居住者に係る外国税額控除の繰越控除」で述べたような繰越控除限度額や繰越外国所得税額がある場合で外国税額控除の繰越控除をするときは、それらに係る年のうち最も古い年以後の各年について、その各年の控除限度額やその各年において納付することとなった外国所得税額を記載した[「外国税額控除に関する明細書（居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a0001)と申告書等を提出し、かつ、居住者に係る外国税額控除の繰越控除の適用を受けようとする年分の申告書等にこれらの控除を受ける金額を記載するとともに、[「外国税額控除に関する明細書（居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a0001)を添付する必要があります。\n\nなお、このときの外国税額控除額として控除されるべき金額等は、一定の場合を除き、その各年分の申告書等に添付した[「外国税額控除に関する明細書（居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a0001)にその各年の控除限度額やその各年において納付することとなった外国所得税額等として記載した金額を基礎として計算した金額が限度となります。\n\n#### 作成が必要な書類\n\n次の場合には、それぞれの書類を作成する必要があります。\n\n1　所得税法施行令第221条の3第6項または第221条の6第2項の規定による共通費用の額の配分を行った場合\n\n(1）共通費用の額の配分の基礎となる費用の明細および内容を記載した書類\n\n(2)合理的と認められる基準により配分するための計算方法の明細を記載した書類\n\n(3)(2)の計算方法が合理的であるとする理由を記載した書類\n\n2　他の者と行った取引のうち、国外所得金額の計算上、その取引から生ずる所得が国外事業所等に帰せられるものがある場合\n\n(1）国外事業所等に帰せられる取引（以下「国外事業所等帰属外部取引」といいます。）の内容を記載した書類\n\n(2)国外事業所等および事業場等が国外事業所等帰属外部取引において使用した資産の明細並びにその国外事業所等帰属外部取引にかかる負債の明細を記載した書類\n\n(3)国外事業所等および事業場等が国外事業所等帰属外部取引において果たす機能並びにその機能に関連するリスクに係る事項を記載した書類\n\n(4)国外事業所等および事業場等が国外事業所等帰属外部取引において果たした機能に関連する部門並びにその部門の業務の内容を記載した書類\n\n3　事業場等と国外事業所等との間の資産の移転、役務の提供その他の事実が内部取引（国外事業所等と事業場等との間で行われた資産の移転、役務の提供その他の事実で、独立の事業者の間で同様の事実があったとしたならば、これらの事業者の間で、資産の販売、資産の購入、役務の提供その他の取引が行われたと認められるものをいいます。）に該当する場合\n\n(1)国外事業所等と事業場等との間の内部取引に該当する資産の移転、役務の提供その他の事実を記載した注文書、契約書などの一定の書類\n\n(2)国外事業所等および事業場等が内部取引において使用した資産の明細並びにその内部取引に係る負債の明細\n\n(3)国外事業所等および事業場等が内部取引において果たす機能並びにその機能に関連するリスクに係る事項を記載した書類\n\n(4)国外事業所等および事業場等が内部取引において果たした機能に関連する部門並びにその部門の業務の内容を記載した書類\n\n(5) その他内部取引に関連する事実（資産の移転、役務の提供その他内部取引に関連して生じた事実をいいます。）が生じたことを証する書類\n\n#### 申告先等\n\n所轄税務署","order":58},{"id":"no1241","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"非居住者に係る外国税額控除","yomi":"ひきょじゅうしゃにかかるがいこくぜいがくこうじょ","code":"1241","title":"No.1241 非居住者に係る外国税額控除","summary":"国内に恒久的施設を有する非居住者が、その恒久的施設に帰属する所得（恒久的施設帰属所得）につきその年において外国の法令により所得税に相当する租税（以下「外国所得税」といいます。）を納付することとなる場合には、次の算式で計算した控除限度額を限度として、その外国所得税額をその年分の所得税額等から差し引くことができます。","basis":"所法165の2、165の6、所令292の2、292の7～292の14、所規66の8、66の9、所基通165の6-1、復興財確法13、14、復興所得税令3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1241.htm","md":"### 概要\n\n国内に[恒久的施設](http://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2883.htm)を有する非居住者が、その[恒久的施設](http://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2883.htm)に帰属する所得（恒久的施設帰属所得）につきその年において外国の法令により所得税に相当する租税（以下「外国所得税」といいます。）を納付することとなる場合には、次の算式で計算した控除限度額を限度として、その外国所得税額をその年分の所得税額等から差し引くことができます。\n\n#### 控除限度額\n\n所得税の控除限度額は、次の算式で計算します。\n\n（1）所得税の控除限度額＝その年分の恒久的施設帰属所得に係る所得税額×（その年分の調整国外所得金額／その年分の恒久的施設帰属所得金額）\n\nまた、その外国所得税額が所得税の控除限度額を超える場合には、次の算式（2）で計算した金額（以下「復興特別所得税の控除限度額」といいます。）を限度として、その超える金額をその年分の復興特別所得税額から差し引くことができます。\n\n（2）復興特別所得税の控除限度額＝その年分の恒久的施設帰属所得に係る復興特別所得税額×（その年分の調整国外所得金額／その年分の恒久的施設帰属所得金額）\n\n（注1） 「恒久的施設帰属所得」とは、次の所得をいいます。\n\n1 非居住者が恒久的施設を通じて事業を行う場合において、その恒久的施設がその非居住者から独立して事業を行う事業者であるとしたならば、その恒久的施設が果たす機能、その恒久的施設において使用する資産、その恒久的施設とその非居住者の事業場等との間の内部取引その他の状況を勘案して、その恒久的施設に帰せられるべき所得（以下「恒久的施設に帰せられるべき所得」といいます。）\n\n2 組合契約等に基づいて恒久的施設を通じて行う事業から生ずる利益で、その組合契約等に基づいて配分を受けるもののうち一定のもの\n\n（注2） 「その年分の恒久的施設帰属所得に係る所得税額」とは、恒久的施設帰属所得に係る所得金額につき、所得税法第165条第1項（非居住者の総合課税に係る所得税の課税標準等、税額等の計算）の規定により準じて計算する同法第89条（税率）から第92条（配当控除）までの規定及び同法165条の5の3（非居住者に係る分配時調整外国税相当額の控除）の規定により計算したその年分の所得税の額、租税特別措置法第8条の4第1項（上場株式等に係る配当所得等の課税の特例）の規定による所得税の額、租税特別措置法第31条第1項（長期譲渡所得の課税の特例）の規定による所得税の額、租税特別措置法第32条第1項又は第2項（短期譲渡所得の課税の特例）の規定による所得税の額、租税特別措置法第37条の10第1項（一般株式等に係る譲渡所得等の課税の特例）の規定による所得税の額、租税特別措置法第37条の11第1項（上場株式等に係る譲渡所得等の課税の特例）の規定による所得税の額、租税特別措置法第41条の14第1項（先物取引に係る雑所得等の課税の特例）の規定による所得税の額ならびに租税特別措置法第41条の19第1項（特定の基準所得金額の課税の特例）の規定による所得税の額に、公益社団法人等寄附金特別控除などの税額控除を適用した後の所得税法第165条の6（非居住者に係る外国税額の控除）の規定を適用しないで計算した場合の所得税の額（附帯税の額を除きます。）をいいます。\n\n（注3） 「その年分の恒久的施設帰属所得金額」とは、純損失または雑損失の繰越控除の規定を適用しないで計算した場合のその年分の恒久的施設帰属所得金額をいいます。\n\n（注4） 「その年分の調整国外所得金額」とは、純損失または雑損失の繰越控除の規定を適用しないで計算した場合のその年分の国外所得金額をいいます。ただし、その国外所得金額が、その年分の恒久的施設帰属所得金額に相当する金額を超える場合には、その年分の恒久的施設帰属所得金額に相当する金額になります。\n\n（注5） 「その年分の恒久的施設帰属所得に係る復興特別所得税額」とは、基準所得税額（その年分の恒久的施設帰属所得に係る所得税額（恒久的施設帰属所得に係る分配時調整外国税相当額控除及び外国税額控除を適用していないもの。））に2.1パーセントの税率を乗じて計算した金額に恒久的施設帰属所得の復興特別所得税に係る分配時調整外国税相当額控除を適用した後の額をいいます。\n\n#### 非居住者に係る外国税額控除の対象となる外国所得税の範囲\n\n##### 外国所得税に含まれるもの\n\n外国所得税とは、外国の法令に基づき外国またはその地方公共団体により個人の所得を課税標準として課される税をいい、外国またはその地方公共団体により課される次のものを含みます。\n\n1 超過所得税その他個人の所得の特定の部分を課税標準として課される税\n\n2 個人の所得またはその特定の部分を課税標準として課される税の附加税\n\n3 個人の所得を課税標準として課される税と同一の税目に属する税で、個人の特定の所得につき、徴税上の便宜のため、所得に代えて収入金額その他これに準ずるものを課税標準として課されるもの\n\n4 個人の特定の所得につき、所得を課税標準とする税に代え、個人の収入金額その他これに準ずるものを課税標準として課される税\n\n##### 外国所得税に含まれないもの\n\n外国またはその地方公共団体により課される税であっても、次のものは外国所得税に含まれません。\n\n1 税を納付する人が、その税の納付後、任意にその金額の全部または一部の還付を請求することができる税\n\n2 税を納付する人が、税の納付が猶予される期間を任意に定めることができる税\n\n3 複数の税率の中から税を納付することとなる人と外国もしくはその地方公共団体またはこれらの者により税率を合意する権限を付与された者との合意により税率が決定された税のうち一定の部分\n\n4 外国所得税に附帯して課される附帯税に相当する税その他これに類する税\n\n##### 非居住者に係る外国税額控除の対象とならない外国所得税\n\n外国所得税であっても、次の税額は、非居住者に係る外国税額控除の対象にはなりません。\n\n1 通常行われる取引と認められない一定の取引に基因して生じた所得に対して課される外国所得税額\n\n2 非居住者の居住地国において課される外国所得税額（非居住者が支払を受けるべき利子、配当その他これらに類するものの額を課税標準として源泉徴収の方法に類する方法により課される外国所得税額で、その居住地国の法令または租税条約の規定により、その居住地国において課されるその外国所得税額以外の外国所得税額から控除しないこととされるものを除く。）\n\n3 非居住者の居住地国以外の国等において課される外国所得税額のうち、その外国所得税の課税標準となる所得について日本とその国等との間の租税条約が適用されるとしたならば、その租税条約の適用によりその国等が課すことができるとされる額を超える部分（または免除することとされる額）に相当する金額\n\n4 非居住者の居住地国以外の国等において課される外国所得税額のうち、その外国所得税の課税標準となる所得を居住者の所得とした場合にその外国所得税が課されるとしたならば、その国等において、外国居住者等の所得に対する相互主義による所得税等の非課税等に関する法律の規定に基づく外国居住者等の対象国内源泉所得に対して所得税を軽減し、または課さないこととされる条件と同等の条件により軽減することとされる部分に相当する金額または免除することとされる額に相当する金額\n\n#### 国外所得金額\n\n国外所得金額は、恒久的施設帰属所得に係る所得金額のうち次の国外源泉所得に係る所得金額をいいます。この国外所得金額につき、純損失または雑損失の繰越控除の規定を適用しないで計算した金額が、その年分の調整国外所得金額として所得税の控除限度額の計算の基礎となります。\n\nなお、租税条約の適用を受ける非居住者について、その租税条約において異なる定めがある場合における国外源泉所得は、その異なる定めがある限りにおいて、その租税条約に定めることとされています。\n\n1 国外にある資産の運用または保有により生ずる所得\n\n2 国外にある資産の譲渡により生ずる一定の所得\n\n3 国外において人的役務の提供を主たる内容とする一定の事業を行う者が受けるその人的役務の提供に係る対価\n\n4　国外にある不動産、国外にある不動産の上に存する権利もしくは国外における採石権の貸付け、国外における租鉱権の設定または非居住者もしくは外国法人に対する船舶もしくは航空機の貸付けによる対価\n\n5　所得税法第23条第1項（利子所得）に規定する利子等およびこれに相当するもののうち次に掲げるもの\n\n（1）外国の国債もしくは地方債または外国法人の発行する債券の利子\n\n（2）国外にある営業所に預け入れられた預貯金の利子\n\n（3）国外にある営業所に信託された合同運用信託もしくはこれに相当する信託、公社債投資信託または公募公社債等運用投資信託もしくはこれに相当する信託の収益の分配\n\n6　所得税法第24条第1項（配当所得）に規定する配当等およびこれに相当するもののうち次のもの\n\n（1）外国法人から受ける剰余金の配当、利益の配当、剰余金の分配、金銭の分配または基金利息に相当するもの\n\n（2）国外にある営業所に信託された投資信託（公社債投資信託ならびに公募公社債等運用投資信託およびこれに相当する信託を除きます。）または特定受益証券発行信託もしくはこれに相当する信託の収益の分配\n\n7　国外において業務を行う者に対する貸付金等でその業務に係るものの利子（債券現先取引から生ずる一定の差益を含みます。）\n\n8　国外において業務を行う者から受ける次の使用料または対価でその業務に係るもの\n\n（1）工業所有権その他の技術に関する権利、特別の技術による生産方式もしくはこれらに準ずるものの使用料またはその譲渡による対価\n\n（2）著作権（出版権および著作隣接権その他これに準ずるものを含みます。）の使用料またはその譲渡による対価\n\n（3）機械、装置、車両および運搬具、工具ならびに器具および備品の使用料\n\n9　国外において行う事業の広告宣伝のための一定の賞金\n\n10　国外にある営業所等を通じて締結した保険業法第2条第6項に規定する外国保険業者、同条第3項に規定する生命保険会社または同条第4項に規定する損害保険会社の締結する保険契約等に基づいて受ける年金（年金の支払の開始の日以後にその契約等に基づき分配を受ける剰余金または割戻しを受ける割戻金およびその契約等に基づき年金に代えて支給される一時金を含みます。）\n\n11　次の給付補填金、利息、利益または差益\n\n（1）定期積金契約に基づく給付補填金のうち国外にある営業所が受け入れた定期積金に係るもの\n\n（2）銀行法第2条第4項の契約に基づく給付補填金に相当するもののうち国外にある営業所が受け入れた掛金に相当するものに係るもの\n\n（3）国外にある営業所を通じて抵当証券法第1条第1項に規定する抵当証券に基づき締結された一定の契約に相当するものに係る利息\n\n（4）国外にある営業所を通じて締結された貴金属等の売戻し条件付売買に関する契約に係る利益\n\n（5）外貨建預貯金で、その元本および利子をあらかじめ約定した率により円またはその外貨以外の外貨に換算して支払うこととされているものの差益のうち国外にある営業所が受け入れた預貯金に係るもの\n\n（6）国外にある営業所等を通じて締結された一時払養老保険や一時払損害保険契約等に相当するものに係る一定の差益\n\n12　国外において事業を行う者に対する出資につき、匿名組合契約等に基づいて受ける利益の分配\n\n13　上記1から12までに掲げるもののほか、次の国外源泉所得\n\n（1）国外において行う業務または国外にある資産に関し受ける保険金、補償金または損害賠償金等に係る所得\n\n（2）国外にある資産の法人からの贈与により取得する所得\n\n（3）国外において発見された埋蔵物または国外において拾得された遺失物に係る所得\n\n（4）国外において行う懸賞募集に基づいて懸賞として受ける金品その他の経済的な利益に係る所得\n\n（5）国外においてした行為に伴い取得する一時所得\n\n（6）国外において行う業務または国外にある資産に関し供与を受ける経済的な利益に係る所得\n\n#### 非居住者に係る外国税額控除の計算方法\n\n非居住者に係る外国税額控除は、外国所得税（非居住者に係る外国税額控除の対象となるものに限ります。以下同じです。）を納付することとなる日の属する年分の所得税および復興特別所得税の額から、それぞれ次の金額を控除します。ただし、継続してその納付することが確定した外国所得税額を実際に納付した日の属する年分において控除している場合には、その方法も認められます。\n\n##### その年分の外国所得税額が所得税の控除限度額に満たない場合\n\n外国税額控除額は、その年分の外国所得税額となります。\n\n##### その年分の外国所得税額が所得税の控除限度額を超える場合\n\n外国税額控除額は、その年分の所得税の控除限度額と、次の1または2のいずれか少ない方の金額との合計額となります。\n\n1 その年分の外国所得税額から所得税の控除限度額を差し引いた残額\n\n2 その年分の復興特別所得税の控除限度額\n\n#### 非居住者に係る外国税額控除の繰越控除\n\n次の場合には、非居住者に係る外国税額控除の計算方法で述べた控除額に加え、その年分の前年以前3年内の各年から繰り越された外国所得税額または所得税の控除限度額を基に計算した一定の金額をその年の所得税額から控除します。\n\n##### 外国所得税額が控除限度額を超える場合\n\nその年において納付することとなる外国所得税額が、その年の所得税の控除限度額および復興特別所得税の控除限度額と地方税の控除限度額（その年の所得税の控除限度額に30パーセントを乗じた金額）との合計額を超える場合において、その年の前年以前3年内の各年の所得税の控除限度額のうち、その年に繰り越される部分の金額（以下「繰越控除限度額」といいます。）があるときは、その繰越控除限度額を限度として、その超える部分の金額をその年分の所得税額から控除します。\n\n（注1）「繰越控除限度額」とは、その年の前年以前3年以内の各年の所得税の控除余裕額または地方税の控除余裕額を、最も古い年のものから順次に、かつ、同一年のものについては所得税の控除余裕額および地方税の控除余裕額の順に、その年の控除限度超過額に充てるものとした場合にその控除限度超過額に充てられることとなるその所得税の控除余裕額の合計額に相当する金額をいいます。\n\n（注2）「所得税の控除余裕額」とは、その年において納付することとなる外国所得税額がその年の所得税の控除限度額に満たない場合におけるその所得税の控除限度額からその外国所得税額を控除した金額に相当する金額をいいます。\n\n（注3）「地方税の控除余裕額」とは、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額を超えない場合には、その年の地方税の控除限度額に相当する金額を、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額を超え、かつ、その超える部分の金額がその年の地方税の控除限度額に満たない場合には、その地方税の控除限度額からその超える部分の金額を控除した金額に相当する金額をいいます。\n\n（注4）「控除限度超過額」とは、その年において納付することとなる外国所得税額がその年の所得税および復興特別所得税の控除限度額と地方税の控除限度額との合計額を超える場合におけるその超える部分の金額に相当する金額をいいます。\n\n##### 外国所得税額が控除限度額に満たない場合\n\nその年において納付することとなる外国所得税額がその年の所得税の控除限度額に満たない場合において、その年の前年以前3年内の各年において納付することとなった外国所得税額のうち、その年に繰り越される部分の金額（以下「繰越外国所得税額」といいます。）があるときは、その控除限度額からその年において納付することとなる外国所得税額を控除した残額を限度として、その繰越外国所得税額をその年分の所得税額から控除します。\n\n（注）「繰越外国所得税額」とは、その年の前年以前3年以内の各年の控除限度超過額を最も古い年のものから順次その年の所得税の控除余裕額に充てるものとした場合にその所得税の控除余裕額に充てられることとなるその控除限度超過額の合計額に相当する金額です。\n\n#### 外国所得税額に異動が生じた場合\n\n##### 外国所得税額が減額された場合\n\n非居住者に係る外国税額控除の適用を受けた年の翌年以後7年内の各年において、その適用を受けた外国所得税額が減額された場合においてその減額されることとなった日の属する年分における外国税額控除等の計算は、次のとおりです。\n\n1 その減額されることとなった日の属する年（以下「減額に係る年」といいます。）において納付することとなる外国所得税額（以下「納付外国所得税額」といいます。）からその減額された外国所得税額（以下「減額外国所得税額」といいます。）に相当する金額を控除し、その控除後の金額につき外国税額控除を適用します。\n\n2 減額に係る年に納付外国所得税額がない場合または納付外国所得税額が減額外国所得税額に満たない場合には、減額に係る年の前年以前3年内の各年の控除限度超過額から、それぞれ減額外国所得税の全額または減額外国所得税のうち納付外国所得税額を超える部分の金額に相当する金額を控除し、その控除後の金額について外国税額控除を行います。\n\n3 減額外国所得税額のうち上記1および2の外国税額控除の適用額の調整に充てられない部分の金額は、外国所得税額が減額された年分の雑所得の金額の計算上、総収入金額に算入します。\n\n##### 外国所得税額が増額された場合\n\n非居住者が外国所得税額につき非居住者に係る外国税額控除の適用を受けた場合において、その適用を受けた年分後の年分にその外国所得税額の増額があり、かつ、非居住者に係る外国税額控除の適用を受けるときは、増額した外国所得税額は、その増額のあった日の属する年分において新たに生じたものとして非居住者に係る外国税額控除の計算を行います。\n\n### 対象者または対象物\n\n国内に恒久的施設を有し、この恒久的施設に帰属する所得につき外国所得税を納付する非居住者の方\n\n### 手続き\n\n#### 申告等の方法\n\n非居住者に係る外国税額控除の適用を受けるためには、次の書類を確定申告書、修正申告書または更正請求書（以下「申告書等」といいます。）に添付をする必要があります。この場合に外国税額控除として控除されるべき金額等は、一定の場合を除き、次の(1)の明細書に記載された金額が限度となります。\n\n(1) [「外国税額控除に関する明細書（非居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#b0001)\n\n(2) 外国所得税を課されたことを証する書類\n\n(3) 外国の法令により課される税の名称および金額、その税を納付することとなった日およびその納付の日または納付予定日、その税を課する外国またはその地方公共団体の名称ならびにその税が外国税額控除の対象となる外国所得税に該当することについての説明を記載した書類\n\n(4) 外国所得税が減額され、上記「外国所得税額に異動が生じた場合」の 「外国所得税額が減額された場合」の適用がある場合には、減額に係る年において減額された外国所得税額につきその減額された金額およびその減額されることとなった日ならびにその外国所得税額がその減額に係る年の前年以前の各年において控除されるべき金額の計算の基礎となったことについての説明を記載した書類\n\n(5) 上記(3)の税を課されたことを証するその税に係る申告書の写しまたはこれに代わるべきその税に係る書類およびその税が既に納付されている場合にはその納付を証する書類（納税証明書や更正決定に係る通知書、賦課決定通知書、納税告知書、源泉徴収票などを含みます。）\n\n(6) 国外所得金額の計算に関する明細を記載した書類\n\nまた、上記「非居住者に係る外国税額控除の繰越控除」で述べたような繰越控除限度額や繰越外国所得税額がある場合で外国税額控除の繰越控除をするときは、それらに係る年のうち最も古い年以後の各年について、その各年の控除限度額やその各年において納付することとなった外国所得税額を記載した[「外国税額控除に関する明細書（非居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#b0001)と申告書等を提出し、かつ、非居住者に係る外国税額控除の繰越控除の適用を受けようとする年分の申告書等にこれらの控除を受ける金額を記載するとともに、[「外国税額控除に関する明細書（非居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#b0001)を添付する必要があります。\n\nなお、このときの外国税額控除額として控除されるべき金額等は、一定の場合を除き、その各年分の申告書等に添付した[「外国税額控除に関する明細書（非居住者用）」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#b0001)にその各年の控除限度額やその各年において納付することとなった外国所得税額等として記載した金額を基礎として計算した金額が限度となります。\n\n#### 作成が必要な書類\n\n所得税法施行令第292条の7第2項の規定による共通費用の額の配分を行った場合には、次の書類を作成する必要があります。\n\n(1）共通費用の額の配分の基礎となる費用の明細および内容を記載した書類\n\n(2)合理的と認められる基準により配分するための計算方法の明細を記載した書類\n\n(3)(2)の計算方法が合理的であるとする理由を記載した書類\n\n#### 申告先等\n\n所轄税務署","order":59},{"id":"no1250","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"配当所得があるとき(配当控除)","yomi":"はいとうしょとくがあるときはいとうこうじょ","code":"1250","title":"No.1250 配当所得があるとき(配当控除)","summary":"剰余金の配当などの配当所得があるときには、一定の方法で計算した金額の税額控除を受けることができます。これを配当控除といいます。","basis":"所法92、措法8の4、8の5、9","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1250.htm","md":"### 概要\n\n剰余金の配当などの配当所得があるときには、一定の方法で計算した金額の税額控除を受けることができます。これを配当控除といいます。\n\n#### 配当控除を受けることができる配当所得\n\n日本国内に本店のある法人から受ける剰余金の配当、利益の配当、剰余金の分配、金銭の分配、証券投資信託の収益の分配などで、確定申告において総合課税の適用を受けた配当所得に限られます。したがって、外国法人から受ける配当等は、配当控除の対象となりません。\n\n#### 配当控除の対象にならない配当\n\n次の配当などは配当控除の対象になりません。\n\n（1） 基金利息\n\n（2） 私募公社債等運用投資信託等の収益の分配に係る配当等\n\n（3） 国外私募公社債等運用投資信託等の配当等\n\n（4） 外国株価指数連動型特定株式投資信託の収益の分配に係る配当等\n\n（5） 特定外貨建等証券投資信託の収益の分配に係る配当等\n\n（6） 適格機関投資家私募による投資信託から支払を受けるべき配当等\n\n（7） 特定目的信託から支払を受けるべき配当等\n\n（8） 特定目的会社から支払を受けるべき配当等\n\n（9） 投資法人から支払を受けるべき配当等\n\n（10） 確定申告不要制度を選択したもの\n\n（11） 申告分離課税制度を選択したもの\n\n### 対象者または対象物\n\n剰余金の配当などの配当所得がある方\n\n### 計算方法・計算式\n\n#### 配当控除の計算式\n\n次の方法により計算した金額です。（配当控除の金額は算出税額を限度とします。）\n\n##### （1） その年分の課税総所得金額等が1,000万円以下の場合（パターン1）\n\n配当控除の額＝イ＋ロ\n\nイ 剰余金の配当等に係る配当所得（特定株式投資信託の収益の分配に係る配当所得を含みます。以下同じです。）の金額×10パーセント\n\nロ 証券投資信託の収益の分配金に係る配当所得（特定株式投資信託の収益の分配に係る配当所得を除きます。以下同じです。）の金額×5パーセント\n\n（証券投資信託の収益の分配に係る配当所得のうち、特定外貨建等証券投資信託以外の外貨建等証券投資信託の収益の分配に係る配当所得の金額については、2.5パーセント）\n\n（注） 「課税総所得金額等」とは、課税総所得金額、土地等に係る課税事業所得等の金額（平成10年1月1日から令和11年3月31日までの間は適用なし）、課税長期（短期）譲渡所得の金額、上場株式等に係る課税配当所得等の金額、株式等に係る課税譲渡所得等の金額および先物取引に係る課税雑所得等の金額の合計額をいいます（以下同じです）。\n\n##### （2） その年分の課税総所得金額等が1,000万円を超え、かつ、課税総所得金額等から証券投資信託の収益の分配に係る配当所得の金額を差し引いた金額が1,000万円以下の場合（パターン2）\n\n次のイからハの合計額\n\nイ 剰余金の配当等に係る配当所得の金額×10パーセント\n\nロ （証券投資信託の収益の分配に係る配当所得の金額のうち、課税総所得金額等から1,000万円を差し引いた金額（A）に相当する部分の金額）×2.5パーセント\n\nハ 証券投資信託の収益の分配に係る配当所得の金額のうち（A）を超える部分の金額×5パーセント\n\n（注） 証券投資信託の収益の分配に係る配当所得のうちに特定外貨建等証券投資信託以外の外貨建等証券投資信託の収益の分配に係る配当所得がある場合には、その金額に係る控除率は、2.5パーセントが1.25パーセント、5パーセントが2.5パーセントとなります。\n\n##### （3） 課税総所得金額等から証券投資信託の収益の分配に係る配当所得の金額を差し引いた金額が1,000万円を超える場合（（4）に該当する場合を除きます。）（パターン3）\n\n次のイからハの合計額\n\nイ （剰余金の配当等に係る配当所得の金額のうち、課税総所得金額等から1,000万円と証券投資信託の収益の分配に係る配当所得の金額の合計額を差し引いた金額（B）に相当する部分の金額）×5パーセント\n\nロ 剰余金の配当等に係る配当所得のうち、（B）を超える部分の金額×10パーセント\n\nハ 証券投資信託の収益の分配に係る配当所得の金額×2.5パーセント\n\n（証券投資信託の収益の分配に係る配当所得のうち、特定外貨建等証券投資信託以外の外貨建等証券投資信託の収益の分配に係る配当所得については、1.25パーセント）\n\n##### （4） 課税総所得金額等から剰余金の配当等に係る配当所得の金額と証券投資信託の収益の分配に係る配当所得の金額の合計額を差し引いた金額が1,000万円を超える場合（パターン4）\n\n次のイとロの合計額\n\nイ 剰余金の配当等に係る配当所得の金額×5パーセント\n\nロ 証券投資信託の収益の分配金に係る配当所得の金額×2.5パーセント\n\n（証券投資信託の収益の分配に係る配当所得のうち、特定外貨建等証券投資信託以外の外貨建等証券投資信託の収益の分配に係る配当所得については、1.25パーセント）\n\n### 手続き\n\n配当控除を受けるためには、確定申告が必要です。その際には、この配当控除の額のほか、配当について源泉徴収された所得税の額が納付すべき税額の計算上控除されます。\n\n#### 申告先等\n\n所轄税務署","order":60},{"id":"no1260","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"政党等寄附金特別控除制度","yomi":"せいとうとうきふきんとくべつこうじょせいど","code":"1260","title":"No.1260 政党等寄附金特別控除制度","summary":"個人が平成7年1月1日から令和11年12月31日までに支払った「政党等に対する寄附金」（注）については、支払った年分の所得控除としての寄附金控除の適用を受けるか、または次の「計算方法・計算式」にある「特別控除額」について税額控除の適用を受けるか、いずれか有利な方を選択することができます。","basis":"措法41の18、措令26の27の4、措規19の10の3、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1260.htm","md":"### 概要\n\n個人が平成7年1月1日から令和11年12月31日までに支払った「政党等に対する寄附金」（注）については、支払った年分の所得控除としての[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)の適用を受けるか、または次の「計算方法・計算式」にある「特別控除額」について税額控除の適用を受けるか、いずれか有利な方を選択することができます。\n\n（注）「政党等に対する寄附金」とは、政治資金規正法第3条第2項に規定する政党とその支部および同法第5条第1項第2号に規定する政治資金団体に対する同法第4条第4項に規定する政治活動に関する寄附金のうち、同法の規定に違反することとなるもの、その寄附をした人に特別の利益が及ぶと認められるものおよび令和8年1月1日以後にする[公職の候補者が特定政党支部に対してする寄附](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1154.htm)以外のもので、同法第12条または第17条の規定による報告書により報告されたものをいいます。\n\n### 対象者または対象物\n\n政党または政治資金団体に対する政治活動に関する寄附をした方\n\n### 計算方法・計算式\n\n（特別控除額の計算）\n\n| 【その年中に支払った政党等に対する寄附金の合計額（注1） | － | 2千円（注2）】 | × | 30％ | ＝ | 政党等寄附金特別控除額（注3）【100円未満の端数切捨て】 |\n|---|---|---|---|---|---|---|\n\n（注1） 「その年中に支払った政党等寄附金の額の合計額」については、その年分の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)の40パーセント相当額が限度とされます。\n\nただし、[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)の適用を受ける特定寄附金の額、[公益社団法人等寄附金特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm)の適用を受ける公益社団法人等寄附金の額、[認定NPO法人等寄附金特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1263.htm)の適用を受ける認定NPO法人等寄附金の額（以下「特定寄附金等の額」といいます。）がある場合で、政党等に対する寄附金の額の合計額にその特定寄附金等の額の合計額を加算した金額がその年分の総所得金額等の40パーセント相当額を超えるときは、その40パーセント相当額からその特定寄附金等の額の合計額を控除した残額とされます。\n\n（注2） 「2千円」については、特定寄附金等の額がある場合には2,000円からその特定寄附金等の額の合計額を控除した残額とされます。\n\n（注3） 特別控除額は、その年分の所得税額の25パーセント相当額（100円未満の端数があれば切り捨てます。）を限度とします。\n\n### 手続き\n\n#### 申告等の方法\n\n政党等寄附金特別控除を受けるための手続については、次のとおりです。\n\nこの税額控除を受ける場合は、確定申告書に控除を受ける金額についてその控除に関する記載があり、かつ、「[政党等寄附金特別控除額の計算明細書](https://www.nta.go.jp/taxes/shiraberu/shinkoku/yoshiki/04/pdf/06.pdf)」および総務大臣または都道府県の選挙管理委員会等の確認印のある「寄附金（税額）控除のための書類」（[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)を含みます。）を添付する必要があります。\n\n（注） 確定申告書を提出するときまでに、上記「寄附金（税額）控除のための書類」が間に合わない場合は、「寄附金の領収書（写）」のみを添付して申告し、後日「寄附金（税額）控除のための書類」の送付を受けた後、速やかに税務署長に提出してください。\n\ne-Tax（電子申告）で確定申告する場合については、[コードNo.1904「給与所得者と電子申告」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1904.htm)をご覧ください。\n\n#### 申告先等\n\n所轄税務署","order":61},{"id":"no1263","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"認定NPO法人に寄附をしたとき","yomi":"にんていえぬぴーおーほうじんにきふをしたとき","code":"1263","title":"No.1263 認定NPO法人に寄附をしたとき","summary":"個人が認定NPO法人等（注1）に対して一定の寄附金（特定非営利活動に係る事業に関連する寄附で、寄附をした人に特別の利益が及ぶと認められるものおよび令和3年4月1日以降に支出する出資に関する業務に充てられることが明らかなものを除きます。）を、その認定等の有効期間内に支払った場合には、支払った年分の所得控除として寄附金控除の適用を受けるか、または次の算式で計算した特別控除額について税額控除の適用を受けるか、いずれか有利な方を選択することができます。","basis":"所法78、措法41の18の2、措令26の28、措規19の10の4、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1263.htm","md":"### 概要\n\n個人が認定NPO法人等（注1）に対して一定の寄附金（特定非営利活動に係る事業に関連する寄附で、寄附をした人に特別の利益が及ぶと認められるものおよび令和3年4月1日以降に支出する出資に関する業務に充てられることが明らかなものを除きます。）を、その認定等の有効期間内に支払った場合には、支払った年分の所得控除として[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)の適用を受けるか、または次の算式で計算した特別控除額について税額控除の適用を受けるか、いずれか有利な方を選択することができます。\n\n（特別控除額の計算）\n\n| 【その年中に支払った認定NPO法人等寄附金の合計額（注2） | － | 2千円（注3）】 | × | 40％ | ＝ | 認定NPO法人等寄附金特別控除額（注4）【100円未満の端数切捨て】 |\n|---|---|---|---|---|---|---|\n\n（注1） 「認定NPO法人等」とは、所轄庁（都道府県知事または指定都市の長）の認定（もしくは特例認定）を受けた認定NPO法人（もしくは特例認定NPO法人）をいいます。また、認定NPO法人等の一覧は[内閣府NPO法人ホームページ](https://www.npo-homepage.go.jp/)をご覧ください。\n\n（注2） 「その年中に支払った認定NPO法人等寄附金の額の合計額」については、その年分の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)の40パーセント相当額が限度とされます。\n\nただし、寄附金控除の適用を受ける特定寄附金の額および公益社団法人等寄附金特別控除の適用を受ける[公益社団法人等寄附金特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm)の額（以下「特定寄附金等の額」といいます。）がある場合で、認定NPO法人等に対する寄附金の額の合計額にその特定寄附金等の額の合計額を加算した金額がその年分の総所得金額等の40パーセント相当額を超えるときは、その40パーセント相当額からその特定寄附金等の額の合計額を控除した残額とされます。\n\n（注3） 「2千円」については、特定寄附金等の額がある場合には2,000円からその特定寄附金等の合計額を控除した残額とされます。\n\n（注4） 特別控除額は所得税額の25パーセント相当額（100円未満の端数があれば切り捨てます。）となりますが、[公益社団法人等寄附金特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm)の適用がある場合には、25パーセント相当額から公益社団法人等寄附金特別控除額を控除した残額となります。\n\n### 対象者または対象物\n\n認定NPO法人等に対して寄附をした方\n\n### 手続き\n\n#### 申告等の方法\n\n認定NPO法人等寄附金特別控除を受けるための手続については、次のとおりです。\n\nこの税額控除を受ける場合は、確定申告書に控除を受ける金額についてその控除に関する記載があり、かつ、[「認定ＮＰＯ法人等寄附金特別控除額の計算明細書」](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a51)および寄附金の額、寄附金を受領した旨および受領年月日、その寄附金が認定NPO法人等の特定非営利活動に関する事業に関連するものである旨、その寄附金を受領した認定NPO法人等の名称を証する書類（寄附者の住所、氏名が記載されたもので、[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)を含みます。）を確定申告書に添付する必要があります。\n\ne-Tax（電子申告）で確定申告する場合については、[コードNo.1904「給与所得者と電子申告」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1904.htm)をご覧ください。\n\n#### 申告先等\n\n所轄税務署","order":62},{"id":"no1266","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"公益社団法人等に寄附をしたとき","yomi":"こうえきしゃだんほうじんとうにきふをしたとき","code":"1266","title":"No.1266 公益社団法人等に寄附をしたとき","summary":"個人が支払った特定寄附金のうち、次の（1）から（3）までに掲げる法人等（以下「公益社団法人等」といいます。）に対する寄附金については、支払った年分の所得控除として寄附金控除の適用を受けるか、または次の算式で計算した金額（その年分の所得税額の25パーセント相当額を限度とします。）について税額控除（以下「公益社団法人等寄附金特別控除」といいます。）の適用を受けるか、いずれかを選択することができます。","basis":"措法41の18の3、措令26の28の2、措規19の10の5、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm","md":"### 概要\n\n個人が支払った特定寄附金のうち、次の（1）から（3）までに掲げる法人等（以下「公益社団法人等」といいます。）に対する寄附金については、支払った年分の所得控除として[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)の適用を受けるか、または次の算式で計算した金額（その年分の所得税額の25パーセント相当額を限度とします。）について税額控除（以下「公益社団法人等寄附金特別控除」といいます。）の適用を受けるか、いずれかを選択することができます。\n\nなお、個人が支払った特定寄附金については、[コード1150「一定の寄附金を支払ったとき(寄附金控除)」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)の「特定寄附金の範囲」を参照してください。\n\n#### 控除の対象となる寄附金\n\n（1） 次に掲げる法人（※）に対する寄附金\n\nイ 公益社団法人および公益財団法人\n\nロ 私立学校法第3条に規定する学校法人および同法の規定により専修学校または各種学校の設置のみを目的として設立された法人\n\nハ 社会福祉法人\n\nニ 更生保護法人\n\n（2） 次に掲げる法人（※）に対する寄附金のうち、学生に対する修学の支援のための事業に充てられることが確実であるもの\n\nイ 国立大学法人\n\nロ 公立大学法人\n\nハ 独立行政法人国立高等専門学校機構および独立行政法人日本学生支援機構\n\n（3） 次に掲げる法人（※）に対する寄附金のうち、学生または不安定な雇用状態にある研究者に対するこれらの者が行う研究への助成または研究者としての能力の向上のための事業に充てられることが確実なもの\n\nイ 国立大学法人および大学共同利用機関法人\n\nロ 公立大学法人\n\nハ　独立行政法人国立高等専門学校機構\n\n（※）その運営組織および事業活動が適正であることならびに市民から支援を受けていることにつき一定の要件を満たすものに限ります。\n\n#### 計算方法・計算式\n\n（注1） 「その年中に支払った公益社団法人等に対する寄附金の額の合計額」については、その年分の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)の40パーセント相当額が限度とされます。\n\nただし、寄附金控除の適用を受ける特定寄附金の額がある場合で、公益社団法人等に対する寄附金の額の合計額にその特定寄附金の額の合計額を加算した金額がその年分の総所得金額等の40パーセント相当額を超えるときは、その40パーセント相当額からその特定寄附金の額の合計額を控除した残額とされます。\n\n（注2） 「2千円」については、特定寄附金の額がある場合には2,000円からその特定寄附金の合計額を控除した残額とされます。\n\n（注3） 特別控除額は、所得税の25パーセント相当額（100円未満の端数があれば切り捨てます。）が控除限度額となります。\n\n#### 公益社団法人等寄附金特別控除の対象となる公益社団法人等\n\n公益社団法人等寄附金特別控除の対象となる公益社団法人等は、次の1から4までに掲げる所轄官庁等のサイトで確認できます。\n\n1　公益社団法人および公益財団法人\n\n国・都道府県公式公益法人行政総合サイト[「公益法人information」](https://www.koeki-info.go.jp/)\n\n2　社会福祉法人（厚生労働省所管法人）\n\n[厚生労働省ホームページ](https://www.mhlw.go.jp/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/shakai-fukushi-houjin-seido/09.html)\n\n3　更生保護法人\n\n[法務省ホームページ](https://www.moj.go.jp/hogo1/soumu/hogo02_00023.html)\n\n4　国立大学法人\n\n[文部科学省ホームページ](https://www.mext.go.jp/a_menu/koutou/houjin/1376267.htm)\n\n### 対象者または対象物\n\n公益社団法人等に対して寄附をした方\n\n### 手続き\n\n#### 申告等の方法\n\n公益社団法人等寄附金特別控除を受けるための手続については、次のとおりです。\n\nこの税額控除を受ける場合は、確定申告書に控除を受ける金額についてその控除に関する記載があり、かつ、「[公益社団法人等寄附金特別控除額の計算明細書](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a111)」および次の書類を確定申告書に添付する必要があります。\n\n（1）寄附金を受領した法人の名称、寄附金の額、寄附金を受領した旨および受領年月日のほか、次に掲げる公益社団法人等の区分によりそれぞれ次に掲げる旨を証する書類（寄附者の住所、氏名が記載されたもので、[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)を含みます。）\n\nイ「控除の対象となる寄附金」（1）に掲げる法人\n\nその法人の主たる目的である業務に関連するものである旨\n\nロ「控除の対象となる寄附金」（2）に掲げる法人\n\nその法人の行う学生に対する修学の支援のための事業に充てられるものである旨\n\nハ「控除の対象となる寄附金」（3）に掲げる法人\n\nその法人の行う学生または不安定な雇用状態にある研究者に対するこれらの者が行う研究への助成または研究者としての能力の向上のための事業に充てられるものである旨\n\n（2）次に掲げる公益社団法人等の区分に応じそれぞれ次に掲げる書類の写しとして公益社団法人等から交付を受けたもの（[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)を含みます。）\n\nイ上記（1）イに掲げる法人\n\nその法人がこの制度を適用することができる公益社団法人等であることを所轄庁等が証する書類（その寄附金を支出する日以前5年以内に発行されたものに限ります。）\n\nロ上記（1）ロおよびハに掲げる法人\n\n上記イに掲げる書類およびその寄附金がこの制度を適用することができるものであることにつき所轄庁等が確認したものであることを証する書類（その寄附金を支出する日の属する年の1月1日に発行されたものに限ります。）\n\ne-Tax（電子申告）で確定申告する場合については、[コードNo.1904「給与所得者と電子申告」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1904.htm)をご覧ください。\n\n#### 申告先等\n\n所轄税務署","order":63},{"id":"no1270","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"試験研究を行った場合の所得税額の特別控除","yomi":"しけんけんきゅうをおこなったばあいのしょとくぜいがくのとくべつこうじょ","code":"1270","title":"No.1270 試験研究を行った場合の所得税額の特別控除","summary":"青色申告者のその年分の事業所得の金額の計算上必要経費に算入される試験研究費の額がある場合に、その試験研究費の額の一定割合の金額をその年分の総所得金額に係る所得税額から控除することを認めるものです。","basis":"旧措法10、旧措令5の3、旧措規5の6、平29改正法附則44、措法10、措令5の3、措規5の6、平31改正法附則29、令3改正措令附則6、令5改正法附則25、令5改正措令附則2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1270.htm","md":"### 概要\n\n青色申告者のその年分の事業所得の金額の計算上必要経費に算入される試験研究費の額がある場合に、その試験研究費の額の一定割合の金額をその年分の総所得金額に係る所得税額から控除することを認めるものです。\n\n#### 試験研究費の額\n\nこの制度の対象となる試験研究費の額とは、製品の製造または技術の改良、考案もしくは発明に係る試験研究のために要する原材料費、人件費および経費のほか、他の者に試験研究を委託するために支払う費用などの額をいいます。ただし、試験研究に充てるために他の者から支払を受ける金額がある場合には、その金額を控除した金額が試験研究費の額となります。\n\n#### 用語の説明\n\n（1） 「増減試験研究費割合」とは、増減試験研究費の額の比較試験研究費の額に対する割合をいいます。\n\n（2） 「増減試験研究費の額」とは、適用年の試験研究費の額から比較試験研究費の額を減算した額をいいます。\n\n（3） 「比較試験研究費の額」とは、適用年前3年以内の各年分の試験研究費の額を平均した額をいいます。\n\n（4） 「調整前事業所得税額」とは、次の算式により計算した金額をいいます。\n\n総所得金額に係る所得税額（注1） × 事業所得の金額 / i＋ii（注2）\n\ni…事業所得、不動産所得、給与所得、総合課税の利子所得・配当所得・短期譲渡所得、雑所得の合計額\n\nii…総合課税の長期譲渡所得の2分の1の金額と一時所得の2分の1の金額の合計額\n\n（注1）「総所得金額に係る所得税額」は、配当控除後の額をいいます。\n\n（注2）上記の算式中の分母は、損益通算や純損失等の繰越控除等をする前の黒字の所得金額の合計額です。\n\n（5） 「試験研究費割合」とは、適用年分の試験研究費の額の平均売上金額に対する割合をいいます。\n\n（6） 「平均売上金額」とは、適用年分およびその年前3年以内の各年分の売上金額の平均額をいいます。\n\n（7） 「特別試験研究費の額」とは、試験研究費のうち国の試験研究機関や大学その他の者と共同して行う試験研究などに係る試験研究費の額で一定のものをいいます。\n\n### 対象者または対象物\n\n青色申告書を提出する個人\n\n### 対象期間\n\n#### 適用の対象となる期間（年度）\n\nこの制度の適用対象年分は、事業を廃止した日の属する年分以外の年分です。\n\n### 計算方法・計算式\n\n#### 税額控除額の計算（令和6年分から令和8年分）\n\n##### （1） 試験研究費の総額に係る税額控除\n\n税額控除額 ＝ 試験研究費の額 × 税額控除割合\n\n（注1） 税額控除割合は、次の区分に応じて定める割合（小数点以下3位未満切捨て）です。\n\nイ 増減試験研究費割合が12パーセントを超える場合\n\n11.5％＋（増減試験研究費割合－12％）×0.375　＜14％が上限＞\n\nロ 増減試験研究費割合が12パーセント以下の場合\n\n11.5％－（12％－増減試験研究費割合）×0.25　＜1％が下限＞\n\nハ 事業を開始した年（相続または包括遺贈により当該事業の承継した年を除きます。）および比較試験研究費の額が零の場合\n\n8.5％\n\n（注2） 税額控除額の控除限度額は、調整前事業所得税額の25パーセント相当額が控除限度額となります。\n\n（注3） 令和6年分から令和8年分において、試験研究費割合（試験研究費の売上高に占める割合）が10パーセントを超える場合の税額控除割合は、次のとおりです。\n\n＜税額控除割合＞\n\n税額控除割合＜14％が上限＞　＝　税額控除割合＋（税額控除割合×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n（注4） 令和6年分から令和8年分において、以下のイからハのいずれかに該当する場合、税額控除額の控除限度額は、上記（注2）によらず、以下のとおりとなります。なお、事業を開始した年は除きます。\n\n＜控除限度額＞\n\nイ　増減試験研究費割合が4パーセントを超える場合\n\n控除限度額　＝　調整前事業所得税額の25％相当額 ＋ （調整前事業所得税額 × （増減試験研究費割合－4％）×0.625＜5％が上限＞）\n\nロ　増減試験研究費割合がマイナス4パーセントを下回る場合\n\n控除限度額　＝　調整前事業所得税額の25％相当額 － （調整前事業所得税額 × （増減試験研究費割合－4％）×0.625＜5％が上限＞）\n\n※　上記の算式における増減試験研究費割合は－（マイナス）を付けない値です。\n\nハ　試験研究費割合が10パーセントを超える場合\n\n控除限度額　＝　調整前事業所得税額の25％相当額 ＋ （調整前事業所得税額 × （試験研究費割合－10％）×2＜10％が上限＞）\n\nニ　上記イおよびハのいずれにも該当する場合には、いずれか高い方の金額となります。\n\n##### （2） 中小企業技術基盤強化税制における税額控除\n\n中小事業者については、上記（1）に代えて、次の算式により算出された額を控除することができます。\n\n税額控除額　＝　試験研究費の額　×　税額控除割合（12％）\n\n税額控除の控除限度額は、調整前事業所得税額の25パーセント相当額となります。\n\n（注1） 令和6年分から令和8年分において、増減試験研究費割合が12パーセントを超える場合の税額控除割合は、次のとおりとなります。なお、試験研究費割合が10パーセントを超える場合を除きます。\n\n税額控除割合＜17％が上限＞　＝　12％＋（（増減試験研究費割合－12％）×0.375）\n\n（注2） 令和6年分から令和8年分において、試験研究費割合が10パーセントを超える場合の税額控除割合は、次のとおりとなります。なお、増減試験研究費割合が12パーセントを超える場合を除きます。\n\n税額控除割合＜17％が上限＞　＝　12％＋（12％×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n（注3） 令和6年分から令和8年分において、増減試験研究費割合が12パーセントを超え、かつ、試験研究費割合が10パーセントを超える場合の税額控除割合は、次のとおりとなります。\n\n税額控除割合＜17％が上限＞　＝　12％＋{（増減試験研究費割合－12％）×0.375×（1＋控除割増率）＋12％×控除割増率}\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n（注4） 令和6年分から令和8年分における控除限度額は以下のとおりとなります。\n\nイ　増減試験研究費割合が12パーセントを超える場合\n\n調整前事業所得税額の35％相当額\n\nロ　試験研究費割合が10パーセントを超える場合（上記イに該当する場合を除きます。）\n\n調整前事業所得税額の25％相当額＋（調整前事業所得税額×{（試験研究費割合－10％）×2＜10％が上限＞}）\n\n##### （3） 特別試験研究費に係る税額控除\n\n試験研究費の額のうち、特別試験研究費の額（上記（1）または（2）の適用を受ける特別試験研究費の額は除きます。）については、次のイ、ロおよびハにより算出された額の合計額を控除します。\n\nイ  特別試験研究費の額のうち、国の試験研究機関や大学その他これらに準ずる者と共同し、またはこれらの者へ委託して行う試験研究費の額×30％により算出された額\n\nロ 特別試験研究費の額のうち特定新事業開拓事業者等と共同して行う試験研究または特定新事業開拓事業者等に委託する試験研究で、革新的なものまたは国立研究開発法人その他これに準ずる者における研究開発の成果を実用化するために行うものに係る試験研究費の額（イの額を除きます。）×25％により算出された額\n\nハ 特別試験研究費の額のうちイおよびロ以外の金額×20％により算出された額\n\n税額控除の控除限度額は、調整前事業所得税額の10パーセント相当額となります。なお、この税額控除限度額は上記（1）および（2）とは別枠です。\n\n#### 税額控除額の計算（令和4年分・令和5年分）\n\n##### （1） 試験研究費の総額に係る税額控除\n\n税額控除額　＝　試験研究費の額 ×　税額控除割合\n\n（注1） 税額控除割合は、次の区分に応じて定める割合です。\n\nイ 増減試験研究費割合が9.4パーセントを超える場合\n\n10.145％＋（増減試験研究費割合－9.4％）×0.35　＜14％が上限＞\n\nロ 増減試験研究費割合が9.4パーセント以下の場合\n\n10.145％－（9.4％－増減試験研究費割合）×0.175　＜2％が下限＞\n\nハ 事業を開始した年（相続または包括遺贈により当該事業の承継した年を除きます。）および比較試験研究費の額が零の場合\n\n8.5％\n\n（注2） 税額控除額の控除限度額は、調整前事業所得税額の25パーセント相当額が控除限度額となります。\n\n（注3） 令和4年分および令和5年分において、試験研究費割合（試験研究費の売上高に占める割合）が10パーセントを超える場合は、次のとおりです。\n\n＜税額控除割合＞\n\n税額控除割合＜14％が上限＞　＝　税額控除割合＋（税額控除割合×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n＜控除限度額＞\n\n控除限度額　＝　調整前事業所得税額の25％相当額 ＋ （調整前事業所得税額 × （試験研究費割合－10％）×2＜10％が上限＞）\n\n（注4）　令和4年分および令和5年分において、基準年比売上金額減少割合が2パーセント以上であり、かつ、試験研究費の額が基準年試験研究費の額を超える年分の控除限度額について、調整前事業所得税額の5パーセント相当額を加算することとされています。なお、上記（注3）の控除限度額の計算と重複適用が可能です。\n\n##### （2） 中小企業技術基盤強化税制における税額控除\n\n中小事業者については、上記（1）に代えて、次の算式により算出された額を控除することができます。\n\n税額控除額　＝　試験研究費の額　×　税額控除割合（12％）\n\n税額控除の控除限度額は、調整前事業所得税額の25パーセント相当額となります。\n\n（注1） 令和4年分および令和5年分において、増減試験研究費割合が9.4パーセントを超える場合の税額控除割合は、次のとおりとなります。なお、試験研究費割合が10パーセントを超える場合を除きます。\n\n税額控除割合＜17％が上限＞　＝　12％＋（（増減試験研究費割合－9.4％）×0.35）\n\n（注2） 令和4年分および令和5年分において、試験研究費割合が10パーセントを超える場合の税額控除割合は、次のとおりとなります。なお、増減試験研究費割合が9.4パーセントを超える場合を除きます。\n\n税額控除割合＜17％が上限＞　＝　12％＋（12％×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n（注3） 令和4年分および令和5年分において、増減試験研究費割合が9.4パーセントを超え、かつ、試験研究費割合が10パーセントを超える場合の税額控除割合は、次のとおりとなります。\n\n税額控除割合＜17％が上限＞　＝　12％＋{（増減試験研究費割合－9.4％）×0.35×（1＋控除割増率）＋12％×控除割増率}\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n（注4） 令和4年分および令和5年分における控除限度額は以下のとおりとなります。\n\nイ　増減試験研究費割合が9.4パーセントを超える場合\n\n調整前事業所得税額の35％相当額\n\nロ　試験研究費割合が10パーセントを超える場合（上記イに該当する場合を除きます。）\n\n調整前事業所得税額の25％相当額＋（調整前事業所得税額×{（試験研究費割合－10％）×2＜10％が上限＞}）\n\n（注5）　令和4年分および令和5年分において、基準年比売上金額減少割合が2パーセント以上であり、かつ、試験研究費の額が基準年試験研究費の額を超える年分の控除限度額について、調整前事業所得税額の5パーセント相当額を加算することとされています。なお、上記（注4）の控除限度額の計算と重複適用が可能です。\n\n##### （3） 特別試験研究費に係る税額控除\n\n試験研究費の額のうち、特別試験研究費の額（上記（1）または（2）の適用を受ける特別試験研究費の額は除きます。）については、次のイ、ロおよびハにより算出された額の合計額を控除します。\n\nイ  特別試験研究費の額のうち、国の試験研究機関や大学その他これらに準ずる者と共同し、またはこれらの者へ委託して行う試験研究費の額×30％により算出された額\n\nロ 特別試験研究費の額のうち新事業開拓事業者等と共同して行う試験研究または新事業開拓事業者等に委託する試験研究で、革新的なものまたは国立研究開発法人その他これに準ずる者における研究開発の成果を実用化するために行うものに係る試験研究費の額（イの額を除きます。）×25％により算出された額\n\nハ 特別試験研究費の額のうちイおよびロ以外の金額×20％により算出された額\n\n税額控除の控除限度額は、調整前事業所得税額の10パーセント相当額となります。なお、この税額控除限度額は上記（1）および（2）とは別枠です。\n\n#### 税額控除額の計算（令和3年分）\n\n##### （1） 試験研究費の総額に係る税額控除\n\n税額控除額 ＝ 試験研究費の額 × 税額控除割合\n\n（注1） 税額控除割合は、次の区分に応じて定める割合です。\n\nイ 増減試験研究費割合が8パーセントを超える場合\n\n9.9％＋（増減試験研究費割合－8％）×0.3＜14％が上限＞\n\nロ 増減試験研究費割合が8パーセント以下の場合\n\n9.9％－（8％－増減試験研究費割合）×0.175＜6％が下限＞\n\nハ 事業を開始した年（相続または包括遺贈により当該事業の承継した年を除きます。）および比較試験研究費の額が零の場合\n\n8.5％\n\n（注2） 税額控除額の控除限度額は、調整前事業所得税額の25パーセント相当額が控除限度額となります。\n\n（注3） 令和3年分において、試験研究費割合（試験研究費の売上高に占める割合）が10パーセントを超える場合は、次のとおりです。\n\n＜税額控除割合＞\n\n税額控除割合＜14％が上限＞　＝　税額控除割合＋（税額控除割合×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n＜控除限度額＞\n\n控除限度額　＝　調整前事業所得税額の25％相当額 ＋ （調整前事業所得税額 × （試験研究費割合－0.10）×2＜10％が上限＞）\n\n##### （2） 中小企業技術基盤強化税制における税額控除\n\n中小事業者については、上記（1）に代えて、次の算式により算出された額を控除することができます。\n\n税額控除額　＝　試験研究費の額　×　税額控除割合（12％）\n\n税額控除の控除限度額は、調整前事業所得税額の25パーセント相当額となります。\n\n（注1） 令和3年分において、増減試験研究費割合が8パーセントを超える場合の税額控除割合は、次のとおりとなります。\n\n税額控除割合＜17％が上限＞　＝　12％＋（（増減試験研究費割合－8％）×0.3）\n\n税額控除の控除限度額は、調整前事業所得税額の35パーセント相当額となります。\n\n（注2） 令和3年分において、試験研究費割合が10パーセントを超える場合の税額控除割合および控除限度額は、次のとおりとなります。\n\n＜税額控除割合＞\n\nイ 増減試験研究費割合が8パーセントを超える場合（（注1）に該当する場合）\n\n税額控除割合＜17％が上限＞　＝　Ａ＋（Ａ×控除割増率）\n\n※　A＝（注1）の税額控除割合＜12％＋（（増減試験研究費割合－8％）×0.3）＞\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\nロ 増減試験研究費割合が8パーセント以下の場合\n\n税額控除割合　＝　12％＋（12％×控除割増率）\n\n※　控除割増率＜10％が上限＞＝（試験研究費割合－10％）×0.5\n\n＜控除限度額＞\n\n調整前事業所得税額の25％相当額＋（調整前事業所得税額×{（試験研究費割合－10％）×2＜10％が上限＞}\n\n##### （3） 特別試験研究費に係る税額控除\n\n試験研究費の額のうち、特別試験研究費の額（上記（1）または（2）の適用を受ける特別試験研究費の額は除きます。）については、次のイ、ロおよびハにより算出された額の合計額を控除します。\n\nイ 特別試験研究費の額のうち、国の試験研究機関や大学その他これらに準ずる者と共同し、またはこれらの者へ委託して行う試験研究費の額×30％により算出された額\n\nロ 特別試験研究費の額のうち新事業開拓事業者等と共同して行う試験研究または新事業開拓事業者等に委託する試験研究で、革新的なものまたは国立研究開発法人その他これに準ずる者における研究開発の成果を実用化するために行うもの（令和3年4月1日以後に支出されるものに限ります。）に係る試験研究費の額（イの額を除きます。）×25％により算出された額\n\nハ 特別試験研究費の額のうちイおよびロ以外の金額×20％により算出された額\n\n税額控除の控除限度額は、調整前事業所得税額の10パーセント相当額となります。この税額控除限度額は上記（1）および（2）とは別枠です。\n\n### 手続き\n\n#### 申告等の方法\n\nこの制度の適用を受けるためには、適用を受ける試験研究費の額等、控除を受ける金額を確定申告書に記載するとともに、その金額の計算に関する明細書を添付して申告する必要があります。\n\n#### 申告先等\n\n所轄税務署","order":64},{"id":"no1284","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除","yomi":"ちほうかつりょくこうじょうちいきとうにおいてこようしゃのかずがぞうかしたばあいのしょとくぜいがくのとくべつこうじょ","code":"1284","title":"No.1284 地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除","summary":"この制度は、青色申告書を提出する事業者である個人が、令和8年3月31日までに拡充型事業の計画または移転型事業の計画の認定を受けた地域再生法に定める認定事業者であって、適用年の12月31日における特定業務施設の雇用者の数が適用年の前年の12月31日における特定業務施設の雇用者の数に比して2人以上増加していることなどについて証明がされるなど一定の要件を満たす場合、税額控除が認められます。","basis":"措法10、10の4の2、10の5、10の5の4、措令5の6、措規5の9、震災特例法10の3、10の3の2、10の3の3、令2改正法附則56","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1284.htm","md":"### 概要\n\nこの制度は、青色申告書を提出する事業者である個人が、令和8年3月31日までに拡充型事業の計画または移転型事業の計画の認定を受けた地域再生法に定める認定事業者であって、適用年の12月31日における特定業務施設の雇用者の数が適用年の前年の12月31日における特定業務施設の雇用者の数に比して2人以上増加していることなどについて証明がされるなど一定の要件を満たす場合、税額控除が認められます。\n\n（注）ここでいう拡充型事業とは、地域再生法第17条の2第1項第2号に定める整備事業をいい、移転型事業とは、同条第1項第1号に定める整備事業をいいます。\n\n#### 税額控除限度額等\n\n（1）税額控除限度額\n\n次の区分に応じて算出された金額を控除することができます。\n\n次のAおよびBで算出された金額の合計額です。\n\nA　30万円×地方事業所基準雇用者数のうち特定新規雇用者数に達するまでの数\n\n（移転型特定新規雇用者数がある場合には、20万円に特定新規雇用者基礎数に達するまでの数を乗じた金額を加算）\n\nB　 20万円×地方事業所基準雇用者数から新規雇用者総数を控除して計算した数\n\n（移転型非新規基準雇用者数が零を超える場合には、移転型非新規基準雇用者数に達するまでの数を加算した数）\n\n（2）地方事業所特別税額控除限度額\n\n移転型事業で、上記（1）の規定の適用を受ける年であるか、または適用期間内で既に適用を受けた年がある場合で下記「控除の適用を受けるための要件」の（1）または（2）の要件を満たす場合には、次により算出された金額を控除することができます。\n\nただし、認定事業者の認定日以降の年分で、基準雇用者数または地方事業所基準雇用者数が零に満たない年以後は適用できません。\n\n40万円（特定業務施設が地域再生法第5条第4項第5号ロに規定する準地方活力向上地域内にある場合には30万円）×地方事業所特別基準雇用者数\n\n（注1）地方活力向上地域等において特定建物等を取得した場合の特別償却または所得税額の特別控除の適用を受ける年分については、上記（1）の制度は適用できません。\n\n（注2）税額控除限度額は、調整前事業所得税額（租税特別措置法第10条第8項第4号に規定する金額をいいます。）の20パーセントを限度とします。\n\n（注3）地方事業所特別税額控除限度額は、調整前事業所得税額の20パーセントを限度とします。\n\nなお、上記（1）および地方活力向上地域等において特定建物等を取得した場合の税額控除の適用により控除される金額がある場合には、調整前事業所得税額の20パーセントからこれらの金額を差し引いた残額が税額控除限度額となります。\n\n（注4）特定新規雇用者基礎数とは、地方事業所基準雇用者数のうち特定新規雇用者数に達するまでの数をいいます。\n\n（注5）移転型特定新規雇用者数とは、地域再生法に規定する移転型事業の計画の認定を受けた者の、当該計画の認定に係る特定業務施設（「移転型特定業務施設」という。）において、適用年に新たに雇用された特定雇用者で適用年の12月31日において当該移転型特定業務施設に勤務するものの数をいいます。\n\n（注6）移転型新規雇用者総数とは、移転型特定業務施設において適用年に新たに雇用された雇用者で適用年の12月31日において当該移転型特定業務施設に勤務するものの総数をいいます。\n\n（注7）移転型非新規基準雇用者数とは、移転型特定業務施設のみを事業所とみなした場合における適用年の基準雇用者数から移転型新規雇用者総数を控除した数をいいます。\n\n（注8）地方事業所特別基準雇用者数とは、認定事業者が認定を受けた日を含む年以後3年以内に本店（本社機能）を地方に移転して、これに伴い整備した特定業務施設（工場を除きます。）のみを個人の事業所とみなした場合における基準雇用者数をいいます。\n\n### 対象者または対象物\n\n青色申告書を提出する個人で地域再生法に定める認定事業者となっている方\n\n#### 控除の適用を受けるための要件\n\nこの制度の適用を受けるためには、次のすべての要件を満たしている必要があります。\n\n（1）令和4年4月1日以降に地域再生法第17条の2第3項の認定を受けた者\n\nイ　適用年および適用前年（令和６年４月１日以降に認定を受ける場合は、適用年ならびに適用前年および適用前々年）に事業主都合による離職した雇用者および高年齢雇用者がいないこと\n\n（注1）雇用者とは、個人の使用人のうち雇用保険法第60条の2第1項第1号に規定する一般被保険者をいいます。\n\n（注2）高年齢雇用者とは、個人の使用人のうち雇用保険法第37条の2第1項に規定する高年齢被保険者をいいます。\n\nロ　雇用保険法に規定する適用事業を行い、かつ他の法律により業務の規制および適正化のための措置が講じられている事業として定めるものを行なっていないこと。\n\n（2）令和2年4月1日から令和4年3月31日までに地域再生法第17条の2第3項の認定を受けた者\n\nイ　適用年および適用前年に事業主都合による離職した雇用者および高年齢雇用者がいないこと\n\n（注1）雇用者とは、個人の使用人のうち雇用保険法第60条の2第1項第1号に規定する一般被保険者をいいます。\n\n（注2）高年齢雇用者とは、個人の使用人のうち雇用保険法第37条の2第1項に規定する高年齢被保険者をいいます。\n\nロ　特定新規雇用者等数が2人以上であること\n\n（注1）特定新規雇用者等数とは、「地方事業所基準雇用者数のうち特定新規雇用者数に達するまでの数＋地方事業所基準雇用者数から新規雇用者総数を控除した数」で算出された数をいいます。\n\n（注2）地方事業所基準雇用者数とは、認定事業者が認定を受けた日を含む年以後3年以内に地方活力向上地域に整備した特定業務施設（工場を除く。）のみを個人の事業所とみなした場合における基準雇用者数をいいます。\n\n（注3）特定新規雇用者数とは、特定業務施設において適用年に新たに雇用された特定雇用者（雇用者のうち無期雇用かつフルタイムの要件を満たす者をいいます。）で当該適用年の12月31日において勤務するものの総数をいいます。\n\n（注4）新規雇用者総数とは、特定業務施設において適用年に新たに雇用された雇用者で同年の12月31日において特定業務施設に勤務するものの総数をいいます。\n\n（注5）基準雇用者数とは、「適用年の12月31日の雇用者数－適用前年の12月31日の雇用者数」で算出された数をいいます。なお、適用年の12月31日において高年齢雇用者に該当する者は、適用年末およびその前年末の雇用者数に含めません。\n\n（注6）特定業務施設とは、地域再生法第5条第4項第5号に規定する特定業務施設で、同号に規定する地方活力向上地域において、同法第17条の2第6項に規定する認定地方活力向上地域特定業務施設整備計画に従って整備されたものをいいます。\n\nハ　雇用保険法に規定する適用事業を行い、かつ他の法律により業務の規制および適正化のための措置が講じられている事業として定めるものを行なっていないこと。\n\n（3）令和2年3月31日までに地域再生法第17条の2第3項の認定を受けた者\n\nイ　適用年および適用前年に事業主都合による離職した雇用者および高年齢雇用者がいないこと\n\n（注1）雇用者とは、個人の使用人のうち雇用保険法第60条の2第1項第1号に規定する一般被保険者をいいます。\n\n（注2）高年齢雇用者とは、個人の使用人のうち雇用保険法第37条の2第1項に規定する高年齢被保険者をいいます。\n\nロ　特定新規雇用者等数が2人以上であること\n\n（注1）特定新規雇用者等数とは、「地方事業所基準雇用者数のうち特定新規雇用者数に達するまでの数＋地方事業所基準雇用者数から新規雇用者総数を控除した数」で算出された数をいいます。\n\n（注2）地方事業所基準雇用者数とは、認定事業者が認定を受けた日を含む年以後3年以内に地方活力向上地域に整備した特定業務施設（工場を除く。）のみを個人の事業所とみなした場合における基準雇用者数をいいます。\n\n（注3）特定新規雇用者数とは、特定業務施設において適用年に新たに雇用された特定雇用者（雇用者のうち無期雇用かつフルタイムの要件を満たす者をいいます。）で当該適用年の12月31日において勤務するものの総数をいいます。\n\n（注4）新規雇用者総数とは、特定業務施設において適用年に新たに雇用された雇用者で同年の12月31日において特定業務施設に勤務するものの総数をいいます。\n\n（注5）基準雇用者数とは、「適用年の12月31日の雇用者数－適用前年の12月31日の雇用者数」で算出された数をいいます。なお、適用年の12月31日において高年齢雇用者に該当する者は、適用年末およびその前年末の雇用者数に含めません。\n\n（注6）特定業務施設とは、地域再生法第5条第4項第5号に規定する特定業務施設で、同号に規定する地方活力向上地域において、同法第17条の2第6項に規定する認定地方活力向上地域特定業務施設整備計画に従って整備されたものをいいます。\n\nハ　給与等支給額が比較給与等支給額以上であること\n\n（注1）給与等支給額とは、適用年の事業所得の計算上必要経費となる雇用者に対する給与等の支給額（給与等に充てるため他の者から受ける金額は控除します。）です。なお、適用年の12月31日において高年齢雇用者に該当する者に係るものを除きます。\n\n（注2）比較給与等支給額とは、「前年の事業所得の計算上必要経費となる雇用者に対する給与等の支給額（前年給与等支給額）」＋「前年給与等支給額×基準雇用者割合」×20パーセントで算出された金額（※）です。なお、適用年の12月31日において高年齢雇用者に該当する者に係るものを除きます。\n\n※前年末の雇用者数が零の場合は、前年給与等支給額×1．2で算出した額です。\n\n（注3）基準雇用者割合とは、基準雇用者数の適用年の前年の12月31日における雇用者の数に対する割合をいいます。\n\n二　雇用保険法に規定する適用事業を行い、かつ他の法律により業務の規制および適正化のための措置が講じられている事業として定めるものを行なっていないこと。\n\n### 対象期間\n\n#### 適用の対象となる期間（年度）\n\nこの制度は、令和元年から令和8年（令和8年3月31日までに拡充型事業の計画または移転型事業の計画の認定を受け、その認定日を含む年以後3年間に限ります。）の各年において、適用できます。\n\nただし、適用対象年であっても、事業を開始した個人のその開始した日の属する年（相続または包括遺贈により当該事業を承継した日の属する年を除きます。）およびその事業を廃止した日の属する年については適用できません。\n\n### 手続き\n\n#### 申告先等\n\n所轄税務署\n\n### 注意事項\n\n（1）雇用者とは、個人の使用人のうち雇用保険法の一般被保険者であるものをいい、個人の特殊関係者は除かれます。\n\nなお、個人の特殊関係者とは、次に掲げる者をいいます。\n\nイ　個人の親族\n\nロ　個人と婚姻の届出をしていないが事実上婚姻関係と同様の事情にある者\n\nハ　上記イ、ロ以外の者で個人から生計の支援を受けているもの\n\nニ　上記ロ、ハの者と生計を一にするこれらの者の親族\n\n（2）この制度の適用を受けるために確定申告書へ添付が必要な書類などは、次のとおりです。\n\nイ　公共職業安定所に雇用促進計画の提出を行い、都道府県労働局または公共職業安定所で、上記「控除の適用を受けるための要件」の（1）、（2）および基準雇用割合の要件についての確認を受け、その際交付される雇用促進計画の達成状況を確認した旨の書類の写しを確定申告書に添付する必要があります。\n\nロ　確定申告書に控除を受ける金額の記載およびその金額の計算に関する明細書を添付する必要があります。\n\nハ　この制度の適用を受ける場合は、復興産業集積区域において被災雇用者等を雇用した場合の税額控除、企業立地促進区域において避難対象雇用者等を雇用した場合の税額控除、避難解除区域等において避難対象雇用者等を雇用した場合の税額控除は適用できません。\n\nなお、[コード1286「給与等の引上げ及び設備投資を行った場合等の所得税額の特別控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1286.htm)または[コード1288「給与等の支給額が増加した場合の所得税額の特別控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1288.htm)の適用を受ける年分においては、控除額の調整を行ったうえで適用されます。","order":65},{"id":"no1286","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"給与等の引上げ及び設備投資を行った場合等の税額控除","yomi":"きゅうよとうのひきあげおよびせつびとうしをおこなったばあいとうのぜいがくこうじょ","code":"1286","title":"No.1286 給与等の引上げ及び設備投資を行った場合等の税額控除","summary":"この制度は、青色申告書を提出する個人が令和元年から令和3年までの各年において、国内雇用者に対して支払う給与等支給額が適用年の前年の給与等支払額に比して一定割合以上増加した場合に、税額控除が認められます。","basis":"旧措法10の5の4、旧措令5の6の3、震災特例法10の3、同10の3の2、同10の3の3、平30改正法附則65、令2改正法附則57、令3改正法附則30","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1286.htm","md":"### 概要\n\nこの制度は、青色申告書を提出する個人が令和元年から令和3年までの各年において、国内雇用者に対して支払う給与等支給額が適用年の前年の給与等支払額に比して一定割合以上増加した場合に、税額控除が認められます。\n\n（注）令和3年度の税制改正において、この制度は、「給与等の支給額が増加した場合の所得税額の特別控除」に改組しています。\n\n詳しくは、[コード1288「給与等の支給額が増加した場合の所得税額の特別控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1288.htm)を参照してください。\n\n#### 税額控除限度額（令和元年分から令和3年分）\n\n税額控除限度額は、次のとおりです。\n\nなお、税額控除限度額が調整前事業所得税額の20パーセントを超える場合には、その20パーセントが控除限度額となります。\n\n（1）中小事業者の場合\n\n適用年分の雇用者給与等支給額から比較雇用者給与等支給額を控除した金額の15パーセント（継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額の継続雇用者比較給与等支給額に対する割合が100分の2.5以上で次の要件のいずれかを満たす場合には25パーセント）相当額です。\n\nイ　適用年分の事業所得の計算上必要経費に算入される教育訓練費が前年分の教育訓練費より100分の10以上増加していること\n\nロ　中小企業等経営強化法の認定を受けた中小事業者で、経営力向上計画に記載された経営力向上が確実に行われたことにつき一定の証明がされたものであること\n\n（2）中小事業者以外の場合\n\n適用年分の雇用者給与等支給額から比較雇用者給与等支給額を控除した金額の15パーセント（適用年分の事業所得の計算上必要経費に算入される教育訓練費の額から比較教育訓練費の額を控除した金額の比較教育訓練費の額に対する割合が100分の20以上である場合には20パーセント）相当額です。\n\n### 対象者または対象物\n\n青色申告書を提出する個人\n\n#### 控除の適用を受けるための要件（令和元年分から令和3年分）\n\nこの制度の適用を受けるには、次の区分に応じて要件すべてを満たす必要があります\n\n（1）中小事業者の場合\n\nイ　雇用者給与等支給額が比較雇用者給与等支給額以上であること\n\nロ　継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額の継続雇用者比較給与等支給額に対する割合が100分の1.5以上であること\n\n（2）中小事業者以外の場合\n\nイ　雇用者給与等支給額が比較雇用者給与等支給額以上であること\n\nロ　継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額の継続雇用者比較給与等支給額に対する割合が100分の3以上であること\n\nハ　国内設備投資額がその償却費総額の100分の90（令和3年分については100分の95）に相当する金額以上であること\n\n＜参考＞用語の説明\n\n1　国内雇用者とは、個人の使用人（個人と特殊の関係のある者を除きます（注）。）のうち、個人の国内事業所に勤務する者で、労働基準法第108条に規定する賃金台帳に記載された者をいいます。\n\n（注）個人と特殊の関係にある者とは次の者をいいます。\n\nイ　個人の親族\n\nロ　個人と婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者\n\nハ　上記イ、ロ以外の者で個人から受ける金銭その他の資産（個人からの給与に該当しないものに限ります。）によって生計の支援を受けている者\n\nニ　上記ロ、ハに該当する者と生計を一にするこれらの者の親族\n\n2　国内新規雇用者とは、国内雇用者のうち、国内の事業所の勤務が1年を経過していない者をいいます。\n\n3　雇用者給与等支給額とは、適用年の事業所得の金額の計算上必要経費に算入される国内雇用者に対する給与等の支給額（その給与等に充てるため、他の者から支払を受ける金額がある場合には、これを給与等の支給額から差し引きます。）をいいます。\n\n4　比較雇用者給与等支給額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される国内雇用者に対する給与等の支給額をいいます。\n\n5　新規雇用者給与等支給額とは、適用年の事業所得の金額の計算上必要経費に算入される国内新規雇用者に対する給与等の支給額をいいます。\n\n6　新規雇用者比較給与等支給額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される国内新規雇用者に対する給与等の支給額をいいます。\n\n7　継続雇用者とは、適用年および適用年の前年の各月において給与の支給を受けた国内雇用者をいいます。\n\n8　継続雇用者給与等支給額とは、継続雇用者に対する適用年の給与等の支給額をいいます。\n\n9　継続雇用者比較給与等支給額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される国内雇用者に対する給与等の支給額をいいます。\n\n10　中小事業者とは、常時使用する従業員の数が1,000人以下の個人をいいます。\n\n11　比較教育訓練費の額とは、事業所得の金額の計算上必要経費に算入される教育訓練費の額（適用年の前年において事業を開始した場合には、適用年の前年の教育訓練費の額に12を乗じて、これを適用年の前年に事業を営んでいた月数で除した金額）をいいます。\n\n12　国内設備投資額とは、適用年において取得をした国内資産でその適用年の12月31日において有するものの取得価額の合計額をいいます。\n\n### 対象期間\n\n#### 適用の対象となる期間（年度）\n\nこの制度は、令和元年から令和3年までの各年（事業開始日および廃止日を含む年は除きます。）において適用できます。\n\n### 手続き\n\n#### 申告先等\n\n所轄税務署\n\n### 注意事項\n\n（1）この制度の適用を受けるためには、確定申告書に控除を受ける金額の記載およびその金額の計算に関する明細書を添付する必要があります。\n\n（2）この制度の適用を受ける場合は、特定復興産業集積区域において被災雇用者等を雇用した場合の税額控除、企業立地促進区域等において避難対象雇用者等を雇用した場合の税額控除、避難解除区域等において避難対象雇用者等を雇用した場合の税額控除は適用できません。\n\nなお、地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除の適用を受ける年分においては、控除額の調整を行ったうえで適用されます。\n\n地方活力向上地域等において雇用者の数が増加した場合の税額控除については、[コード1284「地方活力向上地域等において雇用者の数が増加した場合の所得税額の特別控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1284.htm)を参照してください。","order":66},{"id":"no1288","cat":"zeigaku-kojo","sub":"","kind":"entry","term":"給与等の支給額が増加した場合の所得税額の特別控除","yomi":"きゅうよとうのしきゅうがくがぞうかしたばあいのしょとくぜいがくのとくべつこうじょ","code":"1288","title":"No.1288 給与等の支給額が増加した場合の所得税額の特別控除","summary":"この制度は、青色申告書を提出する個人が令和4年から令和9年までの各年において、国内雇用者に対して支払う給与等支給額が適用年の前年の給与等支給額に比して一定割合以上増加した場合に、税額控除が認められます。","basis":"旧措法10の5の4、措法10の5の4、措令5の6の4、震災特例法10の3、10の3の2、10の3の3、令2改正法附則57、令3改正法附則30","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1288.htm","md":"### 概要\n\nこの制度は、青色申告書を提出する個人が令和4年から令和9年までの各年において、国内雇用者に対して支払う給与等支給額が適用年の前年の給与等支給額に比して一定割合以上増加した場合に、税額控除が認められます。\n\n#### 税額控除限度額（令和4年分）\n\n税額控除限度額は、次のとおりです。\n\nなお、税額控除限度額が調整前事業所得税額（租税特別措置法第10条第8項第4号に規定する金額をいいます。）の20パーセントを超える場合には、その20パーセントが控除限度額となります。\n\n（1）中小事業者の場合（「中小事業者」とは常時使用する従業員が1,000人以下の個人をいいます。）\n\n適用年分の雇用者給与等支給額から比較雇用者給与等支給額を控除した金額の15パーセント相当額です。ただし、次のイおよびロの要件を満たす場合には25パーセント相当額です。\n\nイ　雇用者給与等支給額から比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合が100分の2.5以上であること\n\nロ　次に掲げる要件のいずれかを満たすこと\n\n（ｲ）　教育訓練費の額から前年分の教育訓練費（比較教育訓練費）の額を控除した金額のその比較教育訓練費の額に対する割合が100分の10以上であること\n\n（ﾛ）　中小企業等経営強化法の認定を受けた中小事業者で、経営力向上計画に記載された経営力向上が確実に行われたことにつき一定の証明がされたものであること\n\n（2）中小事業者以外の場合\n\nその個人のその年の控除対象新規雇用者給与等支給額の15パーセント相当額です。\n\nただし、次の要件を満たす場合には5パーセントが加算されます。\n\n教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の20以上である場合。\n\n#### 税額控除限度額（令和5年分・令和6年分）\n\n税額控除限度額は、次のとおりです。\n\nなお、税額控除限度額が調整前事業所得税額（租税特別措置法第10条第8項第4号に規定する金額をいいます。）の20パーセントを超える場合には、その20パーセントが控除限度額となります。\n\n（1）中小事業者の場合（「中小事業者」とは常時使用する従業員が1,000人以下の個人をいいます。）\n\nその中小事業者のその年の控除対象雇用者給与等支給増加額の15パーセント相当額です。ただし、次のイおよびロの要件を満たす場合にはそれぞれの金額が加算されます。\n\nイ　雇用者給与等支給額から比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合が100分の2.5以上である場合は、控除対象雇用者給与等支給増加額の15パーセント相当額。\n\nロ　教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の10以上である場合は、控除対象雇用者給与等支給増加額の10パーセント相当額。\n\n（2）中小事業者以外の場合\n\nその個人のその年の控除対象雇用者給与等支給増加額の15パーセント相当額です。ただし、次のイおよびロの要件を満たす場合にはそれぞれの金額が加算されます。\n\nイ　継続雇用者給与等支給額が継続雇用者比較給与等支給額に対して4パーセント以上である場合は、控除対象雇用者給与等支給増加額の10パーセント相当額。\n\nロ　教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の20以上である場合は、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n#### 税額控除限度額（令和7年分から令和9年分）\n\n税額控除限度額は、次のとおりです。\n\nなお、税額控除限度額が調整前事業所得税額（租税特別措置法第10条第8項第4号に規定する金額をいいます。）の20パーセントを超える場合には、その20パーセントが控除限度額となります。\n\n（1）中小事業者の場合（「中小事業者」とは常時使用する従業員が1,000人以下の個人をいいます。）\n\nその中小事業者のその年の控除対象雇用者給与等支給増加額の15パーセント相当額です。ただし、次のイ、ロおよびハの要件を満たす場合にはそれぞれの金額が加算されます。\n\nイ　雇用者給与等支給額から比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合が100分の2.5以上である場合は、控除対象雇用者給与等支給増加額の15パーセント相当額。\n\nロ　次の(ｲ)および(ﾛ)の要件をすべて満たす場合には、控除対象雇用者給与等支給増加額の10パーセント相当額。\n\n（ｲ）　教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の5以上であること\n\n（ﾛ）　教育訓練費の額の雇用者給与等支給額に対する割合が100分の0.05以上であること\n\nハ　次の（ｲ）から（ﾆ）の要件のいずれかを満たす場合には、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n（ｲ）　その年において次世代育成支援対策推進法第13条の認定を受けたこと\n\n（ﾛ）　その年の12月31日において次世代育成支援対策推進法第15条の3第1項に規定する特例認定一般事業主に該当すること\n\n（ﾊ）　その年において女性の職業生活における活躍の推進に関する法律第9条の認定を受けたこと\n\n（ﾆ）　その年の12月31日において女性の職業生活における活躍の推進に関する法律第13条第1項に規定する特例認定一般事業主に該当すること\n\n（2） 特定個人の場合（「特定個人」とは常時使用する従業員が2,000人以下の個人をいいます。）\n\nその特定個人のその年の控除対象雇用者給与等支給増加額の10パーセント相当額です。ただし、次のイ、ロおよびハの要件を満たす場合にはそれぞれの金額が加算されます。\n\nイ　継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額のその継続雇用者比較給与等支給額に対する割合が100分の4以上である場合は、控除対象雇用者給与等支給増加額の15パーセント相当額。\n\nロ　次の(ｲ)および(ﾛ)の要件をすべて満たす場合には、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n（ｲ）　教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の10以上であること\n\n（ﾛ）　教育訓練費の額の雇用者給与等支給額に対する割合が100分の0.05以上であること\n\nハ　次の（ｲ）から（ﾊ）の要件のいずれかを満たす場合には、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n（ｲ）　その年の12月31日において次世代育成支援対策推進法第15条の3第1項に規定する特例認定一般事業主に該当すること\n\n（ﾛ）　その年において女性の職業生活における活躍の推進に関する法律第9条の認定を受けたこと\n\n（ﾊ）　その年の12月31日において女性の職業生活における活躍の推進に関する法律第13条第1項に規定する特例認定一般事業主に該当すること\n\n（3） 中小事業者又は特定個人以外の場合\n\nその個人のその年の控除対象雇用者給与等支給増加額の10パーセント相当額です。ただし、次のイ、ロおよびハの要件を満たす場合にはそれぞれの金額が加算されます。\n\nイ　継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額のその継続雇用者比較給与等支給額に対する割合が100分の4以上である場合は、控除対象雇用者給与等支給増加額の5パーセント相当額（その割合が100分の5以上である場合は、控除対象雇用者給与等支給増加額の10パーセント相当額。その割合が100分の7以上である場合は、控除対象雇用者給与等支給増加額の15パーセント相当額。\n\nロ　次の(ｲ)および(ﾛ)の要件をすべて満たす場合には、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n（ｲ）　教育訓練費の額から比較教育訓練費の額を控除した金額のその比較教育訓練費の額に対する割合が100分の10以上であること\n\n（ﾛ）　教育訓練費の額の雇用者給与等支給額に対する割合が100分の0.05以上であること\n\nハ　次の（ｲ）および（ﾛ）の要件のいずれかを満たす場合には、控除対象雇用者給与等支給増加額の5パーセント相当額。\n\n（ｲ）　その年の12月31日において次世代育成支援対策推進法第15条の3第1項に規定する特例認定一般事業主に該当すること\n\n（ﾛ）　その年の12月31日において女性の職業生活における活躍の推進に関する法律第13条第1項に規定する特例認定一般事業主に該当すること\n\n#### 繰越税額控除制度\n\n青色申告書を提出する中小事業者（「中小事業者」とは常時使用する従業員が1,000人以下の個人をいいます。）に、繰越税額控除限度超過額（税額控除限度額のうち控除しきれなかった金額）がある場合には、翌年以後5年間にわたり、繰越税額控除限度超過額（前年以前に既に控除された金額がある場合には、その残額）を控除することができます。\n\nなお、控除をしようとする年分の雇用者給与等支給額が比較雇用者給与等を超える場合に限ります。\n\nまた、その年の繰越税額控除限度超過額が、調整前事業所得税額（租税特別措置法第10条第8項第4号に規定する金額をいいます。）の20パーセントを超える場合には、その20パーセントが限度となります。\n\n### 対象者または対象物\n\n青色申告書を提出する個人\n\n#### 控除の適用を受けるための要件（令和4年分）\n\nこの制度の適用を受けるには、次の区分に応じた要件を満たす必要があります。\n\n（1）中小事業者の場合\n\n国内雇用者に対して給与等を支給する場合において、その年においてその中小事業者の雇用者給与等支給額から比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合が100分の1.5以上であること。\n\n（2）中小事業者以外の場合\n\n新規雇用者給与等支給額から新規雇用者比較給与等支給額を控除した金額のその新規雇用者比較給与等支給額に対する割合が100分の2以上であること\n\n＜参考＞\n\n1　国内雇用者とは、個人の使用人（個人と特殊の関係のある者を除きます（注）。）のうち、個人の有する国内事業所に勤務する者で、労働基準法第108条に規定する賃金台帳に記載された者をいいます。\n\n（注）個人と特殊の関係にある者とは次の者をいいます。\n\nイ　個人の親族\n\nロ　個人と婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者\n\nハ　上記イ、ロ以外の者で個人から受ける金銭その他の資産（個人からの給与に該当しないものに限ります。）によって生計の支援を受けている者\n\nニ　上記ロ、ハに該当する者と生計を一にするこれらの者の親族\n\n2　継続雇用者とは、適用年および適用年の前年の各月において給与の支給を受けた国内雇用者をいいます。\n\n3　雇用者給与等支給額とは、適用年の事業所得の金額の計算上必要経費に算入される国内雇用者に対する給与等の支給額をいいます。\n\n4　継続雇用者給与等支給額とは、継続雇用者に対する適用年の給与等の支給額として一定の金額をいいます。\n\n5　継続雇用者比較給与等支給額とは、継続雇用者に対する適用年の前年の給与等の支給額として一定の金額をいいます。\n\n6　比較雇用者給与等支給額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される国内雇用者に対する給与等の支給額（その適用年の前年において事業を営んでいた期間の月数と適用年において事業を営んでいた月数とが異なる場合にはその月数に応じ一定の計算をした金額）をいいます。\n\n7　比較教育訓練費の額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される教育訓練費の額（その中小事業者が適用年の前年において事業を開始した場合には、その適用年の前年の教育訓練費の額に12を乗じてこれをその適用年において事業を営んでいた期間の月数で除して計算した金額）をいいます。\n\n8　控除対象雇用者給与等支給増加額とは、雇用者給与支給額から比較雇用者給与支給額を控除した金額（その金額が適用年の調整雇用者給与等支給増加額を超える場合には、その調整雇用者等給与等支給増加額）をいいます。\n\n9　調整雇用者給与等支給増加額とは、雇用安定助成金等（給与等の支払に充てるため国又は地方公共団体から受ける金額をいいます）を控除して計算した雇用者給与等支給額から雇用調整助成金等を控除して計算した比較雇用者給与等支給額を控除した金額をいいます。\n\n10　新規雇用者給与等支給額とは、適用年の事業所得の金額の計算上必要経費に算入される国内新規雇用者に対する給与等の支給額をいいます。\n\n11　新規雇用者比較給与等支給額とは、適用年の前年分の事業所得の金額の計算上必要経費に算入される国内新規雇用者に対する給与等の支給額をいいます。\n\n#### 控除の適用を受けるための要件（令和5年分・令和6年分）\n\nこの制度の適用を受けるには、次の区分に応じた要件を満たす必要があります。\n\n（1）中小事業者の場合\n\n国内雇用者に対して給与等を支給する場合において、その年においてその中小事業者の雇用者給与等支給額から比較雇用者給与等支給額を控除した金額のその比較雇用者給与等支給額に対する割合が100分の1.5以上であること。\n\n（2）中小事業者以外の場合\n\n継続雇用者給与等支給額から継続雇用者比較給与等支給額を控除した金額のその継続雇用者比較給与等支給額に対する割合が100分の3以上であること\n\n#### 控除の適用を受けるための要件（令和7年分から令和9年分）\n\nこの制度の適用を受けるには、次の区分に応じた要件を満たす
