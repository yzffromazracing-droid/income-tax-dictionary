<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>所得税用語検索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 検索ヘッダーを上部に固定し、広い画面では「結果一覧｜本文」の2ペイン、狭い画面では一覧→本文の切替 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18212d;
  --muted: #586373;
  --line: #d9dfe7;
  --accent: #1f4d8c;
  --accent-soft: #e4ecf7;
  --mark: #ffe7a0;
  --mark-ink: #18212d;
  --c-hikazei: #0b7466;
  --c-kubun: #1f4d8c;
  --c-shotoku: #8d4a08;
  --c-zeigaku: #7b2c6c;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --header-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
    --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
    --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111720; --surface: #19212c; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2c3746;
  --accent: #8fb4ec; --accent-soft: #22324a; --mark: #6b5310; --mark-ink: #fff6dc;
  --c-hikazei: #5fd1bf; --c-kubun: #8fb4ec; --c-shotoku: #f0ae66; --c-zeigaku: #e09ad2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.7; margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, .result:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ヘッダー */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 14px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; letter-spacing: .04em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.searchbox { position: relative; }
.searchbox input {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 84px 10px 40px;
}
.searchbox input::placeholder { color: var(--muted); }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.searchbox kbd, .searchbox .clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
}
.searchbox kbd {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
}
.searchbox .clear {
  font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px;
}
/* カテゴリのタブ */
.tabbar { display: flex; align-items: flex-end; gap: 12px; margin-bottom: -12px; min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-size: 14.5px; cursor: pointer; color: var(--muted); white-space: nowrap;
  background: transparent; border: 0; border-bottom: 3px solid transparent;
  padding: 8px 14px 9px; display: inline-flex; gap: 7px; align-items: center;
}
.tab:hover { color: var(--ink); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tab .n {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  background: var(--bg); border-radius: 999px; padding: 0 7px; line-height: 1.6;
}
.tab .n.zero { opacity: .5; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--c); }
.tab[aria-selected="true"] .n { color: var(--ink); }
/* 所得区分の下のタブ（所得の種類） */
header.top.has-sub .tabbar { margin-bottom: 0; border-bottom: 1px solid var(--line); }
.subtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding-top: 2px; }
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap;
  background: transparent; border: 1px solid transparent; border-radius: 999px;
  padding: 3px 12px; display: inline-flex; gap: 5px; align-items: center;
}
.subtab:hover { color: var(--ink); border-color: var(--line); }
.subtab[aria-selected="true"] { color: var(--ink); font-weight: 700; background: var(--accent-soft); border-color: var(--line); }
.subtab .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.subtab .n.zero { opacity: .5; }
.status { margin-left: auto; padding-bottom: 12px; color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 本体 */
main.wrap { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; padding-block: 18px 40px; }
.list { display: grid; gap: 2px; align-content: start; min-width: 0; }
.group-label {
  font-size: 12px; letter-spacing: .08em; color: var(--muted); padding: 14px 10px 4px;
  display: flex; align-items: center; gap: 8px;
}
.group-label:first-child { padding-top: 0; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; line-height: 1.6; }
.empty .others { display: flex; flex-wrap: wrap; gap: 8px; }
.empty .others button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.result {
  display: grid; gap: 2px; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; width: 100%;
}
.result:hover { background: var(--accent-soft); }
.result[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.result .row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.result .term { font-weight: 700; min-width: 0; }
.result .code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.result .ry { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; overflow-wrap: anywhere; }
.result .snip { font-size: 12.5px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill {
  font-size: 11px; color: var(--c); border: 1px solid currentColor; border-radius: 4px;
  padding: 0 5px; white-space: nowrap; line-height: 1.6;
}
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 8px; cursor: pointer; margin-top: 6px; }
.empty { color: var(--muted); padding: 24px 10px; }
.empty p { margin: 0 0 10px; }

.detail {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 26px 32px 32px; min-width: 0; align-self: start;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 18px);
  max-height: calc(100vh - var(--header-h) - 36px - env(safe-area-inset-top, 0px)); overflow-y: auto;
}
.back { display: none; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0 0 12px; cursor: pointer; }
.detail .eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.detail h2 { font-family: var(--font-display); font-size: 27px; line-height: 1.4; margin: 6px 0 2px; text-wrap: balance; }
.detail .yomi { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); letter-spacing: .06em; overflow-wrap: anywhere; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0 0 18px; padding: 12px 0; border-block: 1px solid var(--line); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.law { font-family: var(--font-mono); font-size: 12px; }
.lead { font-size: 16px; margin: 0 0 18px; }
.body { max-width: 72ch; overflow-wrap: anywhere; }
.body h3 { font-size: 17px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.body h4 { font-size: 15.5px; margin: 20px 0 6px; }
.body h5, .body h6 { font-size: 14.5px; margin: 16px 0 4px; color: var(--muted); }
.body p { margin: 0 0 10px; }
.body ul { margin: 0 0 12px; padding-left: 1.4em; }
.body li { margin: 2px 0; }
.tbl { overflow-x: auto; margin: 6px 0 14px; }
.tbl table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 9px; vertical-align: top; text-align: left; }
.tbl th { background: var(--bg); font-weight: 700; }
.tbl td { font-variant-numeric: tabular-nums; }
.related { display: grid; gap: 12px; margin: 0 0 16px; padding: 0; list-style: none; }
.related li { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.related a { font-weight: 700; }
.related p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.source { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.source p { margin: 0; }
.source .meta { border: 0; padding: 0; margin: 0 0 10px; color: var(--ink); }
.rule { border-top: 1px solid var(--line); margin: 0 0 18px; }

footer.wrap { padding-block: 0 32px; color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  main.wrap { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; overflow: visible; padding: 18px 16px 24px; }
  .detail h2 { font-size: 23px; }
  .back { display: inline-block; }
  body.reading .list { display: none; }
  body:not(.reading) .detail { display: none; }
  .searchbox kbd { display: none; }
  .status { display: none; }
  .tabs { flex: 1; }
  .tab { flex: 1 1 0; justify-content: center; gap: 4px; padding: 8px 2px 9px; font-size: 13.5px; }
  .tab .dot { display: none; }
  .tab .n { padding: 0 5px; }
}
@media (prefers-reduced-motion: no-preference) {
  .result { transition: background-color .12s; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>所得税用語検索</h1>
      <p>国税庁タックスアンサーをもとにした 非課税・所得区分・所得控除・税額控除 の辞書</p>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="q" type="search" autocomplete="off" placeholder="用語・読み・金額・条文で検索（例：ふよう、123万円、所法9、NISA）" aria-label="検索">
      <kbd id="kbd">/</kbd>

</header>
<main class="wrap">
  <nav class="list" id="list" role="tabpanel" aria-label="用語の一覧"></nav>
  <article class="detail" id="detail" aria-live="polite"></article>
</main>
<footer class="wrap" id="foot"></footer>

<script id="dict-data" type="application/json">{"source":"国税庁 タックスアンサー（よくある税の質問）所得税","source_url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/code/index.htm","generated_at":"2026-10-18","as_of":"令和8年4月1日現在法令等","categories":[{"id":"hikazei","name":"非課税","description":"社会政策その他の見地から所得税を課さないこととされている所得（非課税所得）。","color":"hikazei","subtabs":[]},{"id":"shotoku-kubun","name":"所得区分","description":"所得税法上の10種類の所得の区分。","color":"kubun","subtabs":[{"id":"rishi","name":"利子所得"},{"id":"haito","name":"配当所得"},{"id":"fudosan","name":"不動産所得"},{"id":"jigyo","name":"事業所得"},{"id":"kyuyo","name":"給与所得"},{"id":"taishoku","name":"退職所得"},{"id":"sanrin","name":"山林所得"},{"id":"joto","name":"譲渡所得"},{"id":"ichiji","name":"一時所得"},{"id":"zatsu","name":"雑所得"}]},{"id":"shotoku-kojo","name":"所得控除","description":"所得金額から差し引かれる金額（所得控除）。","color":"shotoku","subtabs":[]},{"id":"zeigaku-kojo","name":"税額控除","description":"税金から差し引かれる金額（税額控除）。","color":"zeigaku","subtabs":[]}],"items":[{"id":"no2011","cat":"hikazei","sub":"","kind":"overview","term":"課税される所得と非課税所得","yomi":"かぜいされるしょとくとひかぜいしょとく","code":"2011","title":"No.2011 課税される所得と非課税所得","summary":"「収入」と「所得」という言葉は同じ意味のように使われることがありますが、税法上、収入から必要経費を差し引いたもの、つまり「もうけ」のことを「所得」と呼んでいます。","basis":"所法9、10、その他表に掲載","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","md":"### 概要\n\n#### 所得とは\n\n「収入」と「所得」という言葉は同じ意味のように使われることがありますが、税法上、収入から必要経費を差し引いたもの、つまり「もうけ」のことを「所得」と呼んでいます。\n\n所得税法では、所得の種類を[利子所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1310.htm)、[配当所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1330.htm)、[不動産所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1370.htm)、[事業所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1350.htm)、[給与所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm)、[退職所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1420.htm)、[山林所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1480.htm)、[譲渡所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1460.htm)、[一時所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1490.htm)および[雑所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1500.htm)の10種類に分類して、それぞれの所得の内容と計算方法を定めています。\n\nこのうち雑所得とは、「他の所得のいずれにも該当しない所得」をいいますから、所得税は個人が得たすべての所得に対して課税されるというのが原則です。\n\n#### 非課税所得\n\n所得税は、納税義務者に帰属するすべての所得に対して課税することを原則としていますが、所得の中には、社会政策その他の見地から所得税を課さないものがあります。これを非課税所得といいます。\n\n非課税所得は、所得税法および租税特別措置法のほか、その他の法律に規定されています。\n\n非課税所得は、所得金額の計算から除かれますから、非課税の適用を受けるための手続は原則として必要ありません。\n\nなお、非課税所得について損失が生じても、その損失はなかったものとみなされます。\n\n非課税所得の主なものには、次のようなものがあります。\n\n**【所得税法および租税特別措置法による主な非課税所得】**\n\n| 区 分 | 非課税所得の項目および内容 |\n|---|---|\n| 利子・配当所得関係 | ・　[障害者等の少額預金の利子等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1313.htm)(所法10)<br>・　[勤労者財産形成住宅貯蓄の利子等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1316.htm)(措法4の2)<br>・　[勤労者財産形成年金貯蓄の利子等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1319.htm)(措法4の3)<br>・　納税準備預金の利子(措法5)<br>・　オープン型証券投資信託の特別分配金(所法9①十一、所令27)<br>・　非課税口座内、未成年者口座内の少額上場株式等に係る配当等(いわゆる「[NISA、ジュニアNISA](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm)」)(措法9の8、9の9) |\n| 給与所得・公的年金関係 | ・　傷病者や[遺族などの受け取る恩給](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1605.htm)、年金等(所法9①三、所令20)<br>・　給与所得者に支給される一定の旅費、限度額内の通勤手当、職務の遂行上必要な現物給与(所法9①四～六、所令20～21)<br>・　国外で勤務する者の受ける一定の在外手当(所法9①七、所令22)<br>・　外国政府、国際機関等に勤務する外国政府職員等が受ける給与所得(所法9①八、所令23、24)<br>・　文化功労者年金法の規定による年金等(所法9①十三)<br>・　特定の取締役等が受ける新株予約権等の行使による株式の取得に係る経済的利益(いわゆる「[税制適格ストック・オプション](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1540.htm)」(措法29の2) |\n| 譲渡(山林)所得関係 | ・　生活に通常必要な動産の譲渡による所得(所法9①九、所令25)<br>・　資力喪失の場合の強制換価手続による譲渡による所得等(所法9①十、所令26)<br>・　非課税口座内、未成年者口座内の少額上場株式等に係る譲渡所得等(いわゆる「[NISA、ジュニアNISA](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm)」) (措法37の14、37の14の2)<br>・　国や地方公共団体等に財産を寄附した場合の譲渡所得等(措法40) |\n| その他 | ・　内廷費および皇族費(所法9①十二)<br>・　オリンピック、パラリンピックにおいて優秀な成績を収めた者に財団法人日本オリンピック委員会等から交付される金品(所法9①十四)<br>・　学資金および扶養義務を履行するために給付される金品(所法9①十五、所令29)<br>・　国または地方公共団体が行う保育・子育て助成事業により、保育・子育てに係る施設・サービスの利用に要する費用に充てるために給付される金品（所法9①十六）<br>・　相続、遺贈または個人からの贈与により取得するもの(所法9①十七)<br>・　心身に加えられた損害または突発的な事故により資産に加えられた損害に基づいて取得する保険金、[損害賠償金](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1700.htm)、慰謝料など(所法9①十八、所令30)<br>・　公職選挙法の適用を受ける選挙に係る公職の候補者が選挙運動に関し取得する金銭等(所法9①十九)<br>・　都道府県、市区町村から、消費税率の引上げに際して低所得者に配慮する観点から支払われる一定の給付金(措法41の8、措規19の2) |","order":0},{"id":"hk1","cat":"hikazei","kind":"hikazei","term":"障害者等の少額預金の利子等","yomi":"しょうがいしゃとうのしょうがくよきんのりしとう","alias":"","group":"利子・配当所得関係","basis":"所法10","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[{"title":"No.1313 障害者等のマル優(非課税貯蓄)","summary":"預貯金や公社債などの利子は、原則としてその支払の際に、15.315パーセント（他に地方税5パーセント）の税率を乗じて算出した所得税および復興特別所得税（令和9年以後は所得税、防衛特別所得税および復興特別所得税）が源泉徴収され、それだけで納税を完結させることができます。","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1313.htm"}],"order":1},{"id":"hk2","cat":"hikazei","kind":"hikazei","term":"勤労者財産形成住宅貯蓄の利子等","yomi":"きんろうしゃざいさんけいせいじゅうたくちょちくのりしとう","alias":"","group":"利子・配当所得関係","basis":"措法4の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[{"title":"No.1316 財形住宅貯蓄","summary":"預貯金などの利子は、原則として、その支払の際、一律15.315パーセント（他に地方税5パーセント）の税率を乗じて算出した所得税および復興特別所得税（令和9年以後は所得税、防衛特別所得税および復興特別所得税）が源泉徴収され、これにより納税を完結させることができます（注1）。","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1316.htm"}],"order":2},{"id":"hk3","cat":"hikazei","kind":"hikazei","term":"勤労者財産形成年金貯蓄の利子等","yomi":"きんろうしゃざいさんけいせいねんきんちょちくのりしとう","alias":"","group":"利子・配当所得関係","basis":"措法4の3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[{"title":"No.1319 財形年金貯蓄","summary":"預貯金などの利子は、原則として、その支払の際、一律15.315パーセント（他に地方税5パーセント）の税率を乗じて算出した所得税および復興特別所得税（令和9年以後は所得税、防衛特別所得税および復興特別所得税）が源泉徴収され、これにより納税を完結させることができます（注1）。","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1319.htm"}],"order":3}
