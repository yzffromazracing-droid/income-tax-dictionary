う保育・子育て助成事業により、保育・子育てに係る施設・サービスの利用に要する費用に充てるために給付される金品","yomi":"くにまたはちほうこうきょうだんたいがおこなうほいくこそだてじょせいじぎょうによりほいくこそだてにかかるしせつさーびすのりようにようするひようにあてるためにきゅうふされるきんぴん","alias":"","group":"その他","basis":"所法9①十六","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[],"order":20},{"id":"hk21","cat":"hikazei","kind":"hikazei","term":"相続、遺贈または個人からの贈与により取得するもの","yomi":"そうぞくいぞうまたはこじんからのぞうよによりしゅとくするもの","alias":"","group":"その他","basis":"所法9①十七","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[],"order":21},{"id":"hk22","cat":"hikazei","kind":"hikazei","term":"心身に加えられた損害または突発的な事故により資産に加えられた損害に基づいて取得する保険金、損害賠償金、慰謝料など","yomi":"しんしんにくわえられたそんがいまたはとっぱつてきなじこによりしさんにくわえられたそんがいにもとづいてしゅとくするほけんきんそんがいばいしょうきんいしゃりょうなど","alias":"","group":"その他","basis":"所法9①十八、所令30","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[{"title":"No.1700 加害者から治療費、慰謝料及び損害賠償金などを受け取ったとき","summary":"交通事故などのために、被害者が次のような治療費、慰謝料、損害賠償金などを受け取ったときは、これらの損害賠償金等は非課税となります。","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1700.htm"}],"order":22},{"id":"hk23","cat":"hikazei","kind":"hikazei","term":"公職選挙法の適用を受ける選挙に係る公職の候補者が選挙運動に関し取得する金銭等","yomi":"こうしょくせんきょほうのてきようをうけるせんきょにかかるこうしょくのこうほしゃがせんきょうんどうにかんししゅとくするきんせんとう","alias":"","group":"その他","basis":"所法9①十九","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[],"order":23},{"id":"hk24","cat":"hikazei","kind":"hikazei","term":"都道府県、市区町村から、消費税率の引上げに際して低所得者に配慮する観点から支払われる一定の給付金","yomi":"とどうふけんしくちょうそんからしょうひぜいりつのひきあげにさいしてていしょとくしゃにはいりょするかんてんからしはらわれるいっていのきゅうふきん","alias":"","group":"その他","basis":"措法41の8、措規19の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2011.htm","summary":"","related":[],"order":24},{"id":"no1300","cat":"shotoku-kubun","sub":"","kind":"overview","term":"所得の区分のあらまし","yomi":"しょとくのくぶんのあらまし","code":"1300","title":"No.1300 所得の区分のあらまし","summary":"所得税法では、その性質によって所得を次の10種類に区分しています。","basis":"所法23～28、30～35、所基通34-1、35-1、35-2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1300.htm","md":"### 概要\n\n所得税法では、その性質によって所得を次の10種類に区分しています。\n\n#### 利子所得\n\n利子所得とは、預貯金や公社債の利子ならびに合同運用信託、公社債投資信託および公募公社債等運用投資信託の収益の分配に係る所得をいいます。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1310.htm)\n\n#### 配当所得\n\n配当所得とは、株主や出資者が法人から受ける配当や、投資信託（公社債投資信託および公募公社債等運用投資信託以外のもの）および特定受益証券発行信託の収益の分配などに係る所得をいいます。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1330.htm)\n\n#### 不動産所得\n\n不動産所得とは、土地や建物などの不動産、借地権など不動産の上に存する権利、船舶や航空機の貸付け（地上権または永小作権の設定その他他人に不動産等を使用させることを含みます。）による所得（事業所得または譲渡所得に該当するものを除きます。）をいいます。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1370.htm)\n\n#### 事業所得\n\n事業所得とは、農業、漁業、製造業、卸売業、小売業、サービス業その他の事業から生ずる所得をいいます。\n\nただし、不動産の貸付けや山林の譲渡による所得は、原則として不動産所得や山林所得になります。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1350.htm)\n\n#### 給与所得\n\n給与所得とは、使用人や役員等が支払いを受ける俸給や給料、賃金、歳費、賞与のほか、これらの性質を有する給与に係る所得をいいます。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm)\n\n#### 退職所得\n\n退職所得とは、退職により勤務先から受ける退職手当や厚生年金基金等の加入員の退職に基因して支払われる厚生年金保険法に基づく一時金などの所得をいいます。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1420.htm)\n\n#### 山林所得\n\n山林所得とは、山林を伐採して譲渡したり、立木のままで譲渡することによって生ずる所得をいいます。\n\nただし、山林を取得してから5年以内に伐採または譲渡した場合には、山林所得ではなく、 事業所得または雑所得になります。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1480.htm)\n\n#### 譲渡所得\n\n譲渡所得とは、土地、建物、ゴルフ会員権などの資産を譲渡することによって生ずる所得、建物などの所有を目的とする地上権などの設定による所得で一定のものをいいます。\n\nただし、事業用の商品などの棚卸資産、山林、減価償却資産のうち一定のものなどを譲渡することによって生ずる所得は、譲渡所得となりません。\n\n詳しくは、こちらを参照してください。\n\n[コード1460「譲渡所得（土地、建物及び株式等以外の資産を譲渡したとき）」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1460.htm)\n\n[コード1440「譲渡所得（土地や建物を譲渡したとき）」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1440.htm)\n\n[コード1463「株式等を譲渡したときの課税（申告分離課税）」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1463.htm)\n\n#### 一時所得\n\n一時所得とは、上記利子所得から譲渡所得までのいずれの所得にも該当しないもので、営利を目的とする継続的行為から生じた所得以外のものであって、労務その他の役務の対価としての性質や資産の譲渡による対価としての性質を有しない一時の所得をいいます。\n\n例えば次に掲げるようなものに係る所得が該当します。\n\n（1）懸賞や福引の賞金品、競馬や競輪の払戻金\n\n（2）[生命保険の一時金や損害保険の満期返戻金](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1755.htm)\n\n（3）法人から贈与された金品\n\n（注）これらの所得でも一時所得に該当しない場合があります。詳しくは、[コード1490「一時所得」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1490.htm)を参照してください。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1490.htm)\n\n#### 雑所得\n\n雑所得とは、上記利子所得から一時所得までの所得のいずれにも該当しない所得をいいます。\n\n例えば次に掲げるようなものに係る所得が該当します。\n\n（1）公的年金等\n\n（2）非営業用貸金の利子\n\n（3）副業に係る所得（原稿料やシェアリングエコノミーに係る所得など）\n\n（4）生命保険契約等に基づく年金\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1500.htm)","order":25},{"id":"no1310","cat":"shotoku-kubun","sub":"rishi","kind":"entry","term":"利息を受け取ったとき(利子所得)","yomi":"りそくをうけとったときりししょとく","code":"1310","title":"No.1310 利息を受け取ったとき(利子所得)","summary":"利子所得とは、預貯金および公社債の利子ならびに合同運用信託、公社債投資信託および公募公社債等運用投資信託の収益の分配に係る所得をいいます。","basis":"所法9、10、23、181、182、郵政民営化整備法附則97、措法3、3の4、4～4の3、5、8の4、8の5、9の3の2、財形法2、6、納税貯蓄組合法8、復興財確法13、28、防衛財確法5の9、5の26、平成25改正法附則19、令和3改正法附則16","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1310.htm","md":"### 概要\n\n利子所得とは、預貯金および公社債の利子ならびに合同運用信託、公社債投資信託および公募公社債等運用投資信託の収益の分配に係る所得をいいます。\n\n#### 所得の金額の計算\n\n利子等の収入金額（源泉徴収される前の金額）が、そのまま利子所得の金額となります。\n\n#### 税額の計算方法\n\n利子所得は、原則として、その支払を受ける際、利子所得の金額に一律15.315パーセント（他に地方税5パーセント）の税率を乗じて算出した所得税および復興特別所得税（令和9年分以後は所得税、防衛特別所得税および復興特別所得税。以下同じです。）が源泉徴収され、これにより納税が完結する[源泉分離課税](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2230.htm)の対象となり、確定申告をすることはできません。\n\nただし、平成28年1月1日以後に支払を受けるべき特定公社債等（注）の利子等については、その支払を受ける際に税率15.315パーセント（他に地方税5パーセント）により所得税および復興特別所得税が源泉徴収されるとともに、税率15.315パーセント（他に地方税5パーセント）の申告分離課税の対象となりますが、確定申告しないことも選択できます。なお、確定申告においてこれらのいずれかを選択した後は、修正申告や更正の請求において、この選択を変更することはできません。\n\n（注）特定公社債等とは、国債、地方債、外国国債、公募公社債、上場公社債、平成27年12月31日以前に発行された公社債（同族会社が発行した社債を除きます。）などの一定の公社債や公社債投資信託などをいいます\n\nまた、特定公社債以外の公社債の利子のうち次のものは総合課税の対象となります。\n\n1　平成28年1月1日以後に支払を受けるべき同族会社が発行した社債の利子で、その同族会社の判定の基礎となる一定の株主およびその親族等が支払を受けるもの\n\n2　令和3年4月1日以後に支払を受けるべき同族会社が発行した社債の利子で、その同族会社の判定の基礎となる株主である法人と特殊の関係のある個人（法人との間に発行済株式等の50パーセント超の保有関係がある個人等）およびその親族等が支払を受けるもの\n\n3　令和8年4月1日以後に同族会社の役員等が支払を受けるべきその同族会社以外の法人が発行した社債の利子で、実質的にその同族会社から支払を受けるものと認められる場合（注）における当該利子\n\n（注） 「実質的にその同族会社から支払を受けるものと認められる場合」とは、特定法人が発行した社債に係る債務についての同族会社による保証の契約その他の契約の内容その他の状況からみて、同族会社の役員等が特定法人が発行した社債に係る債務の不履行により実質的に損失を受けないと認められる場合をいいます。\n\n（注1）平成25年1月1日から令和29年12月31日までの間に支払を受ける利子等については、所得税とともに復興特別所得税が源泉徴収されます。\n\n（注2）平成25年から令和29年までの各年分は、復興特別所得税を所得税と併せて申告・納付することになります。\n\n※令和8年度税制改正により、防衛特別所得税の創設ならびに復興特別所得税の税率の引下げおよび課税期間の延長が行われ、令和9年以後に適用されます（改正前と改正後とで、防衛特別所得税および復興特別所得税の合計税率に変更はありません。）。\n\n上記（注1）（注2）の課税期間は令和8年度税制改正による延長後の課税期間となります。\n\n（注3）特定公社債等の利子等を含む上場株式等の配当等の課税関係については、[コード1331「上場株式等の配当等に係る申告分離課税制度」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm)を参照してください。\n\n#### 利子所得の非課税制度\n\n利子所得には、次のような非課税制度があります。\n\n（1）障害者等の少額貯蓄非課税制度\n\nこの非課税制度には、障害者等の少額預金の利子所得等の非課税制度（いわゆるマル優）、障害者等の少額公債の利子の非課税制度（いわゆる特別マル優）があり、それぞれの元本の額が350万円までの利子等について非課税とされます。\n\nこれらの制度を利用できる人は、国内に住所を有する個人で、身体障害者手帳の交付を受けている人、遺族年金を受け取ることができる妻である人など、一定の要件に該当する人に限られています。\n\nなお、障害者等の郵便貯金の利子所得の非課税制度は、郵政民営化に伴い廃止されました。\n\nただし、郵政民営化前に非課税の適用を受けて預入された一定の郵便貯金の利子については、満期（または解約）までの間、引き続き非課税とされています。\n\n（注）郵政民営化後（平成19年10月1日以後 ）においては、郵便貯金の利子については、障害者等のマル優の適用対象とされています。\n\n（2）勤労者財産形成住宅貯蓄および勤労者財産形成年金貯蓄の利子非課税制度\n\n勤労者財産形成促進法に基づくいわゆる[財形住宅貯蓄](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1316.htm)、[財形年金貯蓄](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1319.htm)について、両方の貯蓄の元本の額の合計が550万円までの利子等について非課税とされます。\n\nこの制度を利用できる人は、勤労者財産形成促進法に規定する勤労者で一定の要件に該当する人に限られています。\n\n[詳細はこちら](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1313.htm)\n\n#### 非課税とされる利子\n\n納税貯蓄組合預金の利子、納税準備預金の利子やいわゆる子供銀行の預貯金等の利子については、非課税とされています。","order":26},{"id":"no1330","cat":"shotoku-kubun","sub":"haito","kind":"entry","term":"配当金を受け取ったとき(配当所得)","yomi":"はいとうきんをうけとったときはいとうしょとく","code":"1330","title":"No.1330 配当金を受け取ったとき(配当所得)","summary":"配当所得とは、株主や出資者が法人から受ける剰余金や利益の配当、剰余金の分配、基金利息、投資法人からの金銭の分配または投資信託（公社債投資信託および公募公社債等運用投資信託以外のもの）および特定受益証券発行信託の収益の分配などに係る所得をいいます。","basis":"所法24、181、182、措法8の2、8の4、8の5、9の3、37の11の6、復興財確法28、防衛財確法5の26","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1330.htm","md":"### 概要\n\n配当所得とは、株主や出資者が法人から受ける剰余金や利益の配当、剰余金の分配、基金利息、投資法人からの金銭の分配または投資信託（公社債投資信託および公募公社債等運用投資信託以外のもの）および特定受益証券発行信託の収益の分配などに係る所得をいいます。\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n配当所得の金額は、次のように計算します。\n\n収入金額（源泉徴収税額や外国所得税額を差し引く前の金額）-株式などを取得するための借入金の利子\n\n= 配当所得の金額\n\n（注）収入金額から差し引くことができる借入金の利子は、株式など配当所得を生ずべき元本のその年における保有期間に対応する部分に限られます。\n\nなお、譲渡した株式に係るものや確定申告をしないことを選択した配当に係るものについては、収入金額から差し引くことができる借入金の利子には当たりません。\n\n#### 配当所得の源泉徴収\n\n配当所得は、配当等の支払の際に次に掲げる株式等の区分に応じて所得税等が源泉徴収されます。源泉徴収された所得税等は、原則として、その年分の納付すべき所得税額等を計算する際に差し引きます。\n\n（1）[上場株式等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1463.htm)の配当等の場合（大口株主等（注1）が支払いを受ける上場株式等の配当等を除きます。）\n\n15.315パーセント（他に地方税5パーセント）の税率により所得税および復興特別所得税（注2）が源泉徴収されます。\n\n（2）上場株式等以外の配当等の場合（大口株主等（注1）が支払いを受ける上場株式等の配当等を含みます。）\n\n20.42パーセント（地方税なし）の税率により所得税および復興特別所得税（注2）が源泉徴収されます。\n\n（注1）この大口株主等とは、内国法人の発行済株式の総数等の3パーセント以上に相当する数または金額の株式等を有する個人をいいます。\n\n（注2）平成25年1月1日から令和29年12月31日までの間に支払を受ける配当等については、所得税とともに復興特別所得税が源泉徴収されます。\n\n※　令和9年1月1日以後に生ずる所得については、復興特別所得税の税率が1.1パーセントに引き下げられ、防衛特別所得税（源泉徴収すべき所得税の額の1％相当額）が併せて源泉徴収されます。\n\n#### 税額の計算方法\n\n配当所得は、原則として総合課税の対象となる所得として、確定申告の対象とされますが、「大口株主等」（注）が支払いを受けるものを除いた[上場株式等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1463.htm)の配当等については確定申告において、総合課税によらず、申告分離課税を選択することができます（申告分離課税の選択は、確定申告する上場株式等の配当所得の全額についてしなければなりません。）。\n\nなお、「大口株主等」（注）が支払いを受ける上場株式等の配当等および上場株式等以外の配当等については、総合課税の対象となりますので、申告分離課税や確定申告不要制度（下記（２）イの「少額配当」である場合を除きます。）を選択することはできません。\n\n上場株式等の配当所得に係る申告分離課税制度については、[コード1331「上場株式等の配当等に係る申告分離課税制度」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm)を参照してください。\n\n（注）この「大口株主等」には、上記「配当所得の源泉徴収」に掲げる大口株主等のほか、令和5年10月1日以後に内国法人から支払われる上場株式等の配当等について、その支払いを受ける者およびその支払いを受ける者を判定の基礎となる株主として選定した場合に同族会社に該当する法人が保有する株式等の、その内国法人の発行済株式等の総数等に占める割合（株式等保有割合）が3パーセント以上となる場合の、その支払いを受ける者を含みます。以下同じです。\n\n（1）総合課税\n\n総合課税とは、各種所得の金額を合計して所得税額を計算するというものです。\n\n総合課税の対象とした配当所得については、一定のものを除き配当控除の適用を受けることができます。\n\n配当控除の適用については、[コード1250「配当所得があるとき(配当控除)」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1250.htm)を参照してください。\n\n（2）確定申告不要制度\n\n配当所得のうち、一定のものについては納税者の判断により確定申告をしなくてもよいこととされています。これを「確定申告不要制度」といいます。\n\n確定申告不要制度の対象となる配当等は、主に次のとおりとなっていますが、この制度を適用するかどうかは、1回に支払を受けるべき配当等の額ごと（[特定口座制度](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1476.htm)における源泉徴収口座に受け入れた配当等については、口座ごと）に選択することができます。\n\nなお、確定申告不要制度を選択した配当所得に係る源泉徴収税額は、その年分の所得税額から差し引くことはできません。\n\nイ 少額配当である場合（ロに掲げる配当等を除き、「大口株主等」が支払を受ける場合を含みます。）\n\n一回に支払を受けるべき配当等の金額が、次により計算した金額以下である場合（少額配当である場合）には、確定申告を要しません。\n\n10万円 × 配当計算期間の月数（注） ÷ 12\n\n（注）配当計算期間が1年を超える場合には、12月として計算します。また、配当計算期間に1月に満たない端数がある場合には、1月として計算します。\n\nロ 上場株式等の配当等の場合（「大口株主等」が支払を受ける場合を除きます。）\n\n支払を受けるべき配当等の金額にかかわらず、確定申告を要しません。\n\n（注1）上記の確定申告不要制度には、公募投資信託（特定株式投資信託を除く。）の収益の分配に係る配当等、特定投資法人から支払を受ける投資口の配当等、公募特定受益証券発行信託の収益の分配および公募特定目的信託の社債的受益権の剰余金の配当も含まれます。\n\n（注2）私募公社債等運用投資信託の受益権および特定目的信託（私募のものに限ります。）の社債的受益権（上場株式等に該当するものを除きます。）の収益の分配については、15.315パーセント（他に地方税5パーセント）の税率による源泉徴収だけで納税が完結する[源泉分離課税](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2230.htm)\nの対象とされています。","order":27},{"id":"no1370","cat":"shotoku-kubun","sub":"fudosan","kind":"entry","term":"不動産収入を受け取ったとき(不動産所得)","yomi":"ふどうさんしゅうにゅうをうけとったときふどうさんしょとく","code":"1370","title":"No.1370 不動産収入を受け取ったとき(不動産所得)","summary":"不動産所得とは、次の（1）から（3）までの所得（事業所得または譲渡所得に該当するものを除きます。）をいいます。","basis":"所法26、36、37、49","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1370.htm","md":"### 概要\n\n不動産所得とは、次の（1）から（3）までの所得（事業所得または譲渡所得に該当するものを除きます。）をいいます。\n\n（1） 土地や建物などの不動産の貸付け\n\n（2） 借地権など不動産の上に存する権利の設定および貸付け\n\n（3） 船舶や航空機の貸付け\n\n### 計算方法・計算式\n\n不動産所得の金額は、次のように計算します。\n\n総収入金額 - 必要経費 ＝ 不動産所得の金額\n\n#### 総収入金額\n\n総収入金額には、貸付けによる賃貸料収入のほかに、次のようなものも含まれます。\n\nイ 名義書換料、承諾料、更新料または頭金などの名目で受領するもの\n\nロ 敷金や保証金などのうち、返還を要しないもの\n\nハ 共益費などの名目で受け取る電気代、水道代や掃除代など\n\n#### 必要経費\n\n必要経費とすることができるものは、不動産収入を得るために直接必要な費用のうち家事上の経費と明確に区分できるものであり、主なものとして貸付資産に係る次に掲げるものがあります。\n\nイ 固定資産税\n\nロ 損害保険料\n\nハ [減価償却費](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2100.htm)\n\nニ [修繕費](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1379.htm)","order":28},{"id":"no1350","cat":"shotoku-kubun","sub":"jigyo","kind":"entry","term":"事業所得の課税のしくみ(事業所得)","yomi":"じぎょうしょとくのかぜいのしくみじぎょうしょとく","code":"1350","title":"No.1350 事業所得の課税のしくみ(事業所得)","summary":"事業所得とは、農業、漁業、製造業、卸売業、小売業、サービス業その他の事業を営んでいる人のその事業から生ずる所得をいいます。","basis":"所法27、36、37、39、40、45、57、所令94、165、措法27、措令18の2、震災特例法6、7、10の2～11の3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1350.htm","md":"### 概要\n\n事業所得とは、農業、漁業、製造業、卸売業、小売業、サービス業その他の事業を営んでいる人のその事業から生ずる所得をいいます。\n\nただし、 不動産の貸付けや山林の譲渡による所得は事業所得ではなく、原則として[不動産所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1370.htm)や[山林所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1480.htm)になります。\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n事業所得の金額は、次のように計算します。\n\n総収入金額-必要経費＝事業所得の金額\n\n### 総収入金額\n\n総収入金額には、それぞれの事業から生ずる売上金額のほかに、例えば、次のようなものも含まれます。\n\nイ 金銭以外の物や権利その他の経済的利益の価額\n\nロ 商品を自家用に消費した場合や贈与した場合のその商品の価額\n\nハ 商品などの棚卸資産について損失を受けたことにより支払を受ける保険金や損害賠償金等\n\nニ 空箱や作業くずなどの売却代金\n\nホ 仕入割引やリベート収入\n\n### 必要経費\n\n必要経費とは、収入を得るために直接必要な売上原価や販売費、管理費その他費用のことをいい、例えば、次に掲げるようなものがあります。\n\nなお、家事上の経費は必要経費になりませんが、家事上の経費に関連する経費のうち、事業所得を生ずべき業務の遂行上必要である部分を明らかに区分することができる場合のその部分に相当する経費の金額は必要経費となります。\n\nイ 売上原価\n\nロ 給与、賃金\n\nハ 地代、家賃\n\nニ 減価償却費\n\n### 必要経費の特例\n\nイ [家内労働者等の必要経費の特例](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1810.htm)\n\n家内労働者等については、必要経費の額が69万円（注）に満たない場合には、最高69万円（注）（令和2年分から令和6年分は55万円、令和7年分は65万円）まで必要経費とすることができる特例があります。\n\n（注）　令和8年12月1日に施行され、令和8年分から適用される金額です。施行日前の適用関係などについては、[「令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）」](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)をご確認ください。\n\nロ 事業に専ら従事する親族がある場合の必要経費の特例\n\n事業主が生計を一にする配偶者その他の親族に支払う給料などは、原則として必要経費に算入されません。\n\nただし、一定の要件に該当する場合には、それぞれ次のように取り扱われ、必要経費に算入することができます。詳しくは、[コード2075「青色事業専従者給与と事業専従者控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm#a-1)を参照してください。\n\n（イ） 青色申告者の場合\n\n事業主と生計を一にする配偶者その他の親族が、事業主の事業に従事することができると認められる期間の2分の1を超える期間、その事業に専ら従事することにより、税務署長に提出された届出書に記載された範囲内の給与の支払を受けた場合には、事業主はその給与の額のうち労務の対価として適正な金額を事業所得の必要経費に算入することができます。\n\n（ロ） 白色申告者の場合\n\n事業主と生計を一にする配偶者その他の親族が、事業主の事業にその年を通じて6か月を超える期間、その事業に専ら従事した場合には、事業主は、親族1人につき最高50万円（配偶者の場合には最高86万円）を必要経費とみなして、事業所得の計算をすることができます。","order":29},{"id":"no1400","cat":"shotoku-kubun","sub":"kyuyo","kind":"entry","term":"給与所得","yomi":"きゅうよしょとく","code":"1400","title":"No.1400 給与所得","summary":"給与所得とは、使用人や役員等が支払いを受ける俸給や給料、賃金、歳費、賞与のほか、これらの性質を有する給与に係る所得をいいます。","basis":"所法28、36、57の2、120、121、122、183、190、所令167の3、措法41の3の11、所基通36-15、復興財確法28、防衛財確法5の26","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm","md":"### 概要\n\n給与所得とは、使用人や役員等が支払いを受ける俸給や給料、賃金、歳費、賞与のほか、これらの性質を有する給与に係る所得をいいます。\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n給与所得の金額は、次のように計算します。\n\n収入金額(源泉徴収される前の金額) - 給与所得控除額 ＝ 給与所得の金額\n\n#### 収入金額\n\n収入金額には、金銭で支給されるもののほか、給与の支払者から受けた次のような[経済的利益](https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2508.htm#a-2)も含まれます。\n\nイ 商品などを無償または低い価額で譲り受けたこと\n\nロ 土地や建物などを無償または低い使用料で借り受けたこと\n\nハ 金銭を無利息または低い利息で借り受けたこと\n\nこれらの経済的利益を現物給与といいますが、特定の現物給与については、課税上金銭で支給される給与とは異なった取扱いが定められています。\n\n#### 給与所得控除\n\n給与所得は、[事業所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1350.htm)などのように必要経費を差し引くことができない（次の「給与所得者の特定支出控除」を適用する場合を除きます。）代わりに所得税法で定めた給与所得控除額を給与等の収入金額から差し引きます。詳しくは、[コード1410「給与所得控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm)を参照してください。\n\n#### 給与所得者の特定支出控除\n\n給与所得者が次のイからトの費用について一定の要件を満たす支出（その支出について給与等の支払者により補てんされる部分があり、かつ、その補てんされる部分につき所得税が課されない場合におけるその補てんされる部分の金額を除きます。以下「特定支出」といいます。）をし、その年中の特定支出の額の合計額が給与所得控除額の2分の1相当額を超えるときは、確定申告によりその超える部分の金額を給与所得控除後の金額から差し引くことができます。\n\nイ 通勤費\n\nロ 職務上の旅費\n\nハ 転居費\n\nニ 研修費\n\nホ 資格取得費\n\nヘ 単身赴任者の帰宅旅費\n\nト 勤務必要経費（図書費・衣服費・交際費等）（※）\n\n※　勤務必要経費は65万円が上限です。\n\n（注）これらの特定支出のうち、職務上の旅費については令和2年分の所得税から特定支出の対象とされています。詳しくは、[コード1415「給与所得者の特定支出控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1415.htm)を参照してください。\n\n#### 所得金額調整控除\n\n一定の給与所得者の総所得金額を計算する場合に、一定の金額を給与所得の金額から控除するというもので、イ 子ども・特別障害者等を有する者等の所得金額調整控除と、ロ 給与所得と年金所得の双方を有する方に対する所得金額調整控除の2種類の控除があります。詳しくは、[コード1411「所得金額調整控除」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1411.htm)を参照してください。\n\n#### 税額の精算\n\n給与所得者は、勤務先において月々の給与を受け取る際に所得税および復興特別所得税が源泉徴収されていますが、受け取る給与がその１か所のみであれば、原則、その勤務先において行われる年末調整によって源泉所得税等が精算され、そこで手続きが終了します。一方で①2か所以上からの給与や不動産所得など他の所得があり、年末調整を行った給与所得との合計により税額を計算する場合、②年間の給与収入の金額が2千万円を超えることにより年末調整の対象とならない場合、③[医療費控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm)などの適用によって[税金の還付](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2030.htm)を受ける場合などは、[確定申告](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2020.htm)によって税額の精算手続きを行う必要があります。\n\n（注）平成25年1月1日から令和29年12月31日までの間に支払を受ける給与等については、所得税とともに復興特別所得税が源泉徴収されます。\n\n※　令和9年1月1日以後に生ずる所得については、復興特別所得税の税率が1.1パーセントに引き下げられ、防衛特別所得税（源泉徴収すべき所得税の額の１パーセント相当額）が併せて源泉徴収されます。","order":30},{"id":"no1420","cat":"shotoku-kubun","sub":"taishoku","kind":"entry","term":"退職金を受け取ったとき(退職所得)","yomi":"たいしょくきんをうけとったときたいしょくしょとく","code":"1420","title":"No.1420 退職金を受け取ったとき(退職所得)","summary":"退職所得とは、退職により勤務先から受ける退職手当などの所得をいい、社会保険制度などにより退職に基因して支給される一時金、確定拠出年金法に規定する企業型年金規約または個人型年金規約に基づいて老齢給付金として支給される一時金なども退職所得とみなされます。","basis":"所法30、31、120～122、199、201～203、所令72、措法29の4、所基通30-3、30-5、復興財確法28、防衛財確法5の26","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1420.htm","md":"### 概要\n\n退職所得とは、退職により勤務先から受ける退職手当などの所得をいい、社会保険制度などにより退職に基因して支給される一時金、確定拠出年金法に規定する企業型年金規約または個人型年金規約に基づいて老齢給付金として支給される一時金なども退職所得とみなされます。\n\nまた、労働基準法第20条の規定により支払われる解雇予告手当や賃金の支払の確保等に関する法律第7条の規定により退職した労働者が弁済を受ける未払賃金も退職所得に該当します。\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n退職所得の金額は、原則として、次のように計算します。\n\n（収入金額（源泉徴収される前の金額） － 退職所得控除額） × 1 ／ 2 ＝ 退職所得の金額\n\nなお、確定給付企業年金規約に基づいて支給される退職一時金などで、従業員自身が負担した保険料または掛金がある場合には、その支給額から従業員が負担した保険料または掛金の金額を差し引いた残額を退職所得の収入金額とします。\n\n（注1）退職手当等が「特定役員退職手当等」に該当する場合\n\n特定役員退職手当等（役員等勤続年数が5年以下である人が支払を受ける退職手当等のうち、その役員等勤続年数に対応する退職手当等として支払を受けるもの）については、退職金の額から退職所得控除額を差し引いた額が退職所得の金額になります（上記計算式の2分の1計算の適用はありません。）。\n\n「役員等勤続年数」とは、退職金等に係る勤続期間のうち、役員等として勤務した期間の年数（1年未満の端数がある場合はその端数を1年に切り上げたもの）をいいます。\n\n「役員等」とは次のイからハに掲げる人をいいます。\n\nイ 法人の取締役、執行役、会計参与、監査役、理事、監事および清算人ならびにこれら以外の者で法人の経営に従事している一定の者\n\nロ 国会議員および地方公共団体の議会の議員\n\nハ 国家公務員および地方公務員\n\n（注2）退職手当等が「短期退職手当等」に該当する場合\n\n短期退職手当等（短期勤続年数に対応する退職手当等として支払を受けるものであって、特定役員退職手当等に該当しないもの）については、退職金の額から退職所得控除額を差し引いた額のうち300万円を超える部分については、上記計算式の2分の1計算の適用はありません。\n\n「短期勤続年数」とは、役員等以外の者として勤務した期間により計算した勤続年数が5年以下であるものをいい、この勤続年数については役員等として勤務した期間がある場合、その期間を含めて計算します。\n\n#### 退職所得控除額の計算方法\n\n退職所得控除額は、次のように計算します。\n\n退職所得控除額の計算の表\n\n| 勤続年数(＝A) | 退職所得控除額 |\n|---|---|\n| 20年以下 | 40万円 × A<br>(80万円に満たない場合には、80万円) |\n| 20年超 | 800万円 ＋ 70万円 × (A - 20年) |\n\n（注1）障害者になったことが直接の原因で退職した場合の退職所得控除額は、上記の方法により計算した額に、100万円を加えた金額となります。\n\n（注2）前年以前に退職金を受け取ったことがあるときまたは同一年中に2か所以上から退職金を受け取るときなどは、控除額の計算が異なることがあります。\n\n（例1）勤続年数が10年2か月の人の場合の退職所得控除額\n\n勤続年数は11年になります。\n\n（端数の2か月は1年に切上げ）\n\n40万円×（勤続年数）＝40万円×11年＝440万円\n\n（例2）勤続年数が30年の人の場合の退職所得控除額\n\n800万円＋70万円×（勤続年数-20年）＝800万円＋70万円×10年＝1,500万円\n\n#### 税額の計算方法\n\n退職所得は、原則として他の所得と分離して所得税額を計算します。\n\n(1)「退職所得の受給に関する申告書」を提出している人\n\n退職金等の支払者が所得税額および復興特別所得税額（令和9年以後は所得税額、防衛特別所得税額および復興特別所得税額。以下同じです。）を計算し、その退職手当等の支払の際、退職所得の金額に応じた所得税等の額が源泉徴収されるため、原則として確定申告は必要ありません。\n\nただし、医療費控除や寄附金控除の適用を受けるなどの理由で確定申告書を提出する場合は、確定申告書に退職所得の金額を記載する必要があります。\n\n(2)「退職所得の受給に関する申告書」を提出していない人\n\n退職金等の支払金額の20.42パーセントの所得税額および復興特別所得税額が源泉徴収されますが、受給者本人が[確定申告](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2020.htm)を行うことにより所得税額および復興特別所得税額の精算をします。\n\n（注）平成25年1月1日から令和29年12月31日（※）までの間に支払を受ける退職手当等については、所得税とともに復興特別所得税が課されます。\n\nなお、令和8年度税制改正により、防衛特別所得税の創設並びに復興特別所得税の税率の引下げおよび課税期間の延長が行われ、令和9年以後に適用されます（改正前と改正後とで、防衛特別所得税及び復興特別所得税の合計税率に変更はありませんので、改正前後で、源泉徴収税額の計算方法に変更は生じません。）。\n\n※　令和8年度税制改正による延長後の課税期間となります。","order":31},{"id":"no1480","cat":"shotoku-kubun","sub":"sanrin","kind":"entry","term":"山林所得","yomi":"さんりんしょとく","code":"1480","title":"No.1480 山林所得","summary":"山林所得とは、山林を伐採して譲渡したり、立木のままで譲渡することによって生ずる所得をいいます。ただし、山林を取得してから5年以内に譲渡した場合は、山林所得ではなく事業所得か雑所得になります。また、山林を土地付で譲渡する場合の土地の部分は、譲渡所得になります。","basis":"所法32、37、39、89、措法30、30の2、措規12、13、所基通32-1、32-2、震災特例法6、7","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1480.htm","md":"### 概要\n\n山林所得とは、山林を伐採して譲渡したり、立木のままで譲渡することによって生ずる所得をいいます。ただし、山林を取得してから5年以内に譲渡した場合は、山林所得ではなく[事業所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1350.htm)か[雑所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1500.htm)になります。また、山林を土地付で譲渡する場合の土地の部分は、[譲渡所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1440.htm)になります。\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n山林所得の金額は、次のように計算します。\n\n総収入金額－必要経費－特別控除額（最高50万円）＝山林所得の金額\n\n#### 総収入金額\n\n譲渡の対価が収入金額となります。\n\nなお、山林を伐採して自己の家屋を建築するために使用するなど家事のために消費した場合は、その消費したときの時価が総収入金額に算入されます。\n\n#### 必要経費\n\n必要経費は、植林費などの取得費のほか、下刈費などの育成費、維持管理のために必要な管理費、さらに、伐採費、運搬費、仲介手数料などの譲渡費用です。\n\n#### 必要経費の特例\n\n必要経費には、概算経費控除といわれる特例もあります。伐採または譲渡した年の15年前の12月31日以前から引き続き所有していた山林を伐採または譲渡した場合は、収入金額から伐採費などの譲渡費用を差し引いた金額の50パーセントに相当する金額に伐採費などの譲渡費用を加えた金額を必要経費とすることができます。\n\n#### 税額の計算方法\n\n山林所得は、他の所得と合計せず、他の所得と異なった計算方法により税額を計算し確定申告することになります。\n\nこれは、5分5乗方式といわれるもので、次のように計算します。\n\n（ 課税山林所得金額 ×5分の1× 税率 ） × 5","order":32},{"id":"no1440","cat":"shotoku-kubun","sub":"joto","kind":"entry","term":"譲渡所得(土地や建物を譲渡したとき)","yomi":"じょうとしょとくとちやたてものをじょうとしたとき","code":"1440","title":"No.1440 譲渡所得(土地や建物を譲渡したとき)","summary":"譲渡所得とは、一般的に土地、建物、株式等、ゴルフ会員権、金地金などの資産を譲渡することによって生ずる所得をいいます。","basis":"所法33、36、措法31、32、33の4、34～34の3、35～35の3、36、復興財確法9、13、17、18","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1440.htm","md":"### 概要\n\n譲渡所得とは、一般的に土地、建物、株式等、ゴルフ会員権、金地金などの資産を譲渡することによって生ずる所得をいいます。\n\nただし、事業用の商品などの棚卸資産や山林などの譲渡による所得は、譲渡所得にはなりません。\n\n### 計算方法・計算式\n\n#### 所得の計算方法（土地や建物を譲渡したとき）\n\n譲渡所得の金額は、次のように計算します。\n\n収入金額 - （ [取得費](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3252.htm) ＋ [譲渡費用](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3255.htm)） - 特別控除額 ＝ 課税譲渡所得金額\n\n（1） 収入金額\n\n譲渡所得の収入金額は、通常、土地や建物の譲渡の対価として買主から受け取る金銭の額です。\n\nなお、譲渡代金のほかに、譲渡から年末までの期間に対応する固定資産税および都市計画税（未経過固定資産税等）に相当する額の支払を受けた場合には、その額は譲渡価額に算入されます。\n\nまた、金銭の代わりに物や権利などを受け取った場合も、その物や権利などの時価が収入金額になります。\n\nおって、資産を譲り渡すことによって、その他経済的な利益を受けた場合は、その経済的な利益も収入金額に含まれます。\n\n（2） 特別控除額\n\n土地や建物を譲渡した場合の特別控除額は次のようになっています（特別控除は一定の要件を満たす場合に適用されます）。\n\n（イ） [収用等により土地建物を譲渡した場合](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3552.htm) ・・・ 5,000万円\n\n（ロ） [マイホーム（居住用財産）を譲渡した場合](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3302.htm) ・・・ 3,000万円\n\n（[被相続人の居住用財産（空き家）を譲渡した場合](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3306.htm)・・・ 3,000万円または2,000万円）\n\n（ハ） 特定土地区画整理事業等のために土地等を譲渡した場合 ・・・ 2,000万円\n\n（ニ） 特定住宅地造成事業等のために土地等を譲渡した場合 ・・・ 1,500万円\n\n（ホ） [平成21年及び平成22年に取得した土地等を譲渡した場合](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3225.htm)・・・1,000万円\n\n（ヘ） 農地保有の合理化等のために農地等を譲渡した場合 ・・・ 800万円\n\n（ト） [低未利用土地等を譲渡した場合](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3226.htm) ・・・ 100万円\n\n（注1） （ホ）、（ト）以外の特別控除額は、長期譲渡所得、短期譲渡所得のいずれからも一定の順序で控除することができます。（ホ）、（ト）の特別控除額は、長期譲渡所得に限り控除することができます。\n\n（注2） 長期譲渡所得は、譲渡した年の1月1日現在で所有期間が5年を超える土地建物を、また、短期譲渡所得は譲渡した年の1月1日現在で所有期間が5年以下の土地建物をそれぞれ譲渡したことによる所得をいいます。\n\n（注3） 土地、建物の譲渡所得から差し引く特別控除額の最高限度額は、年間の譲渡所得全体を通じて5,000万円です。\n\n#### 税額の計算方法（土地や建物を譲渡したとき）\n\n土地や建物の譲渡による所得は、他の所得、例えば給与所得などと合計せず、[分離して計算する分離課税制度](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2240.htm)が採用されており、譲渡所得の税額は次のように計算します。\n\n（1） 長期譲渡所得\n\n課税長期譲渡所得金額×15％\n\n（2） 短期譲渡所得\n\n課税短期譲渡所得金額×30％\n\n（注）平成25年から令和29年までの各年分については、復興特別所得税を所得税と併せて申告・納付します。\n\n復興特別所得税額は、[基準所得税額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1000.htm#nagare)に2.1パーセントの税率を掛けて計算します。","order":33},{"id":"no1460","cat":"shotoku-kubun","sub":"joto","kind":"entry","term":"譲渡所得(土地、建物及び株式等以外の資産を譲渡したとき)","yomi":"じょうとしょとくとちたてものおよびかぶしきとういがいのしさんをじょうとしたとき","code":"1460","title":"No.1460 譲渡所得(土地、建物及び株式等以外の資産を譲渡したとき)","summary":"譲渡所得とは、一般的に土地、建物、株式等、ゴルフ会員権、金地金などの資産を譲渡することによって生ずる所得をいいます。","basis":"所法22、33、所令81、82、所基通33-1の2、33-1の3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1460.htm","md":"### 概要\n\n譲渡所得とは、一般的に土地、建物、株式等、ゴルフ会員権、金地金などの資産を譲渡することによって生ずる所得をいいます。\n\nただし、事業用の商品などの棚卸資産や山林の譲渡、使用可能期間が1年未満の減価償却資産や取得価額が10万円未満の減価償却資産（業務の性質上基本的に重要なものを除きます。以下同じ。）および一括償却資産の必要経費算入の規定の適用を受けた減価償却資産などの譲渡による所得は、譲渡所得に含まれません。\n\n### 計算方法・計算式\n\n#### 所得の計算方法（土地、建物および株式等以外の資産を譲渡したとき）\n\n譲渡所得のうち、土地、建物および株式等以外の資産を譲渡したときの譲渡所得の金額は、次のように計算します。\n\n短期譲渡所得の総収入金額-（[取得費](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3252.htm)＋[譲渡費用](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3255.htm)）＋長期譲渡所得の総収入金額-（[取得費](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3252.htm)＋[譲渡費用](https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3255.htm)）＝譲渡益\n\n譲渡益-特別控除額（最高50万円）＝譲渡所得の金額\n\n（1）短期譲渡所得と長期譲渡所得の区分\n\n短期譲渡所得とは、所有期間が5年以下の資産を譲渡することにより生ずる所得をいいます。ただし、自己の研究成果である特許権などは所有期間に関係なく、長期譲渡所得となります。\n\n長期譲渡所得とは、所有期間が5年を超える資産を譲渡することにより生ずる所得をいいます。\n\n（2）特別控除額\n\n特別控除額は、短期譲渡所得と長期譲渡所得の合計で50万円までです。\n\nまず先に短期譲渡所得の譲渡益から控除し、残りがあれば長期譲渡所得の譲渡益から控除します。譲渡益が50万円より少ない場合は、譲渡益が特別控除額となります。\n\n#### 税額の計算方法（土地、建物および株式等以外の資産を譲渡したとき）\n\n土地、建物および株式等以外の資産を譲渡したことによる所得は、他の所得、例えば[給与所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm)などと合計して、総所得金額を求め、所得控除の合計額を控除し、その残額に所得税の税率を乗じて税額を計算します。\n\nなお、総所得金額を求めるときに合計する所得金額は、短期譲渡所得の金額は、その全額ですが、長期譲渡所得の金額は、その2分の1に相当する金額となります","order":34},{"id":"no1490","cat":"shotoku-kubun","sub":"ichiji","kind":"entry","term":"一時所得","yomi":"いちじしょとく","code":"1490","title":"No.1490 一時所得","summary":"一時所得とは、営利を目的とする継続的行為から生じた所得以外の所得で、労務や役務の対価としての性質や資産の譲渡による対価としての性質を有しない一時の所得をいいます。","basis":"所法22、34、措法41の9、41の10、所基通34-1、復興財確法28、防衛財確法5の26","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1490.htm","md":"### 概要\n\n一時所得とは、営利を目的とする継続的行為から生じた所得以外の所得で、労務や役務の対価としての性質や資産の譲渡による対価としての性質を有しない一時の所得をいいます。\n\n#### 内容\n\n一時所得には、次のようなものがあります。\n\n（1）懸賞や福引きの賞金品（業務に関して受けるものを除きます。）\n\n（2）競馬や競輪の払戻金（営利を目的とする継続的行為から生じたものを除きます。）\n\n（3）[生命保険の一時金(業務に関して受けるものを除きます。)や損害保険の満期返戻金等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1755.htm)\n\n（4）法人から贈与された金品（業務に関して受けるもの、継続的に受けるものを除きます。）\n\n（5）遺失物拾得者や埋蔵物発見者の受ける報労金等\n\n（6）資産の移転等の費用に充てるため受けた交付金のうち、その交付の目的とされた支出に充てられなかったもの\n\n### 計算方法・計算式\n\n#### 所得の計算方法\n\n一時所得の金額は、次のように計算します。\n\n総収入金額 - 収入を得るために支出した金額(注) - 特別控除額(最高50万円) ＝ 一時所得の金額\n\n（注） その収入を生じた行為をするため、または、その収入を生じた原因の発生に伴い、直接要した金額に限ります。\n\n#### 税額の計算方法\n\n一時所得は、その所得金額の2分の1に相当する金額を[給与所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm)などの他の所得の金額と合計して総所得金額を求めた後、納める税額を計算します。\n\nただし、懸賞金付預貯金等の懸賞金等や、[一時払養老保険、一時払損害保険等(保険期間が5年以内であるなど一定の要件を満たすもの)](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1520.htm)の差益等については、20.315パーセント（所得税および復興特別所得税15.315パーセント、地方税5パーセント）の税率による源泉分離課税が適用されますので、確定申告を行うことはできません。\n\n（注） 平成25年1月1日から令和29年12月31日までの間に生ずる所得については、所得税とともに復興特別所得税が源泉徴収されます。\n\n※　令和9年1月1日以後に生ずる所得については、復興特別所得税の税率が1.1パーセントに引き下げられ、防衛特別所得税（源泉徴収すべき所得税の額の1パーセント相当額）が併せて源泉徴収されます。","order":35},{"id":"no1500","cat":"shotoku-kubun","sub":"zatsu","kind":"entry","term":"雑所得","yomi":"ざつしょとく","code":"1500","title":"No.1500 雑所得","summary":"雑所得とは、利子所得、配当所得、不動産所得、事業所得、給与所得、退職所得、山林所得、譲渡所得および一時所得のいずれにも当たらない所得をいい、例えば、公的年金等、非営業用貸金の利子、副業に係る所得（原稿料やシェアリングエコノミーに係る所得など）が該当します。","basis":"所法35、67、69、120、203の2、204、232、所令196の2、196の3、197、所規40、102、所基通35-1～2、措法41の10、41の14、復興財確法28、防衛財確法5の26","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1500.htm","md":"### 概要\n\n雑所得とは、利子所得、配当所得、不動産所得、事業所得、給与所得、退職所得、山林所得、譲渡所得および一時所得のいずれにも当たらない所得をいい、例えば、公的年金等、非営業用貸金の利子、副業に係る所得（原稿料やシェアリングエコノミーに係る所得など）が該当します。\n\n#### 所得の計算方法\n\n雑所得の金額は、次の（1）から（3）の合計額です。\n\n（1） [公的年金等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1600.htm)\n\n収入金額 - 公的年金等控除額 = 公的年金等の雑所得\n\n（注）公的年金等控除額は、受給者の年齢、年金の収入金額に応じて定められています。\n\n（2）業務に係るもの\n\n総収入金額　–　必要経費　＝　業務に係る雑所得\n\n（注）業務に係るものとは、副業に係る収入のうち営利を目的とした継続的なものをいいます。\n\n（3）（1）、（2）以外のもの\n\n総収入金額 - 必要経費　=　その他の雑所得\n\n#### 税額の計算方法\n\n雑所得の金額は、[給与所得](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1400.htm)などの他の所得の金額と合計して総所得金額を求めた後、納める税額を計算します。\n\nなお、一定の先物取引による所得については申告分離課税が適用されます。\n\n詳しくは、[コード1522「先物取引に係る雑所得等の課税の特例」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1522.htm)を参照してください。\n\n#### 所得税の源泉徴収\n\n公的年金等や原稿料・講演料などは、原則として支払の際に源泉徴収が行われます。\n\nなお、[定期積金の給付補てん金、抵当証券の利息など、いわゆる金融類似商品の収益について](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1520.htm)は、その支払の際に一律20.315パーセント（所得税および復興特別所得税15.315パーセント、地方税5パーセント）の税率で源泉徴収が行われます。これらの所得については、[源泉分離課税](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2230.htm)が適用されますので、確定申告を行うことはできません。\n\n（注）平成25年1月1日から令和29年12月31日までの間に生ずる所得については、所得税とともに復興特別所得税が源泉徴収されます。\n\n※　令和9年1月1日以後に生ずる所得については、復興特別所得税の税率が1.1パーセントに引き下げられ、防衛特別所得税（源泉徴収すべき所得税の額の1パーセント相当額）が併せて源泉徴収されます。\n\n#### 令和4年分以後の業務に係る雑所得\n\n令和4年分以後の所得税において、業務に係る雑所得を有する場合で、その年の前々年分の業務に係る雑所得の収入金額が300万円を超える方は、[現金預金取引等関係書類](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2080.htm)を保存する必要があります。\n\n（注）「現金預金取引等書類」とは、居住者等が上記の業務に関して作成し、または受領した請求書、領収書その他これらに類する書類（自己の作成したこれらの書類でその写しのあるものは、その写しを含みます。）のうち、現金の収受もしくは払出しまたは預貯金の預入もしくは引出しに際して作成されたものをいいます。\n\nまた、業務に係る雑所得を有しており、その年の前々年分の業務に係る雑所得の収入金額が1,000万円を超える方が確定申告書を提出する場合には、総収入金額や必要経費の内容を記載した書類（収支内訳書など）の添付が必要になります。\n\nなお、その年の前々年分の収入金額が300万円以下である方は、業務に係る雑所得の金額の計算上総収入金額および必要経費に算入すべき金額は、その年において収入した金額および支出した費用の額とすることができます（いわゆる現金主義の特例）。ただし、この特例を受けるには、確定申告書にこの特例を受ける旨を記載しなければなりません。\n\n### 注意事項\n\n雑所得の金額の計算上生じた損失の金額は、他の所得の金額と損益通算はできません。","order":36},{"id":"no1100","cat":"shotoku-kojo","sub":"","kind":"overview","term":"所得控除のあらまし","yomi":"しょとくこうじょのあらまし","code":"1100","title":"No.1100 所得控除のあらまし","summary":"所得税法では所得控除の制度を設けています。","basis":"所法2、72～84の2、86、165","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1100.htm","md":"### 概要\n\n所得税法では所得控除の制度を設けています。\n\nこれは、所得税額を計算するうえで、社会政策上の要請によるもの、各納税者の個人的事情への考慮や最低生活費を保障するためのものなど、税負担面での調整を行う趣旨から設けられているものです。\n\n### 所得控除の種類\n\nそれぞれの所得控除の要件に当てはまる場合には、各種所得の金額の合計額から各種所得控除の額の合計額を差し引きます。\n\n所得税額は、その残りの金額を基礎として計算されます。\n\n所得控除の種類は次のとおりです。\n\n[雑損控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1110.htm)、[医療費控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm)、[社会保険料控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1130.htm)、[小規模企業共済等掛金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1135.htm)、[生命保険料控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1140.htm)、[地震保険料控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1145.htm)、[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)、[障害者控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1160.htm)、[寡婦控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1170.htm)、[ひとり親控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1171.htm)、[勤労学生控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1175.htm)、[配偶者控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1191.htm)、[配偶者特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1195.htm)、[扶養控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1180.htm)、[特定親族特別控除（注）](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1177.htm)、[基礎控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm)\n\nなお、日本国内に住所などがない、いわゆる[非居住者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2875.htm)が適用できる所得控除は、[雑損控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1110.htm)、[寄附金控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm)、[基礎控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm)の3種類です。\n\n（注） 令和7年分以降の年分について適用されます。","order":37},{"id":"no1110","cat":"shotoku-kojo","sub":"","kind":"entry","term":"災害や盗難などで資産に損害を受けたとき(雑損控除)","yomi":"さいがいやとうなんなどでしさんにそんがいをうけたときざっそんこうじょ","code":"1110","title":"No.1110 災害や盗難などで資産に損害を受けたとき(雑損控除)","summary":"災害または盗難もしくは横領によって、下記の「雑損控除の対象になる資産の要件」にあてはまる資産について損害を受けた場合には、一定の金額の所得控除を受けることができます。これを雑損控除といいます。","basis":"所法2、62、71、71の2、72、87、120、所令9、178、203、204、204の2、205、206、262、災免法2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1110.htm","md":"### 概要\n\n災害または盗難もしくは横領によって、下記の「雑損控除の対象になる資産の要件」にあてはまる資産について損害を受けた場合には、一定の金額の所得控除を受けることができます。これを雑損控除といいます。\n\n(注)雑損控除とは別に、その年の所得金額の合計額が1,000万円以下の人が災害にあった場合は、[災害減免法による所得税の軽減免除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1902.htm)があり、納税者の選択によりどちらか有利な方法を選べます。\n\n#### 雑損控除の金額\n\n次の(1)と(2)のうちいずれか多い方の金額です。\n\n（1)　（損害金額+災害等関連支出の金額-保険金等の額）-（[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)）×10％\n\n（2)　（災害関連支出の金額-保険金等の額）-5万円\n\n(注1)「損害金額」とは、損害を受けた時の直前におけるその資産の時価を基にして計算した損害の額です。\n\n「損害金額」については、[災害により被害を受けた住宅や家財、車両の損失額の「合理的な計算方法」で計算することができます。詳しくは、こちらをご覧ください。](https://www.nta.go.jp/taxes/shiraberu/saigai/h30/0018008-045/01-2.htm)\n\nまた、損害を受けた資産が減価償却資産である場合には、その資産の取得価額から非業務用資産として計算した減価償却費累積額相当額を控除した金額を基礎として損害金額を計算することもできます。\n\n(注2)「災害等関連支出の金額」とは、次のような支出をいいます。\n\n①　災害により滅失した住宅、家財などを取壊しまたは除去するために支出した金額など\n\n②　盗難や横領により損害を受けた資産の原状回復のための支出など\n\n(注3）「保険金等の額」とは、災害などに関して受け取った保険金や損害賠償金などの金額をいいます。\n\n保険金等の額は、まず、損害金額から差し引き、保険金等の額が損害金額を超える場合には、災害（等）関連支出の金額から差し引きます。\n\n(注4）「災害関連支出の金額」とは、上記(注2）①の金額をいいます。\n\n### 対象者または対象物\n\n#### 雑損控除の対象になる資産の要件\n\n損害を受けた資産が次のいずれにも当てはまること。\n\n（1）資産の所有者が次のいずれかであること。\n\nイ 納税者\n\nロ 納税者と生計を一にする配偶者やその他の親族で、その年の総所得金額等が58万円以下（注）（令和2年分から令和6年分までは48万円以下）の方\n\n（注）令和8年12月1日に施行され、令和8年分から適用される金額は「62万円以下」です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n（2）棚卸資産もしくは事業用固定資産等または「生活に通常必要でない資産」のいずれにも該当しない資産であること。\n\n（注）「生活に通常必要でない資産」とは、例えば、別荘など趣味、娯楽、保養または鑑賞の目的で保有する不動産（平成26年4月1日以後は同じ目的で保有する不動産以外の資産（ゴルフ会員権など）も含まれます。）や貴金属（製品）や書画、骨董など1個または1組の価額が30万円超のものなど生活に通常必要でない動産をいいます。\n\n#### 損害の原因\n\n次のいずれかの場合に限られます。\n\n（1）震災、風水害、冷害、雪害、落雷など自然現象の異変による災害\n\n（2）火災、火薬類の爆発など人為による異常な災害\n\n（3）害虫などの生物による異常な災害\n\n（4）盗難\n\n（5）横領\n\nなお、詐欺や恐喝の場合には、雑損控除は受けられません。\n\n### 手続き\n\n#### 申告等の方法\n\n確定申告書に雑損控除に関する事項を記載するとともに、災害等に関連したやむを得ない支出の金額の領収を証する書類を添付するか、提示してください。\n\nなお、損失額が大きくてその年の所得金額から控除しきれない場合には、翌年以後3年間(東日本大震災又は令和5年4月1日以後に発生する特定非常災害により生じた損失額については、5年間)に繰り越して、各年の所得金額から控除することができます(雑損控除は他の所得控除に先だって控除することとなっています。）。\n\n(注)「特定非常災害」とは、特定非常災害の被害者の権利利益の保全等を図るための特別措置に関する法律第2条第1項の規定により特定非常災害として指定された非常災害をいいます。\n\nまた、給与所得のある方について、平成31年4月1日以後、給与所得の源泉徴収票は、確定申告書への添付または確定申告書を提出する際の提示が不要となりました。ただし、確定申告書を作成する際には引き続き給与所得の源泉徴収票が必要となりますので、税務署等へお越しになる際には忘れずにお持ちください。\n\n#### 申告先等\n\n所轄税務署","order":38},{"id":"no1120","cat":"shotoku-kojo","sub":"","kind":"entry","term":"医療費を支払ったとき（医療費控除）","yomi":"いりょうひをしはらったときいりょうひこうじょ","code":"1120","title":"No.1120 医療費を支払ったとき（医療費控除）","summary":"その年の1月1日から12月31日までの間に自己または自己と生計を一にする配偶者やその他の親族のために医療費を支払った場合において、その支払った医療費が一定額を超えるときは、その医療費の額を基に計算される金額（下記「医療費控除の対象となる金額」参照）の所得控除を受けることができます。これを医療費控除といいます。","basis":"所法73、120、措法41の17、所令262、所規47の2、措令26の27の3、措規19の10の2の2、所基通73-1～10、平成29年改正法附則7、58、令和2年改正規則附則3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm","md":"### 概要\n\nその年の1月1日から12月31日までの間に自己または自己と生計を一にする配偶者やその他の親族のために医療費を支払った場合において、その支払った医療費が一定額を超えるときは、その医療費の額を基に計算される金額（下記「医療費控除の対象となる金額」参照）の所得控除を受けることができます。これを医療費控除といいます。\n\n#### 医療費控除の対象となる医療費の要件\n\n（1）納税者が、自己または自己と生計を一にする配偶者やその他の親族のために支払った医療費であること。\n\n（2）その年の1月1日から12月31日までの間に支払った医療費であること（未払いの医療費は、現実に支払った年の医療費控除の対象となります。）。\n\n#### 医療費控除の対象となる金額\n\n医療費控除の金額は、次の式で計算した金額（最高で200万円）です。\n\n（実際に支払った医療費の合計額-（1）の金額）-（2）の金額\n\n（1）保険金などで補てんされる金額\n\n（例） 生命保険契約などで支給される入院費給付金や健康保険などで支給される高額療養費・家族療養費・出産育児一時金など\n\n（注）保険金などで補てんされる金額は、その給付の目的となった医療費の金額を限度として差し引きますので、引ききれない金額が生じた場合であっても他の医療費からは差し引きません。\n\n（2）10万円\n\n（注）その年の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)が200万円未満の人は、[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)の5パーセントの金額\n\n#### セルフメディケーション税制（医療費控除の特例）\n\n健康の保持増進および疾病の予防への取組として一定の健康診断や予防接種などを行っている方が、自己または自己と生計を一にする配偶者やその他の親族の特定一般用医薬品等購入費を支払った場合には、通常の医療費控除との選択により、その年中の特定一般用医薬品等購入費の合計額（保険金等により補填される部分の金額を除きます。）のうち、12,000円を超える部分の金額（88,000円を限度）を控除額とするセルフメディケーション税制（特定一般用医薬品等購入費を支払った場合の医療費控除の特例）の適用を受けることができます。\n\nなお、セルフメディケーション税制（特定一般用医薬品等購入費を支払った場合の医療費控除の特例）の対象となる特定一般用医薬品等の購入費については、[コード1132「セルフメディケーション税制の対象となる特定一般用医薬品等購入費」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1132.htm)をご参照してください。\n\n### 手続き\n\n#### 申告等の方法\n\n医療費控除に関する事項その他の必要事項を記載等した確定申告書を提出してください。\n\n#### 申告先等\n\n所轄税務署\n\n### 提出書類等\n\n医療費の領収書から「[医療費控除の明細書](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a31)」または「[セルフメディケーション税制の明細書](https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/1557_2.htm#a31)」を作成（注1）し、確定申告書に添付してください。\n\n医療保険者から交付を受けた医療費通知（注2）がある場合は、医療費通知を添付することによって医療費控除の明細書の記載を簡略化することができます。\n\nなお、医療費控除の明細書の記載内容を確認するため、確定申告期限等から5年を経過する日までの間、医療費の領収書（医療費通知を添付したものを除きます。）の提示または提出を求める場合があります。\n\nおって、セルフメディケーション税制の提出書類等については、コード1129「[特定一般用医薬品等購入費を支払ったとき（医療費控除の特例）【セルフメディケーション税制】](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1129.htm)」をご参照ください。\n\n（注1）経過措置として、平成29年分から令和元年分までの確定申告については、明細書を確定申告書に添付せず、領収書を確定申告書に添付するか、確定申告書を提出する際に提示することによることもできます。\n\n（注2）医療費通知とは、医療保険者が発行する医療費の額等を通知する書類で、次のすべての事項の記載があるもの（後期高齢者医療広域連合から発行された書類の場合は3を除く。）ならびにインターネットを使用して医療保険者から通知を受けた医療費通知情報でその医療保険者の電子署名およびその電子署名に係る電子証明書が付されたものをいいます。\n\n1　被保険者等の氏名　2　療養を受けた年月　3　療養を受けた者　4　療養を受けた病院、診療所、薬局等の名称　5　被保険者等が支払った医療費の額　6　保険者等の名称\n\nなお、令和4年1月1日以後に令和3年分以後の確定申告書を提出する場合は、上記の医療保険者が発行する医療費の額等を通知する書類に代えて、次のいずれかの書類の添付ができます。\n\nイ　社会保険診療報酬支払基金および国民健康保険団体連合会の医療保険者等の医療費の額を通知する書類に記載すべき事項が記載された書類またはその書類に記録した電子証明書等に係る[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)（電子証明等に記録された情報の内容と、その内容が記録された二次元コードが付された出力書面をいいます。ロにおいて同じです。）\n\nロ　医療保険者等の医療費の額を通知する書類に記載すべき事項を記録した電子証明書等に係る[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)\n\n### 注意事項\n\n給与所得のある方について、平成31年4月1日以後、給与所得の源泉徴収票は、確定申告書への添付または確定申告書を提出する際の提示が不要となりました。ただし、確定申告書を作成する際には引き続き給与所得の源泉徴収票が必要となりますので、税務署等へお越しになる際には忘れずにお持ちください。","order":39},{"id":"no1129","cat":"shotoku-kojo","sub":"","kind":"entry","term":"特定一般用医薬品等購入費を支払ったとき（医療費控除の特例）【セルフメディケーション税制】","yomi":"とくていいっぱんよういやくひんとうこうにゅうひをしはらったときいりょうひこうじょのとくれいせるふめでぃけーしょんぜいせい","code":"1129","title":"No.1129 特定一般用医薬品等購入費を支払ったとき（医療費控除の特例）【セルフメディケーション税制】","summary":"健康の保持増進および疾病の予防への取組として一定の取組を行っている方が、自己または自己と生計を一にする配偶者その他の親族のために特定一般用医薬品等購入費を支払った場合には、一定の金額の所得控除（医療費控除の特例）を受けることができます。","basis":"所法73、120、所令262、措法41の17、措令26の27の3、措規19の10の2の2、平28厚生労働省告示第178号、第181号、平成29年改正法附則58、令和3年改正措法附則38","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1129.htm","md":"### 概要\n\n健康の保持増進および疾病の予防への取組として一定の取組を行っている方が、自己または自己と生計を一にする配偶者その他の親族のために特定一般用医薬品等購入費を支払った場合には、一定の金額の所得控除（医療費控除の特例）を受けることができます。\n\n#### 特例内容\n\nセルフメディケーション税制は医療費控除の特例であり、[通常の医療費控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm)との選択適用となります。したがって、この特例の適用を受ける場合は、[通常の医療費控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm)を併せて受けることはできません。\n\nまた、これらのいずれかの適用を選択した後、更正の請求や修正申告によりこの選択を変更することはできません。\n\n### 対象者または対象物\n\n#### 適用を受けられる方\n\nセルフメディケーション税制の適用を受けようとする年分に健康の保持増進および疾病の予防への取組として「一定の取組」を行っている[居住者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2875.htm)が対象となります。具体的には、次の取組が、「一定の取組」に該当します。\n\n1　保険者（健康保険組合、市区町村国保等）が実施する健康診査＜人間ドック、各種健（検）診等＞\n\n2　市区町村が健康増進事業として行う健康診査＜生活保護受給者等を対象とする健康診査＞\n\n3　予防接種＜定期予防接種、インフルエンザワクチンの予防接種＞\n\n4　勤務先で実施する定期健康診断＜事業主健診＞\n\n5　特定健康診査（いわゆるメタボ健診）、特定保健指導\n\n6　市区町村が健康増進事業として実施するがん検診\n\nなお、申告される方が「一定の取組」を行っている必要があります（申告される方と生計を一にする配偶者その他の親族の方が「一定の取組」を行っている必要はありません。）。\n\n#### 特定一般用医薬品等購入費の範囲\n\n特定一般用医薬品等購入費とは、医師によって処方される医薬品（医療用医薬品）から、ドラッグストアで購入できるOTC医薬品に転用された医薬品（スイッチOTC医薬品）等の購入費をいいます。\n\nセルフメディケーション税制の対象となる商品には、購入の際の領収書等にセルフメディケーション税制の対象商品である旨が表示されています。スイッチOTC医薬品等の具体的な品目一覧は、[厚生労働省ホームページ](https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000124853.html)に掲載の「対象品目一覧」をご覧ください。\n\n一部の対象医薬品については、その医薬品のパッケージにセルフメディケーション税制の対象である旨を示す識別マークが掲載されています。\n\n＜セルフメディケーション税制　共通識別マーク＞\n\nセルフメディケーション税制（特定一般用医薬品等購入費を支払った場合の医療費控除の特例）の対象となる特定一般用医薬品等の購入費については、[コード1132「セルフメディケーション税制の対象となる特定一般用医薬品等購入費」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1132.htm)をご参照してください。\n\n### 計算方法・計算式\n\nセルフメディケーション税制による医療費控除額は、実際に支払った特定一般用医薬品等購入費の合計額（保険金などで補填される部分を除きます。）から12,000円を差し引いた金額（最高88,000円）です。\n\nなお、一定の取組（人間ドックなど）に要した費用は、セルフメディケーション税制による医療費控除の対象となりません。\n\n### 手続き\n\n#### 申告等の方法\n\n令和3年分以後のセルフメディケーション税制の適用に関する事項を記載した確定申告書を令和4年1月1日以後に提出する場合は、「提出書類等」の1の書類を確定申告書に添付してください。\n\nまた、令和2年分以前のセルフメディケーション税制の適用に関する事項を記載した確定申告書を提出するに当たっては、「提出書類等」の1の書類に加え、2の書類を確定申告書に添付するか、または確定申告書の提出の際に提示してください。\n\n#### 申告先等\n\n所轄税務署\n\n### 提出書類等\n\n確定申告書に次の書類を添えて提出してください。\n\n1　セルフメディケーション税制の明細書（注1、2）\n\n2　セルフメディケーション税制の適用を受ける方がその適用を受けようとする年分に一定の取組を行ったことを明らかにする書類で、次の記載があるものに限ります。（注3）\n\n（1）氏名\n\n（2）取組を行った年\n\n（3）取組に係る事業を行った保険者、事業者もしくは市区町村の名称または取組に係る診察を行った医療機関の名称もしくは医師の氏名\n\n書類の具体例は、[コード1134「取組を行ったことを明らかにする書類の具体例」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1134.htm)を参照してください。\n\n（注1）上記1は、記入内容を確認するため、確定申告期限等から5年を経過する日までの間、税務署から特定一般用医薬品等購入費の領収書の提示または提出を求める場合があります。\n\n（注2）上記1は、経過措置として、平成29年分から令和元年分までの確定申告については、明細書を確定申告書に添付せず、領収書を確定申告書に添付するか、確定申告書を提出する際に提示することによることもできます。\n\n（注3）上記2は、令和3年分以後のセルフメディケーション税制の適用に関する事項を記載した確定申告書を令和4年1月1日以後に提出する場合に、確定申告書への添付または提示は不要ですが、確定申告期限等から5年を経過する日までの間、税務署から提示または提出を求める場合があります。","order":40},{"id":"no1130","cat":"shotoku-kojo","sub":"","kind":"entry","term":"社会保険料控除","yomi":"しゃかいほけんりょうこうじょ","code":"1130","title":"No.1130 社会保険料控除","summary":"納税者が自己または自己と生計を一にする配偶者やその他の親族の負担すべき社会保険料を支払った場合には、その支払った金額について所得控除を受けることができます。これを社会保険料控除といいます。","basis":"所法74、120、190、196、所令208、262、319、所規47の2、措法41の7、実特法5の2の2、実特令4の3、実特規6の2、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1130.htm","md":"### 概要\n\n納税者が自己または自己と生計を一にする配偶者やその他の親族の負担すべき社会保険料を支払った場合には、その支払った金額について所得控除を受けることができます。これを社会保険料控除といいます。\n\n控除できる金額は、その年に実際に支払った金額または給与や公的年金から差し引かれた金額の全額です。\n\n#### 社会保険料の範囲\n\n社会保険料控除の対象となる社会保険料は次のとおりです。\n\n1　健康保険、国民年金、厚生年金保険および船員保険の保険料で被保険者として負担するもの\n\n2　国民健康保険の保険料または国民健康保険税\n\n3　高齢者の医療の確保に関する法律の規定による保険料\n\n4　介護保険法の規定による介護保険料\n\n5　雇用保険の被保険者として負担する労働保険料\n\n6　国民年金基金の加入員として負担する掛金\n\n7　独立行政法人農業者年金基金法の規定により被保険者として負担する農業者年金の保険料\n\n8　存続厚生年金基金の加入員として負担する掛金\n\n9　国家公務員共済組合法、地方公務員等共済組合法、私立学校教職員共済法、恩給法等の規定による掛金または納金等\n\n10　労働者災害補償保険の特別加入者の規定により負担する保険料\n\n11　地方公共団体の職員が条例の規定によって組織する互助会の行う職員の相互扶助に関する制度で、一定の要件を備えているものとして所轄税務署長の承認を受けた制度に基づきその職員が負担する掛金\n\n12　国家公務員共済組合法等の一部を改正する法律の公庫等の復帰希望職員に関する経過措置の規定による掛金\n\n13　健康保険法附則または船員保険法附則の規定により被保険者が承認法人等に支払う負担金\n\n14　租税条約の規定により、当該租税条約の相手国の社会保障制度に対して支払われるもの（我が国の社会保障制度に対して支払われる当該租税条約に規定する強制保険料と同様の方法ならびに類似の条件および制限に従って取り扱うこととされているものに限ります。）のうち一定額\n\n（注）社会保険料控除の適用を受ける場合には、その適用を受けようとする年分の確定申告書に一定の事項を記載した届出書および相手国の社会保障制度に係る権限のある機関が発行した証明書（以下、「適用証明書」といいます。）を添付するとともに、保険料の金額を証する書類を添付または確定申告書の提出の際に提示する必要があります（年末調整で適用することはできません。）。\n\nなお、確定申告書を提出しない者であってもこの適用を受けようとする場合には、適用を受けようとする年の翌年3月15日までに一定の事項を記載した届出書、適用証明書および保険料の金額を証する書類を所轄税務署長に提出する必要があります。\n\n詳細については、[「条約相手国の社会保障制度の下で支払った保険料に関する租税条約実施特例法の改正について（情報）」](https://www.nta.go.jp/law/joho-zeikaishaku/shotoku/shinkoku/070719/index.htm)をご覧ください。\n\n#### 社会保険料控除の金額\n\n控除できる金額は、その年に実際に支払った金額または給与や公的年金等から差し引かれた金額の全額です。\n\n### 手続き\n\n#### 申告等の方法\n\n国民年金の保険料および国民年金基金の掛金に係る社会保険料控除の適用については、その保険料または掛金の金額を証する書類もしくは[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)（電子証明書等に記録された情報の内容と、その内容が記録された二次元バーコードが付された出力書面をいいます。）を、確定申告書または年末調整の際に提出する「給与所得者の保険料控除申告書」に添付するか、これらの申告書を提出する際に提示する必要があります。\n\nなお、令和8年分以後の所得税に係る確定申告書を令和9年1月1日以後に提出するときは、国民年金の保険料または国民年金基金の掛金の金額を証する書類もしくは電磁的記録印刷書面の添付または提示に代えて、一定の事項の記載がある明細書を確定申告書に添付することができます。\n\ne-Tax（電子申告）で確定申告する場合については、[コードNo.1904「給与所得者と電子申告」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1904.htm)をご覧ください。\n\n#### 申告先等\n\n所轄税務署または勤務先","order":41},{"id":"no1135","cat":"shotoku-kojo","sub":"","kind":"entry","term":"小規模企業共済等掛金控除","yomi":"しょうきぼきぎょうきょうさいとうかけきんこうじょ","code":"1135","title":"No.1135 小規模企業共済等掛金控除","summary":"納税者が小規模企業共済法に規定された共済契約に基づく掛金等を支払った場合には、その支払った金額について所得控除が受けられます。これを小規模企業共済等掛金控除といいます。","basis":"所法75、120、196、所令208の2、262、319、所規47の2、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1135.htm","md":"### 概要\n\n納税者が小規模企業共済法に規定された共済契約に基づく掛金等を支払った場合には、その支払った金額について所得控除が受けられます。これを小規模企業共済等掛金控除といいます。\n\n#### 小規模企業共済等掛金控除の対象となる掛金\n\n控除できる掛金は次の3つです。\n\n（1）小規模企業共済法の規定によって独立行政法人中小企業基盤整備機構と結んだ共済契約の掛金（ただし、旧第二種共済契約の掛金はこの控除ではなく[生命保険料控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1140.htm)の対象となります。）\n\n（2）確定拠出年金法に規定する企業型年金加入者掛金または個人型年金加入者掛金\n\n（3）地方公共団体が実施する、いわゆる心身障害者扶養共済制度の掛金（この共済制度とは、地方公共団体の条例で精神または身体に障害がある者を扶養する者を加入者として、その加入者が地方公共団体に掛金を納付し、当該地方公共団体が心身障害者の扶養のための給付金を定期に支給することを定めている制度のうち一定の要件を備えているものをいいます。）\n\n#### 小規模企業共済等掛金控除の金額\n\n控除できる金額は、その年に支払った掛金の全額です。\n\n### 手続き\n\n#### 申告等の方法\n\nこの控除を受ける場合は、確定申告書の小規模企業共済等掛金控除の欄に記入するほか、支払った掛金の証明書または[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)（電子証明書等に記録された情報の内容と、その内容が記録された二次元バーコードが付された出力書面をいいます。）を確定申告書または年末調整の際に提出する「給与所得者の保険料控除申告書」に添付するか、これらの申告書を提出する際に提示する必要があります。\n\nなお、令和8年分以後の所得税に係る確定申告書を令和9年1月1日以後に提出するときは、支払った掛金の証明書または電磁的記録印刷書面の添付または提示に代えて、一定の事項の記載がある明細書を確定申告書に添付することができます。\n\ne-Tax（電子申告）で確定申告する場合については、[コードNo.1904「給与所得者と電子申告」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1904.htm)をご覧ください。\n\n#### 申告先等\n\n所轄税務署または勤務先","order":42},{"id":"no1140","cat":"shotoku-kojo","sub":"","kind":"entry","term":"生命保険料控除","yomi":"せいめいほけんりょうこうじょ","code":"1140","title":"No.1140 生命保険料控除","summary":"納税者が生命保険料、介護医療保険料および個人年金保険料を支払った場合には、一定の金額の所得控除を受けることができます。これを生命保険料控除といいます。","basis":"所法76、120、所令209、262、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1140.htm","md":"### 概要\n\n納税者が生命保険料、介護医療保険料および個人年金保険料を支払った場合には、一定の金額の所得控除を受けることができます。これを生命保険料控除といいます。\n\n※　個人年金保険料については、[コード1141「生命保険料控除の対象となる保険契約等」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1141.htm)を参照してください。\n\n平成24年1月1日以後に締結した保険契約等に係る保険料と平成23年12月31日以前に締結した保険契約等に係る保険料では、生命保険料控除の取扱いが異なります。\n\nなお、保険期間が5年未満の生命保険などの中には、控除の対象とならないものもありますのでご注意ください。\n\n#### 生命保険料控除の金額\n\n以下の計算により算出した各控除額の合計額が生命保険料控除額となります。\nなお、この合計額が120,000円を超える場合には、生命保険料控除額は120,000円となります。\n\n##### 新契約（平成24年1月1日以後に締結した保険契約等）に基づく場合の控除額\n\n新契約に基づく新生命保険料、介護医療保険料、新個人年金保険料の控除額は、それぞれ次の表の計算式に当てはめて計算した金額です。\n\n| 年間の支払保険料等 | 控除額 |\n|---|---|\n| 20,000円以下 | 支払保険料等の全額 |\n| 20,000円超 40,000円以下 | 支払保険料等×1/2+10,000円 |\n| 40,000円超 80,000円以下 | 支払保険料等×1/4+20,000円 |\n| 80,000円超 | 一律40,000円 |\n\n令和8年分以降の申告の場合、新契約に基づく新生命保険料の控除額について、23歳未満の扶養親族を有する場合の控除額は次の表の計算式に当てはめて計算した金額です。\n\n| 年間の新生命保険料 | 控除額 |\n|---|---|\n| 30,000円以下 | 新生命保険料の全額 |\n| 30,000円超 60,000円以下 | 新生命保険料×1/2+15,000円 |\n| 60,000円超 120,000円以下 | 新生命保険料×1/4+30,000円 |\n| 120,000円超 | 一律60,000円 |\n\n（注1）支払保険料等とは、その年に支払った金額から、その年に受けた剰余金や割戻金を差し引いた残りの金額をいいます。\n\n（注2）新契約については、主契約または特約の保障内容に応じ、その保険契約等に係る支払保険料等が各保険料控除に適用されます。\n\n（注3）異なる複数の保障内容が一の契約で締結されている保険契約等は、その保険契約等の主たる保障内容に応じて保険料控除を適用します。\n\n（注4）その年に受けた剰余金や割戻金がある場合には、主契約と特約のそれぞれの支払保険料等の金額の比に応じて剰余金の分配等の金額を按分し、それぞれの保険料等の金額から差し引きます。\n\n##### 旧契約（平成23年12月31日以前に締結した保険契約等）に基づく場合の控除額\n\n旧契約に基づく旧生命保険料と旧個人年金保険料の控除額は、それぞれ次の表の計算式に当てはめて計算した金額です。\n\n| 年間の支払保険料等 | 控除額 |\n|---|---|\n| 25,000円以下 | 支払保険料等の全額 |\n| 25,000円超 50,000円以下 | 支払保険料等×1/2+12,500円 |\n| 50,000円超 100,000円以下 | 支払保険料等×1/4+25,000円 |\n| 100,000円超 | 一律50,000円 |\n\n（注1）旧契約に基づく「いわゆる第三分野とされる保険（医療保険や介護保険）の保険料」も、旧生命保険料となります。\n\n（注2）支払保険料等とは、その年に支払った金額から、その年に受けた剰余金や割戻金を差し引いた残りの金額をいいます。\n\n##### 新契約と旧契約の双方に加入している場合の控除額\n\n1. 一般の生命保険料控除の控除額\n\n・旧生命保険料控除の年間支払保険料等の金額が60,000円を超える場合\n\n旧生命保険料控除の年間支払保険料等の金額について 上記の「旧契約（平成23年12月31日以前に締結した保険契約等）に基づく場合の控除額」で計算した金額（最高50,000円（令和8年以降、23歳未満の扶養親族を有する新生命保険料を支払った場合は最高60,000円））\n\n・旧生命保険料控除の年間支払保険料等の金額が60,000円以下の場合\n\n新生命保険料控除の年間支払保険料等の金額について、上記の「新契約（平成24年1月1日以後に締結した保険契約等）に基づく場合の控除額」で計算した金額と旧生命保険料控除の年間支払保険料等の金額について、「旧契約（平成23年12月31日以前に締結した保険契約等）に基づく場合の控除額」で計算した金額の合計額（最高40,000円（令和8年以降、23歳未満の扶養親族を有する新生命保険料を支払った場合は最高60,000円））\n\n2. 個人年金保険料控除の控除額\n\n・旧個人年金保険料控除の年間支払保険料等の金額が60,000円を超える場合\n\n旧個人年金保険料控除の年間支払保険料等の金額について（2）で計算した金額（最高50,000円）\n\n・旧個人年金保険料控除の年間支払保険料等の金額が60,000円以下の場合\n\n新個人年金保険料控除の年間支払保険料等の金額について、上記の「新契約（平成24年1月1日以後に締結した保険契約等）に基づく場合の控除額」で計算した金額と旧個人年金保険料控除の年間支払保険料等の金額について、「旧契約（平成23年12月31日以前に締結した保険契約等）に基づく場合の控除額」で計算した金額の合計額（最高40,000円）。\n\n### 対象者または対象物\n\n生命保険料、介護医療保険料または個人年金保険料を支払った方\n\n### 手続き\n\n#### 申告等の方法\n\n生命保険料控除を受ける場合には、確定申告書の生命保険料控除の欄に記入するほか、支払金額や控除を受けられることを証明する書類または[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)（電子証明書等に記録された情報の内容と、その内容が記録された二次元コードが付された出力書面をいいます。）を確定申告書に添付するかまたは確定申告書を提出する際に提示してください。ただし、平成23年12月31日以前に締結した保険契約（旧契約）等で年間保険料が9,000円以下のものと年末調整の際に控除を受けたものは、その必要がありません。\n\n#### 申告先等\n\n所轄税務署または勤務先","order":43},{"id":"no1145","cat":"shotoku-kojo","sub":"","kind":"entry","term":"地震保険料控除","yomi":"じしんほけんりょうこうじょ","code":"1145","title":"No.1145 地震保険料控除","summary":"納税者が特定の損害保険契約等に係る地震等損害部分の保険料または掛金を支払った場合には、一定の金額の所得控除を受けることができます。これを地震保険料控除といいます。","basis":"所法77、120、所令262、所規47の2、平18改正法附則10、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1145.htm","md":"### 概要\n\n納税者が特定の損害保険契約等に係る地震等損害部分の保険料または掛金を支払った場合には、一定の金額の所得控除を受けることができます。これを地震保険料控除といいます。\n\n#### 旧長期損害保険に係る経過措置\n\n平成18年の税制改正で、平成19年分から損害保険料控除が廃止されました。\n\nしかし、経過措置として以下の要件を満たす一定の長期損害保険契約等に係る損害保険料については、地震保険料控除の対象とすることができます。\n\n（1）平成18年12月31日までに締結した契約（保険期間または共済期間の始期が平成19年1月1日以後のものは除く）\n\n（2）満期返戻金等のあるもので保険期間または共済期間が10年以上の契約\n\n（3）平成19年1月1日以後にその損害保険契約等の変更をしていないもの\n\n#### 地震保険料控除の金額\n\nその年に支払った保険料の金額に応じて、次により計算した金額が控除額となります。\n\n| 区分 | 年間の支払保険料の合計 | 控除額 |\n|---|---|---|\n| (1)地震保険料 | 50,000円以下 | 支払金額の全額 |\n| (1)地震保険料 | 50,000円超 | 一律50,000円 |\n| (2)旧長期損害保険料 | 10,000円以下 | 支払金額の全額 |\n| (2)旧長期損害保険料 | 10,000円超<br>20,000円以下 | 支払金額×1/2＋5,000円 |\n| (2)旧長期損害保険料 | 20,000円超 | 15,000円 |\n| (1)・(2)両方がある場合 | － | (1)、(2)それぞれの方法で計算した金額の合計額（最高50,000円） |\n\n（注）一の損害保険契約等または一の長期損害保険契約等に基づき、地震保険料および旧長期損害保険料の両方を支払っている場合には、納税者の選択により地震保険料または旧長期損害保険料のいずれか一方の控除を受けることとなります。\n\n### 対象者または対象物\n\n特定の損害保険契約等に係る地震等損害部分の保険料または掛金を支払った方\n\n### 手続き\n\n#### 申告等の方法\n\n地震保険料控除を受ける場合には、確定申告書の地震保険料控除の欄に記入するほか、支払金額や控除を受けられることを証明する書類または、[電磁的記録印刷書面](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo.htm)（電子証明等に記録された情報の内容と、その内容が記録された二次元コードが付された出力書面をいいます。）を確定申告書に添付するか、または申告の際に提示してください。\n\nただし、年末調整で控除された場合はその必要がありません。\n\n#### 申告先等\n\n所轄税務署または勤務先","order":44},{"id":"no1150","cat":"shotoku-kojo","sub":"","kind":"entry","term":"一定の寄附金を支払ったとき(寄附金控除)","yomi":"いっていのきふきんをしはらったとききふきんこうじょ","code":"1150","title":"No.1150 一定の寄附金を支払ったとき(寄附金控除)","summary":"納税者が国や地方公共団体、特定公益増進法人などに対し、「特定寄附金」を支出した場合には、所得控除を受けることができます。これを寄附金控除といいます。","basis":"所法78、120、所令217、217の2、262、所規47の2、措法41の18、41の18の2、41の18の3、41の18の4、措令26の27の3、26の28、26の28の2、26の28の3、措規19の10の3、19の10の4、19の10の5、19の11、平成29年国税庁告示10号","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1150.htm","md":"### 概要\n\n納税者が国や地方公共団体、特定公益増進法人などに対し、「特定寄附金」を支出した場合には、所得控除を受けることができます。これを寄附金控除といいます。\n\nなお、政治活動に関する寄附金、認定NPO法人等に対する寄附金または公益社団法人等に対する寄附金のうち一定のものについては、所得控除に代えて、税額控除を選択することができます。詳しくは、[コード1260「政党等寄附金特別控除制度」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1260.htm)、[コード1263「認定NPO法人に寄附をしたとき」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1263.htm)または、[コード1266「公益社団法人等に寄附をしたとき」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1266.htm)を参照してください。\n\n#### 特定寄附金の範囲\n\n特定寄附金とは、次のいずれかに当てはまるものをいいます。\n\nただし、学校の入学に関してするもの、寄附をした人に特別の利益がおよぶと認められるものおよび政治資金規正法に違反するものなどは、特定寄附金に該当しません。\n\n（1）国、地方公共団体に対する寄附金（その寄附をした人がその寄附によって設けられた設備を専属的に利用することその他特別の利益がその寄附をした人におよぶと認められるものを除きます。）\n\n（2）公益社団法人、公益財団法人その他公益を目的とする事業を行う法人または団体に対する寄附金のうち、次に掲げる要件を満たすと認められるものとして、財務大臣が指定したもの\n\nイ 広く一般に募集されること\n\nロ 教育または科学の振興、文化の向上、社会福祉への貢献その他公益の増進に寄与するための支出で緊急を要するものに充てられることが確実であること\n\n（3）公共法人等のうち、教育または科学の振興、文化の向上、社会福祉への貢献その他公益の増進に著しく寄与するものと認められた次に掲げる特定公益増進法人に対する寄附金で、その法人の主たる目的である業務に関連するもの（上記（1）および（2）に該当するものを除きます。）\n\nイ 独立行政法人\n\nロ 地方独立行政法人のうち、一定の業務を主たる目的とするもの\n\nハ 自動車安全運転センター、日本司法支援センター、日本私立学校振興・共済事業団、日本赤十字社および福島国際研究教育機構\n\nニ 公益社団法人および公益財団法人\n\nホ 私立学校法第3条に規定する学校法人で学校の設置もしくは学校および専修学校もしくは各種学校の設置を主たる目的とするものまたは私立学校法第64条第4項の規定により設立された法人で専修学校もしくは各種学校の設置を主たる目的とするもの\n\nヘ 社会福祉法人\n\nト 更生保護法人\n\n（4）一定の公益信託の信託財産とするために支出したその公益信託に係る信託事務に関連する寄附金\n\n（5）個人が支出した次の団体等に対する政治活動に関する寄附金のうち、一定の要件に該当するもの（寄附をした人に特別の利益がおよぶと認められるものおよび政治資金規正法に違反するものを除きます。）\n\nイ 政党（支部を含みます。）\n\nロ 政治資金団体\n\nハ その他の政治団体で一定のもの\n\nニ　特定の公職の候補者\n\n（6）特定非営利活動法人のうち一定の要件を満たすものとして認められたものなど（いわゆる認定NPO法人等）に対する寄附金で、特定非営利活動に係る事業に関するもの\n\n（注1）「認定NPO法人等」とは、所轄庁の認定を受けた認定NPO法人（特例認定を受けた特例認定NPO法人を含みます。）をいいます。\n認定NPO法人等の一覧は、内閣府ホームページ（[https://www.npo-homepage.go.jp](https://www.npo-homepage.go.jp/)）をご覧ください。\n\n（注2）認定の有効期間内に支出する寄附金について適用されます。\n\n（7）特定新規中小会社により発行される特定新規株式を払込みにより取得した場合の特定新規株式の取得に要した金額のうち一定の金額（800万円を限度（令和2年12月31日までは1,000万円）とします。）\n\n※　[コード1544「エンジェル税制の概要等」](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1544.htm)の「特定新規中小会社が発行した株式を取得した場合の課税の特例（寄附金控除）」を参照してください。\n\n（注）特定新規株式は、次の特定新規中小会社ごとに発行される株式をいいます。\n\n| 特定新規中小会社 | 特定新規株式 |\n|---|---|\n| 中小企業等経営強化法第6条に規定する特定新規中小企業者に該当する株式会社（その設立の日以後の期間が１年未満のものその他の一定のものに限ります。） | その株式会社により発行される株式 |\n| 内国法人のうちその設立の日以後5年を経過していない株式会社（租税特別措置法第37条の13第1項第2号に規定する中小企業者に該当する会社であることその他の一定の要件を満たすものに限ります。） | その株式会社により発行される株式で次のイまたはロに掲げるもの<br>イ　投資事業有限責任組合契約に関する法律第2条第2項に規定する投資事業有限責任組合（一定のものに限ります。）に係る同法第3条第1項に規定する投資事業有限責任組合契約に従って取得をされるもの<br>ロ　金融商品取引法第29条の4の2第9項に規定する第一種少額電子募集取扱業務を行う者（一定のものに限ります。）が行う同項に規定する電子募集取扱業務により取得をされるもの |\n| 租税特別措置法第37条の13第1項第3号に掲げる指定会社 | その指定会社により発行される株式 |\n| 国家戦略特別区域法第27条の5に規定する株式会社 | その株式会社により発行される株式で平成27年7月15日から令和8年3月31日までの間に発行されるもの |\n| 内国法人のうち地域再生法第16条に規定する事業を行う同条に規定する株式会社 | その株式会社により発行される株式で平成30年6月1日から令和8年3月31日までの間に発行されるもの |\n\n### 対象者または対象物\n\n国や地方公共団体、特定公益増進法人などに対し、寄附を行った方\n\n### 計算方法・計算式\n\n寄附金控除の金額の計算は次のとおりです。\n\n次の（1）または（2）のいずれか低い金額 - 2000円 ＝ 寄附金控除額\n\n（1） その年に支出した特定寄附金の額の合計額\n\n（2） その年の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)の40パーセント相当額\n\n### 手続き\n\n#### 申告等の方法\n\n寄附金控除を受けるためには、寄附金控除に関する事項を記載した確定申告書に次の書類（電磁的記録印刷書面を含みます。）を添付するか、確定申告書を提出する際に提示する必要があります。\n\n（1） 上記特定寄附金の範囲(1)から(4)、(6)及び(7)に共通で必要な書類\n\n寄附した団体などから交付を受けた寄附金の受領証（領収書）\n\n（注）　令和3年分の確定申告から、[ふるさと納税](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1155.htm)の場合は、「寄附金の受領証」に代えて、[国税庁長官が指定した特定事業者](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo/kifukin/tokutei.htm)の発行する年間寄附金額が記載された「[寄附金控除に関する証明書](https://www.nta.go.jp/taxes/shiraberu/shinkoku/kakutei/koujyo/kifukin.htm)」を添付することができます。\n\n（2） 上記特定寄附金の範囲に応じて必要な種類\n\nイ 上記特定寄附金の範囲（3）ロおよびホについては、特定公益増進法人である旨の証明書の写し\n\nロ 上記特定寄附金の範囲（4）については、特定公益信託である旨の認定書の写し\n\nハ 上記特定寄附金の範囲（5）については、選挙管理委員会等の確認印のある「寄附金（税額）控除のための書類」\n\n（注） 確定申告書を提出するときまでに、「寄附金（税額）控除のための書類」の交付が間に合わない場合は、その書類に代えて寄附金の受領証の写しを添付して確定申告をし、後日、その書類が交付され次第、速やかに税務署に提出してください。\n\nニ 上記特定寄附金の範囲（7）については、（1）の受領証などの代わりに、以下の書類を添付する必要があります\n\n（イ） [特定新規中小会社が発行した株式の取得に要した金額の寄附金控除額の計算明細書](https://www.nta.go.jp/taxes/shiraberu/shinkoku/yoshiki/07/pdf/060.pdf)\n\n（ロ） [特定中小会社が発行した株式の取得に要した金額等の控除の明細書](https://www.nta.go.jp/taxes/shiraberu/shinkoku/syotoku/pdf/r07_joto_20-1.pdf)\n\n（ハ） 都道府県知事等が発行した特定新規中小会社に該当するものであること等の一定の事実の確認書\n\n（ニ） 特定新規中小会社が発行した個人投資家が一定の同族株主等に該当しない旨の確認書\n\n（ホ） 特定新規中小会社から交付を受けた株式異動状況明細書\n\n（ヘ） 投資契約書の写し\n\n#### 申告先等\n\n所轄税務署","order":45},{"id":"no1160","cat":"shotoku-kojo","sub":"","kind":"entry","term":"障害者控除","yomi":"しょうがいしゃこうじょ","code":"1160","title":"No.1160 障害者控除","summary":"納税者自身、同一生計配偶者または扶養親族が所得税法上の障害者に当てはまる場合には、一定の金額の所得控除を受けることができます。これを障害者控除といいます。","basis":"所法2、79、所令10、所基通2-39","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1160.htm","md":"### 概要\n\n納税者自身、[同一生計配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word3)または[扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word7)が所得税法上の障害者に当てはまる場合には、一定の金額の所得控除を受けることができます。これを障害者控除といいます。\n\nなお、障害者控除は、扶養控除の適用がない16歳未満の扶養親族を有する場合においても適用されます。\n\n#### 障害者控除の金額\n\n| 区分 | 控除額 |\n|---|---|\n| 障害者 | 27万円 |\n| 特別障害者 | 40万円 |\n| 同居特別障害者（注） | 75万円 |\n\n（注）同居特別障害者とは、特別障害者である同一生計配偶者または扶養親族のうち、納税者自身、配偶者、その納税者と生計を一にするその他の親族のいずれかとの同居を常況としている人です。\n\n### 対象者または対象物\n\n#### 障害者控除の対象となる人の範囲\n\n障害者控除の対象となるのは、次のいずれかに当てはまる人です。\n\n（1）精神上の障害により事理を弁識する能力を欠く常況にある人\n\nこの人は、特別障害者になります。\n\n（2）児童相談所、知的障害者更生相談所、精神保健福祉センター、精神保健指定医の判定により、知的障害者と判定された人\n\nこのうち重度の知的障害者と判定された人は、特別障害者になります。\n\n（3）精神保健及び精神障害者福祉に関する法律の規定により精神障害者保健福祉手帳の交付を受けている人\n\nこのうち障害等級が1級と記載されている人は、特別障害者になります。\n\n（4）身体障害者福祉法の規定により交付を受けた身体障害者手帳に、身体上の障害がある人として記載されている人\n\nこのうち障害の程度が1級または2級と記載されている人は、特別障害者になります。\n\n（5）精神または身体に障害のある年齢が満65歳以上の人で、その障害の程度が（1）、（2）または（4）に掲げる人に準ずるものとして市町村長等や福祉事務所長の認定を受けている人\n\nこのうち特別障害者に準ずるものとして市町村長、特別区長や福祉事務所長の認定を受けている人は特別障害者になります。\n\n（6）戦傷病者特別援護法の規定により戦傷病者手帳の交付を受けている人\n\nこのうち障害の程度が恩給法に定める特別項症から第3項症までの人は、特別障害者となります。\n\n（7）原子爆弾被爆者に対する援護に関する法律の規定により厚生労働大臣の認定を受けている人\n\nこの人は、特別障害者となります。\n\n（8）その年の12月31日の現況で引き続き6か月以上にわたって身体の障害により寝たきりの状態で、複雑な介護を必要とする（介護を受けなければ自ら排便等をすることができない程度の状態にあると認められる）人\n\nこの人は、特別障害者となります。","order":46},{"id":"no1170","cat":"shotoku-kojo","sub":"","kind":"entry","term":"寡婦控除","yomi":"かふこうじょ","code":"1170","title":"No.1170 寡婦控除","summary":"納税者自身が寡婦であるときは、一定の金額の所得控除を受けることができます。これを寡婦控除といいます。","basis":"所法2、80、85、所令11、旧所法2、旧所法81、旧措法41の17、所基通2-40、2-41","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1170.htm","md":"### 概要\n\n納税者自身が寡婦であるときは、一定の金額の所得控除を受けることができます。これを寡婦控除といいます。\n\n#### 寡婦控除の金額（令和2年分以後）\n\n| 区分 | 控除額 |\n|---|---|\n| 寡婦控除 | 27万円 |\n\n#### 寡婦控除の金額（令和元年分以前）\n\n| 区分 | 控除額 |\n|---|---|\n| 一般の寡婦 | 27万円 |\n| 特別の寡婦 | 35万円 |\n\n### 対象者または対象物\n\n#### 寡婦控除の対象となる人の範囲（令和2年分以後）\n\n寡婦とは、原則としてその年の12月31日の現況で、「[ひとり親](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1171.htm)」に該当せず、次のいずれかに当てはまる人です。納税者と事実上婚姻関係と同様の事情にあると認められる一定の人がいる場合は対象となりません。\n\n（1）夫と離婚した後婚姻をしておらず、扶養親族がいる人で、[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が500万円以下の人\n\n（2）夫と死別した後婚姻をしていない人または夫の生死が明らかでない一定の人で、合計所得金額が500万円以下の人\n\nなお、この場合は、扶養親族の要件はありません。\n\n（注）「夫」とは、民法上の婚姻関係にある人をいいます。\n\n#### 寡婦控除の対象となる人の範囲（令和元年分以前）\n\n納税者が一般の寡婦であるときは、一定の金額の所得控除を受けることができます。\n\n一般の寡婦とは、原則としてその年の12月31日の現況で、次のいずれかに当てはまる人です。\n\n（1）夫と死別し、もしくは夫と離婚した後婚姻をしていない人、または夫の生死が明らかでない一定の人で、扶養親族がいる人または生計を一にする子がいる人。この場合の子は、[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)が38万円以下で、他の人の[同一生計配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word3)や扶養親族となっていない人に限られます。\n\n（2）夫と死別した後婚姻をしていない人または夫の生死が明らかでない一定の人で、合計所得金額が500万円以下の人。この場合は、扶養親族などの要件はありません。\n\n#### 寡婦控除（特別の寡婦）の対象となる人の範囲（令和元年分以前）\n\n一般の寡婦に該当する人が次のすべてに当てはまるときは、特別の寡婦に該当します。\n\n（1）夫と死別しまたは夫と離婚した後婚姻をしていない人や夫の生死が明らかでない一定の人\n\n（2）扶養親族である子がいる人\n\n（3）合計所得金額が500万円以下の人","order":47},{"id":"no1171","cat":"shotoku-kojo","sub":"","kind":"entry","term":"ひとり親控除","yomi":"ひとりおやこうじょ","code":"1171","title":"No.1171 ひとり親控除","summary":"納税者がひとり親であるときは、一定の金額の所得控除を受けることができます。これをひとり親控除といいます。なお、ひとり親控除は令和2年分の所得税から適用されます。","basis":"所法2、81、85、所令11の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1171.htm","md":"### 概要\n\n納税者がひとり親であるときは、一定の金額の所得控除を受けることができます。これをひとり親控除といいます。なお、ひとり親控除は令和2年分の所得税から適用されます。\n\n#### ひとり親控除の金額\n\n| 区分 | 控除額 |\n|---|---|\n| ひとり親控除 | 35万円 |\n\n### 対象者または対象物\n\n#### ひとり親控除の対象となる人の範囲\n\nひとり親とは、原則としてその年の12月31日の現況で、婚姻をしていないことまたは配偶者の生死の明らかでない一定の人のうち、次の3つの要件のすべてに当てはまる人です。\n\n（1）その人と事実上婚姻関係と同様の事情にあると認められる一定の人がいないこと。\n\n（2）[生計を一にする](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1180_qa.htm#q1)子がいること。\n\nこの場合の子は、その年分の[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)が58万円以下（注）（令和2年分から令和6年分までは48万円以下）で、他の人の[同一生計配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word3)や[扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word7)になっていない人に限られます。\n\n（3）[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が500万円以下であること。\n\n（注）令和8年12月1日に施行され、令和8年分から適用される金額は「62万円以下」です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年５月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。","order":48},{"id":"no1172","cat":"shotoku-kojo","sub":"","kind":"entry","term":"寡夫控除","yomi":"かふこうじょ","code":"1172","title":"No.1172 寡夫控除","summary":"納税者自身が寡夫であるときは、一定の金額の所得控除を受けることができます。これを寡夫控除といいます。令和2年分から、ひとり親控除に変わりました。","basis":"旧所法2、81、85、旧所令11の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1172.htm","md":"### 概要\n\n納税者自身が寡夫であるときは、一定の金額の所得控除を受けることができます。これを寡夫控除といいます。令和2年分から、[ひとり親控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1171.htm)に変わりました。\n\n#### 寡夫控除の金額\n\n| 区分 | 控除額 |\n|---|---|\n| 寡夫控除 | 27万円 |\n\n### 対象者または対象物\n\n#### 寡夫控除の対象となる人の範囲（令和元年分以前）\n\n寡夫とは、納税者本人が、原則としてその年の12月31日の現況で、次の3つの要件のすべてに当てはまる人です。\n\n（1）[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が500万円以下であること。\n\n（2）妻と死別し、もしくは妻と離婚した後婚姻をしていないことまたは妻の生死が明らかでない一定の人であること。\n\n（3）生計を一にする子がいること。\n\nこの場合の子は、[総所得金額等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word1)が38万円以下で、他の人の[同一生計配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word3)や[扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word7)になっていない人に限られます。\n\n（注）「妻」とは、民法上の婚姻関係にある者をいいます。","order":49},{"id":"no1175","cat":"shotoku-kojo","sub":"","kind":"entry","term":"勤労学生控除","yomi":"きんろうがくせいこうじょ","code":"1175","title":"No.1175 勤労学生控除","summary":"納税者自身が勤労学生であるときは、一定の金額の所得控除を受けることができます。これを勤労学生控除といいます。","basis":"所法2、82、85、120、194、所令11の3、262、316の2、所規47の2、73の2","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1175.htm","md":"### 概要\n\n納税者自身が勤労学生であるときは、一定の金額の所得控除を受けることができます。これを勤労学生控除といいます。\n\n#### 勤労学生控除の金額\n\n| 区分 | 控除額 |\n|---|---|\n| 勤労学生控除 | 27万円 |\n\n### 対象者または対象物\n\n#### 勤労学生控除の対象となる人の範囲\n\n勤労学生とは、その年の12月31日の現況で、次の3つの要件のすべてに当てはまる人です。\n\n（1）給与所得などの勤労による所得があること\n\n（2）[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が85万円以下（注）（令和2年分から令和6年分までは、75万円以下）で、かつ、（1）の勤労に基づく所得以外の所得が10万円以下であること\n\n（注）令和8年12月１日に施行され、令和8年分から適用される金額は「89万円以下」です。また、給与所得控除についても改正されます。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年５月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n（3）特定の学校の学生、生徒であること\n\nこの場合の特定の学校とは、次のいずれかの学校です。\n\nイ 学校教育法に規定する小学校、中学校、高等学校、大学、高等専門学校など\n\nロ 国、地方公共団体、私立学校法の第3条に規定する学校法人、同法第64条第4項に規定する法人、これらに準ずる一定の者（注1）により設置された専修学校または各種学校のうち一定の課程（注2）を履修させるもの\n\nハ 職業能力開発促進法の規定による認定職業訓練を行う職業訓練法人で一定の課程（注2）を履修させるもの\n\n以上のいずれかの学校に当てはまるかどうか分からないときは、通学している学校の窓口で確認してください。\n\n（注1）一定の者とは、次の者をいいます。\n\n①独立行政法人国立病院機構、独立行政法人労働者健康安全機構、日本赤十字社、商工会議所、健康保険組合、健康保険組合連合会、国民健康保険団体連合会、国家公務員共済組合連合会、社会福祉法人、宗教法人、一般社団法人および一般財団法人ならびに農業協同組合法第10条第1項第11号に掲げる事業を行う農業協同組合連合会および医療法人\n\n②学校教育法第124条に規定する専修学校または同法第134条第1項に規定する各種学校のうち、教育水準を維持するための教員の数その他の文部科学大臣が定める基準を満たすものを設置する者（①に掲げる者を除きます。）\n\n（注2）一定の課程とは、次の課程をいいます。\n\n①専修学校の高等課程および専門課程\n\nイ 職業に必要な技術の教授をすること。\n\nロ その修業期間が一年以上であること。\n\nハ その1年の授業時間数が800時間以上であること（夜間その他特別な時間において授業を行う場合には、その1年の授業時間数が450時間以上であり、かつ、その修業期間を通ずる授業時間数が800時間以上であること。）。\n\nニ その授業が年2回を超えない一定の時期に開始され、かつ、その終期が明確に定められていること。\n\n②①に掲げる課程以外の課程\n\nイ 職業に必要な技術の教授をすること。\n\nロ その修業期間（普通科、専攻科その他これらに類する区別された課程があり、それぞれの修業期間が1年以上であっていずれかの課程に他の課程が継続する場合には、これらの課程の修業期間を通算した期間）が2年以上であること。\n\nハ その1年の授業時間数（普通科、専攻科その他これらに類する区別された課程がある場合には、それぞれの課程の授業時間数）が680時間以上であること。\n\nニ その授業が年2回を超えない一定の時期に開始され、かつ、その終期が明確に定められていること。\n\n### 手続き\n\n#### 申告等の方法\n\nこの控除を受けるためには、給与所得者の場合は、「扶養控除等（異動）申告書」に勤労学生控除に関する事項を記載して勤務先に提出してください。確定申告を行う場合は、確定申告書に勤労学生控除に関する事項を記載して提出してください。\n\nなお、前記の「勤労学生控除の対象となる人の範囲」（3）のロおよびハの専修学校、各種学校またはいわゆる職業訓練学校の生徒等の場合には、在学する専修学校の長等から必要な証明書の交付を受けて申告書に添付するか、または申告書を提出する際に提示してください。\n\nただし、給与所得者の場合で、年末調整の際に控除の適用を受けた人はその必要はありません。\n\n#### 申告先等\n\n所轄税務署または勤務先","order":50},{"id":"no1177","cat":"shotoku-kojo","sub":"","kind":"entry","term":"特定親族特別控除","yomi":"とくていしんぞくとくべつこうじょ","code":"1177","title":"No.1177 特定親族特別控除","summary":"納税者に、生計を一にする年齢19歳以上23歳未満の親族等で、合計所得金額が一定金額以下の控除対象扶養親族に該当しない者（以下「特定親族」といいます。）がいる場合には、一定の金額の所得控除が受けられます。これを特定親族特別控除といいます。","basis":"所法2、84の2、所令217の3","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1177.htm","md":"### 概要\n\n納税者に、生計を一にする年齢19歳以上23歳未満の親族等で、合計所得金額が一定金額以下の控除対象扶養親族に該当しない者（以下「特定親族」といいます。）がいる場合には、一定の金額の所得控除が受けられます。これを特定親族特別控除といいます。\n\n#### 特定親族特別控除の金額\n\n控除額は、特定親族の[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)により次の表のとおりになります。\n\n| 特定親族の合計所得金額 | 控除額 |\n|---|---|\n| 62万円超　85万円以下 | 63万円 |\n| 85万円超　90万円以下 | 61万円 |\n| 90万円超　95万円以下 | 51万円 |\n| 95万円超　100万円以下 | 41万円 |\n| 100万円超　105万円以下 | 31万円 |\n| 105万円超　110万円以下 | 21万円 |\n| 110万円超　115万円以下 | 11万円 |\n| 115万円超　120万円以下 | 6万円 |\n| 120万円超　123万円以下 | 3万円 |\n\n(注１) 上記規定は、令和8年12月1日に施行され、令和8年分以後の所得税について適用されます。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年５月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n(注２) 令和8年11月30日以前に、令和8年分の所得税の死亡または出国に伴う準確定申告書の提出をする方は、上記規定を適用できませんので、令和8年11月30日以前に提出された準確定申告書については、令和8年12月1日以降、更正の請求により上記規定の控除額を適用することができます。\n\n#### 特定親族に該当する人の範囲\n\n特定親族とは、その年の12月31日（納税者が年の中途で死亡しまたは出国する場合は、その死亡または出国の時）の現況で、次の要件のすべてに当てはまる人です。\n\n（注）出国とは、納税管理人の届出をしないで国内に住所および居所を有しないこととなることをいいます。\n\n(1) 配偶者以外の親族（6親等内の血族および3親等内の姻族をいいます。）または都道府県知事から養育を委託された児童（いわゆる里子）であること。\n\n(2) 納税者と生計を一にしていること。\n\n(3) 年齢が19歳以上23歳未満であること。\n\n(4) 青色申告者の事業専従者としてその年を通じて一度も給与の支払を受けていないことまたは白色申告者の事業専従者でないこと。\n\n(5) 年間の[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が123万円以下であること。\n\n（給与のみの場合は給与収入が197万円以下（令和7年分は188万円以下））\n\n(6) [控除対象扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word8)に該当しないこと。\n\n(7) 特定親族自身が特定親族特別控除を適用していないこと。\n\n(8) 特定親族が、扶養控除等申告書に源泉控除対象親族（所得税法第2条第１項第34の5号に規定する親族をいいます。）の特定親族がいる旨を記載し、源泉徴収されていないこと。\n\n(9) 他の者が、給与所得者の扶養控除等申告書あるいは公的年金等の受給者の扶養控除等申告書に、納税者が源泉控除対象親族の特定親族である旨を記載し、源泉徴収されていないこと。\n\n### 対象者または対象物\n\n所得税法第84条の2に規定する特定親族がいる方","order":51},{"id":"no1180","cat":"shotoku-kojo","sub":"","kind":"entry","term":"扶養控除","yomi":"ふようこうじょ","code":"1180","title":"No.1180 扶養控除","summary":"納税者に所得税法上の控除対象扶養親族となる人がいる場合には、一定の金額の所得控除が受けられます。これを扶養控除といいます。","basis":"所法2、79、84、85、措法41の16","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1180.htm","md":"### 概要\n\n納税者に所得税法上の控除対象扶養親族となる人がいる場合には、一定の金額の所得控除が受けられます。これを扶養控除といいます。\n\n#### 扶養控除の金額\n\n控除額は、扶養親族の年齢、同居の有無等により次の表のとおりです。\n\n| 区分 | 区分 | 控除額 |\n|---|---|---|\n| 一般の[控除対象扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word8) |  | 38万円 |\n| [特定扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word9) |  | 63万円 |\n| [老人扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word10) | 同居老親等以外の者 | 48万円 |\n| [老人扶養親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word10) | [同居老親等](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word11) | 58万円 |\n\n（注）同居老親等の「同居」については、病気の治療のため入院していることにより納税者等と別居している場合は、その期間が結果として1年以上といった長期にわたるような場合であっても、同居に該当するものとして取り扱って差し支えありません。ただし、老人ホーム等へ入所している場合には、その老人ホームが居所となり、同居しているとはいえません。\n\n### 対象者または対象物\n\n#### 扶養親族に該当する人の範囲\n\n扶養親族とは、その年の12月31日（納税者が年の中途で死亡しまたは出国する場合は、その死亡または出国の時）の現況で、次の4つの要件のすべてに当てはまる人です。\n\n（注）出国とは、納税管理人の届出をしないで国内に住所および居所を有しないこととなることをいいます。\n\n（1）配偶者以外の[親族](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1180_qa.htm#q8)（6親等内の血族および3親等内の姻族をいいます。）または都道府県知事から養育を委託された児童（いわゆる里子）や市町村長から養護を委託された老人であること。\n\n（2）納税者と生計を一にしていること。\n\n（3）年間の[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が58万円以下（注）（令和2年分から令和6年分までは48万円以下）であること。\n\n（給与のみの場合は給与収入が123万円以下（令和2年分から令和6年分までは103万円以下））\n\n（4）[青色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm#a-1)としてその年を通じて一度も給与の支払を受けていないことまたは[白色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm#a-2)でないこと。\n\n（注）令和8年12月1日に施行され、令和8年分から適用される金額は「62万円以下」です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n#### 控除対象扶養親族に該当する人の範囲\n\n控除対象扶養親族とは、扶養親族のうち、その年12月31日現在の年齢が16歳以上の人をいいます。\n\nただし、令和5年分以後の所得税においては、[非居住者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2875.htm)である扶養親族については、次に掲げるいずれかに該当する人に限り、控除対象扶養親族に該当します。\n\n（1）　その年12月31日現在の年齢が16歳以上30歳未満の人\n\n（2）　その年12月31日現在の年齢が70歳以上の人\n\n（3）　その年12月31日現在の年齢が30歳以上70歳未満の人であって次に掲げるいずれかに該当する人\n\nイ　留学により国内に住所および居所を有しなくなった人\n\nロ　障害者である人\n\nハ　納税者からその年において生活費または教育費に充てるための支払を38万円以上受けている人","order":52},{"id":"no1191","cat":"shotoku-kojo","sub":"","kind":"entry","term":"配偶者控除","yomi":"はいぐうしゃこうじょ","code":"1191","title":"No.1191 配偶者控除","summary":"納税者に所得税法上の控除対象配偶者がいる場合には、一定の金額の所得控除が受けられます。これを配偶者控除といいます。","basis":"所法2、79、83、83の2、85、所基通2-46、2-47、措法41の16","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1191.htm","md":"### 概要\n\n納税者に所得税法上の控除対象配偶者がいる場合には、一定の金額の所得控除が受けられます。これを配偶者控除といいます。\n\n#### 配偶者控除の金額\n\n控除額は、控除を受ける納税者本人の[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)、および控除対象配偶者の年齢により次の表のとおりになります。\n\n| 控除を受ける納税者本人の<br>合計所得金額 | 控除額 | 控除額 |\n|---|---|---|\n| 控除を受ける納税者本人の<br>合計所得金額 | 一般の控除対象配偶者 | [老人控除対象配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word5) |\n| 900万円以下 | 38万円 | 48万円 |\n| 900万円超950万円以下 | 26万円 | 32万円 |\n| 950万円超1,000万円以下 | 13万円 | 16万円 |\n\n（注1）　配偶者が障害者の場合には、配偶者控除の他に障害者控除27万円（特別障害者の場合は40万円、同居特別障害者の場合は75万円）が控除できます。\n\n（注2）　配偶者控除の適用がない方で、納税者本人の合計所得金額が1,000万円以下であり、かつ、配偶者の合計所得金額が62万円超（※）133万円以下（令和7年分は58万円を超え133万円以下、令和2年分から令和6年分までは48万円を超え133万円以下、平成30年分から令和元年分までは38万円を超え123万円以下）である方については、[配偶者特別控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1195.htm)の適用を受けることができます。また、配偶者特別控除額は最高で38万円ですが、配偶者特別控除の適用を受ける納税者本人の合計所得金額および配偶者の合計所得金額に応じて異なります。\n\n※　令和8年12月1日に施行され、令和8年分から適用される金額です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n#### 控除対象配偶者となる人の範囲\n\n控除対象配偶者とは、その年の12月31日の現況で、次の4つの要件のすべてに当てはまる人です。\n\nなお、控除を受ける納税者本人の合計所得金額が1,000万円を超える場合は、配偶者控除は受けられません。\n\n（1）民法の規定による配偶者であること（内縁関係の人は該当しません。）。\n\n（2）納税者と生計を一にしていること。\n\n（3）年間の合計所得金額が62万円以下（注）（令和7年分は58万円以下、令和2年分から令和6年分までは48万円以下、令和元年分以前は38万円以下）であること。給与のみの場合は給与収入が136万円以下（令和7年分は123万円以下、令和6年分以前は103万円以下）\n\n（注）　令和8年12月1日に施行され、令和8年分から適用される金額です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n（4）[青色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm)としてその年を通じて一度も給与の支払を受けていないことまたは[白色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm)でないこと。\n\n### 対象者または対象物\n\n所得税法上の控除対象配偶者がいる方","order":53},{"id":"no1195","cat":"shotoku-kojo","sub":"","kind":"entry","term":"配偶者特別控除","yomi":"はいぐうしゃとくべつこうじょ","code":"1195","title":"No.1195 配偶者特別控除","summary":"配偶者に62万円（注）（令和7年分は58万円、令和2年分から令和6年分までは48万円、令和元年分以前は38万円）を超える所得があるため配偶者控除の適用が受けられないときでも、配偶者の所得金額に応じて、一定の金額の所得控除が受けられる場合があります。これを配偶者特別控除といいます。","basis":"所法2、83の2、120、190、195の2、所基通2-46、平29改正法附則6","asOf":"令和8年4月1日現在法令等","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1195.htm","md":"### 概要\n\n配偶者に62万円（注）（令和7年分は58万円、令和2年分から令和6年分までは48万円、令和元年分以前は38万円）を超える所得があるため[配偶者控除](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1191.htm)の適用が受けられないときでも、配偶者の所得金額に応じて、一定の金額の所得控除が受けられる場合があります。これを配偶者特別控除といいます。\n\n（注）　令和8年12月1日に施行され、令和8年分から適用される金額です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\nなお、配偶者特別控除は夫婦の間で互いに受けることはできません。\n\n#### 配偶者特別控除を受けるための要件\n\n（1）控除を受ける納税者本人のその年における[合計所得金額](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word2)が1,000万円以下であること。\n\n（2）配偶者が、次の要件すべてに当てはまること。\n\nイ　民法の規定による配偶者であること（内縁関係の人は該当しません）。\n\nロ　控除を受ける人と生計を一にしていること。\n\nハ　その年に[青色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm#a-1)としての給与の支払を受けていないことまたは[白色申告者の事業専従者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2075.htm#a-2)でないこと。\n\nニ　年間の合計所得金額が62万円超（注）133万円以下（令和7年分は58万円を超え133万円以下、令和2年分から令和6年分までは48万円を超え133万円以下、平成30年分から令和元年分までは38万円を超え123万円以下）であること。\n\n（注）　令和8年12月1日に施行され、令和8年分から適用される金額です。施行日前の適用関係などについては、「[令和8年度税制改正（所得税の基礎控除の引上げ等関係）Ｑ＆Ａ（令和8年5月）（PDF/299KB）](https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf)」をご確認ください。\n\n（3）配偶者が、配偶者特別控除を適用していないこと。\n\n（4）配偶者が、給与所得者の扶養控除等申告書または従たる給与についての扶養控除等申告書に記載された源泉控除対象配偶者がある居住者として、源泉徴収されていないこと（配偶者が年末調整や確定申告で配偶者特別控除の適用を受けなかった場合等を除きます。）。\n\n（5）配偶者が、公的年金等の受給者の扶養親族等申告書に記載された[源泉控除対象配偶者](https://www.nta.go.jp/taxes/shiraberu/taxanswer/yogo/senmon.htm#word6)がある居住者として、源泉徴収されていないこと（配偶者が年末調整や確定申告で配偶者特別控除の適用を受けなかった場合等を除きます。）。\n\n#### 配偶者特別控除の金額\n\n控除額は、控除を受ける納税者本人のその年における合計所得金額および配偶者の合計所得金額に応じて次の表のようになります。\n\n#### 令和8年分以降\n\n|  |  | 控除を受ける納税者本人の合計所得金額 | 控除を受ける納税者本人の合計所得金額 | 控除を受ける納税者本人の合計所得金額 |\n|---|---|---|---|---|\n|  |  | 900万円以下 | 900万円超<br>950万円以下 | 950万円超<br>1,000万円以下 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 62万円超　95万円以下 | 38万円 | 26万円 | 13万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 95万円超　100万円以下 | 36万円 | 24万円 | 12万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 100万円超　105万円以下 | 31万円 | 21万円 | 11万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 105万円超　110万円以下 | 26万円 | 18万円 | 9万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 110万円超　115万円以下 | 21万円 | 14万円 | 7万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 115万円超　120万円以下 | 16万円 | 11万円 | 6万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 120万円超　125万円以下 | 11万円 | 8万円 | 4万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 125万円超　130万円以下 | 6万円 | 4万円 | 2万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 130万円超　133万円以下 | 3万円 | 2万円 | 1万円 |\n\n（注）　令和8年12月1日に施行され、令和8年分から適用される金額です。\n\n#### 令和7年分\n\n|  |  | 控除を受ける納税者本人の合計所得金額 | 控除を受ける納税者本人の合計所得金額 | 控除を受ける納税者本人の合計所得金額 |\n|---|---|---|---|---|\n|  |  | 900万円以下 | 900万円超<br>950万円以下 | 950万円超<br>1,000万円以下 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 58万円超　95万円以下 | 38万円 | 26万円 | 13万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 95万円超　100万円以下 | 36万円 | 24万円 | 12万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 100万円超　105万円以下 | 31万円 | 21万円 | 11万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 105万円超　110万円以下 | 26万円 | 18万円 | 9万円 |\n| 配<br>偶<br>者<br>の<br>合<br>計<br>所<br>得<br>金<br>額 | 110万円超
